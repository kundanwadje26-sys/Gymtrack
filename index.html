<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kundan's Gym">
<meta name="description" content="Kundan's Gym Tracker: warm-up, workout plan, animated form guides and session history.">
<title>Kundan's Gym Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23f2b84b'/><text x='32' y='47' font-family='Arial Narrow,Arial' font-weight='700' font-size='42' text-anchor='middle' fill='%23141317'>K</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23f2b84b'/><text x='32' y='47' font-family='Arial Narrow,Arial' font-weight='700' font-size='42' text-anchor='middle' fill='%23141317'>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141317;--s1:#1d1b21;--s2:#27242c;--line:#332f39;
  --chalk:#f3eee6;--muted:#a59f97;--gold:#f2b84b;--gold-d:#8f6a1d;
  --muscle:#ff5436;--muscle-2:#ff9f8a;--ok:#6fd08c;--idle:#4a4651;--sil:#2f2c35;--plate:#1d1b21;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--chalk);font:400 16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
canvas{display:block;width:100%;height:100%}
#app{max-width:720px;margin:0 auto;padding:0 16px 110px}
body.in-session #app{padding-bottom:40px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:14px}
.hl{color:var(--gold)}

/* brand */
.brand{display:flex;align-items:center;gap:12px;padding:16px 0 10px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--bg);display:grid;place-items:center;font:700 28px/1 var(--display);flex:none;box-shadow:0 0 0 3px rgba(242,184,75,.18)}
.brand b{display:block;font:700 22px/1.05 var(--display);letter-spacing:.01em}
.brand small{color:var(--muted);font-size:13.5px}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:end;background:radial-gradient(120% 90% at 85% 30%,rgba(242,184,75,.16),transparent 60%),var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px 18px 18px;margin:8px 0 16px;overflow:hidden}
.hero-anim{grid-column:2;grid-row:1;height:170px;width:130px;align-self:center}
.hero-txt{grid-column:1;grid-row:1}
.hero h1{font:700 clamp(40px,11vw,58px)/.92 var(--display);margin:0 0 10px;letter-spacing:-.01em}
.hero p{margin:0 0 16px;color:#d9d3ca;max-width:34ch}
.hero p b{color:var(--gold);font-weight:600}
.done-hero h1{color:var(--gold)}
.cta{border:0;border-radius:14px;background:var(--gold);color:#17140c;font:700 21px/1 var(--display);letter-spacing:.02em;padding:15px 22px;box-shadow:0 6px 20px -8px rgba(242,184,75,.6)}
.cta:active{transform:translateY(1px)}
.cta.wide{width:100%}
.cta.is-done{background:var(--s2);color:var(--ok);box-shadow:none;font-size:17px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px;font-size:15px;display:block;margin:4px auto 0}
.link.danger{color:#e98b7c;margin:22px 0 0;padding:6px 0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:700 30px/1 var(--display);color:var(--chalk)}
.stat b small{font-size:18px;color:var(--muted)}
.stat span{font-size:13px;color:var(--muted);line-height:1.25;display:block;margin-top:4px}
.banner{background:rgba(242,184,75,.12);border:1px solid var(--gold-d);border-radius:14px;padding:12px 14px;margin-bottom:16px}
h2.sec{font:700 24px/1.1 var(--display);margin:26px 0 8px}
.mini{list-style:none;margin:0;padding:0}
.mini button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.mini b,.hcard b{display:block;font-weight:600}
.mini small,.hcard small{color:var(--muted);font-size:13.5px}
.pill{font-size:13px;background:var(--s2);border-radius:999px;padding:5px 10px;white-space:nowrap;color:#d9d3ca}
details.rules{background:var(--s1);border-radius:14px;margin:18px 0 0;border:1px solid var(--line)}
details.rules summary{padding:13px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.rules summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}
details.rules[open] summary::after{content:"–"}
details.rules ul{margin:0;padding:0 14px 14px 32px} details.rules li{margin:5px 0}
details.rules strong{color:var(--gold);font-weight:600}

/* session */
.sbar{position:sticky;top:0;z-index:20;margin:0 -16px;background:rgba(20,19,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sbar-in{display:flex;align-items:center;gap:12px;padding:10px 16px}
.sbar-in>div:first-child{flex:1;min-width:0}
.sbar small{display:block;color:var(--gold);font-size:12.5px;font-weight:600}
.sbar b{display:block;font:700 20px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elapsed{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--muted)}
.pagehead{padding:18px 0 6px}
.pagehead h1{font:700 clamp(36px,9vw,48px)/.95 var(--display);margin:0 0 8px}
.pagehead p{margin:0 0 10px;color:#d4cec5}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;margin:6px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd585);border-radius:99px;transition:width .4s}
.bar.big{height:10px}

.cards{list-style:none;margin:8px 0 0;padding:0}
.card{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;transition:border-color .3s,background .3s}
#libList .card{grid-template-columns:92px 1fr}
.card.is-done{border-color:rgba(111,208,140,.45);background:linear-gradient(90deg,rgba(111,208,140,.08),transparent 60%),var(--s1)}
.anim-thumb{width:92px;height:92px;border:0;padding:0;border-radius:14px;background:radial-gradient(80% 70% at 50% 45%,#2a2730,#19181d);overflow:hidden}
.card-body{min-width:0}
.cname{background:none;border:0;padding:0;text-align:left;font:600 21px/1.1 var(--display);letter-spacing:.01em;display:block;width:100%}
.dose{font-size:14.5px;color:var(--muted);margin-top:3px}
.dose b{color:var(--chalk);font-weight:600}
.mus{font-size:13.5px;color:var(--muscle-2);margin-top:2px}
.donetxt{font-size:13.5px;color:var(--ok);margin-top:2px}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.setbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;font:600 15px var(--display);color:var(--muted);display:grid;place-items:center;padding:0}
.setbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#17140c}
.chipbtn{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chipbtn svg{width:15px;height:15px}
.donebtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;align-self:center}
.donebtn svg{width:24px;height:24px;opacity:.5}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#0f2416}
.donebtn[aria-pressed="true"] svg{opacity:1}
.dock{position:sticky;bottom:0;margin:18px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}

.dgroup{margin-top:8px}
.dgroup h2.sec{margin-bottom:0}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dcard{position:relative;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:150px}
.dcard.sugg{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.dnum{font:700 30px/1 var(--display)}
.tag{position:absolute;top:12px;right:12px;background:var(--gold);color:#17140c;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.dmeta{color:var(--gold);font-size:14px;font-weight:600}
.dlist{color:var(--muted);font-size:13.5px;line-height:1.35;flex:1}
.dlast{font-size:12.5px;color:#8d877f}

.timeline{list-style:none;margin:6px 0 10px;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:70px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl{display:grid;grid-template-columns:62px 1fr;gap:18px;padding:7px 0;position:relative}
.tl::after{content:"";position:absolute;left:66px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--s2);border:2px solid var(--muted)}
.tl.ok::after{background:var(--ok);border-color:var(--ok)}
.tl .t{font-size:13.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;padding-top:1px}
.tl b{display:block;font-weight:600;line-height:1.3}
.tl small{color:var(--muted);font-size:13.5px}
.hcard{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;padding:0 14px}
.hcard summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0}
.hcard[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.kglist{list-style:none;padding:0;margin:0}
.kglist li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting small{display:block;color:var(--muted);font-size:13.5px}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--chalk)}
.seg.sm button{padding:5px 10px;font-size:13px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--s2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--gold)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:#17140c}

.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);font-size:16px;margin:4px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--muscle);color:var(--chalk);background:rgba(255,84,54,.16)}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,19,23,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav-in{max-width:520px;margin:0 auto;display:flex}
.bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.bnav svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--gold)}
body.in-session .bnav{display:none}

/* sheet */
dialog#sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--chalk)}
dialog#sheet::backdrop{background:rgba(0,0,0,.6)}
.sheet-in{height:100%;overflow-y:auto;overscroll-behavior:contain}
.sheet-bar{position:sticky;top:0;z-index:3;background:rgba(20,19,23,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.35;cursor:default}
.sheet-bar .pos{flex:1;text-align:center;color:var(--muted);font-size:14px}
.sheet-body{max-width:760px;margin:0 auto;padding:14px 16px calc(130px + env(safe-area-inset-bottom,0px))}
.sheet-body h2{font:700 clamp(34px,9vw,52px)/.95 var(--display);margin:4px 0 4px}
.aka{color:var(--muted);margin:0 0 12px}
.media{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.media{grid-template-columns:1.4fr 1fr}}
.stage{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(70% 60% at 50% 45%,#2b2831,#16151a);border:1px solid var(--line);aspect-ratio:6/5}
.stage canvas{position:absolute;inset:0}
.stage-ctrl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center}
.stage-ctrl>button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,19,23,.85);display:grid;place-items:center;padding:0}
.stage-ctrl>button svg{width:16px;height:16px}
.stage-ctrl .seg{background:rgba(20,19,23,.85)}
.glowkey{position:absolute;left:10px;top:10px;background:rgba(20,19,23,.8);border-radius:999px;padding:5px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.glowkey i{width:10px;height:10px;border-radius:50%;background:var(--muscle);box-shadow:0 0 8px var(--muscle)}
.mapcard{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px}
.mapcard svg{width:100%;height:auto;max-height:230px}
@media (min-width:700px){.mapcard svg{max-height:320px}}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{font-size:13px;border-radius:999px;padding:4px 10px}
.mchip.p{background:var(--muscle);color:#1a0d09;font-weight:600}
.mchip.s{background:rgba(255,159,138,.15);color:var(--muscle-2)}
.tracker{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin:14px 0 4px;display:grid;gap:12px}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl{font-size:13.5px;color:var(--muted)}
.bigdose{font:700 28px/1 var(--display)}
.kg{display:flex;align-items:center;gap:6px}
.kg input{width:86px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:600;text-align:center}
.kg span{color:var(--muted);font-size:14px}
.tracker .setbtn{width:42px;height:42px;font-size:17px}
.block{margin-top:24px}
.block h3{font:700 22px/1.1 var(--display);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.block h3 svg{width:20px;height:20px;flex:none;color:var(--gold)}
.block.cues h3 svg{color:var(--ok)} .block.avoid h3 svg{color:var(--muscle)}
.block ul,.block ol{margin:0;padding-left:22px}
.block li{margin:7px 0;max-width:68ch}
.block ol li::marker{font:700 17px var(--display);color:var(--gold)}
.block.cues li::marker{color:var(--ok)} .block.avoid li::marker{color:var(--muscle)}
.block p{margin:0;max-width:68ch}
.callout{background:var(--s1);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 14px}
.stretch{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.snum{width:30px;height:30px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font:700 16px var(--display);color:var(--gold)}
.stretch b{font:600 19px/1.15 var(--display);display:block;margin-bottom:3px}
.stretch p{margin:0 0 8px;font-size:15px}
.vid{display:inline-flex;align-items:center;gap:8px;margin-top:22px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--chalk);text-decoration:none;font-weight:600}
.vid svg{width:20px;height:20px;color:#ff4e45}
.pager{display:flex;gap:10px;margin-top:26px}
.pager button{flex:1;border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:12px;text-align:left}
.pager button small{display:block;color:var(--muted);font-size:12.5px}
.pager button span{font:600 17px/1.15 var(--display)}
.pager button:last-child{text-align:right}
.pager button:disabled{visibility:hidden}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--s1);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.timer.show{transform:none}
body.timer-on .dock{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.timer-on .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.timer-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .clock{font:700 46px/1 var(--display);min-width:96px;font-variant-numeric:tabular-nums}
.timer .what{flex:1;min-width:0}
.timer .what b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .what small{color:var(--muted)}
.timer .tbar{position:absolute;left:0;top:0;height:3px;background:var(--gold);transition:width .25s linear}
.timer button{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px 12px;font-weight:600}
.timer.ended .clock{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:70;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{color:#6f6a73;font-size:13px;text-align:center;margin:36px 0 0}
@media (min-width:600px){.hero{grid-template-columns:1fr 200px}.hero-anim{width:200px;height:220px}.card{grid-template-columns:110px 1fr auto}.wtop{grid-template-columns:110px 1fr auto}.anim-thumb{width:110px;height:110px}}

/* ---- v3 additions ---- */
.cta svg{width:20px;height:20px;vertical-align:-3px;margin-right:6px}
body:not(.in-session) .dock{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
body:not(.in-session).timer-on .dock{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
.dosed input[data-f$=":time"]{width:64px}
.panel .frow input[type=number]{flex:1;min-width:90px}
.kglist li>span{display:flex;align-items:center;gap:8px}

<script>
/* =========================================================
   KUNDAN ANIMATION ENGINE
   2D mannequin rig with inverse kinematics.
   Views: 'side' (figure faces right), 'front', 'back'.
   ========================================================= */
const RIG={torso:50,ua:29,fa:26,th:42,sh:40,foot:13};
const FLOOR=188;
const COL={body:'#67626f',far:'#3f3c46',idle:'#7a7584',idleFar:'#4a4651',hot:[255,84,54],idleRGB:[122,117,132],idleFarRGB:[74,70,81],
  steel:'#77737f',steelD:'#4a4752',pad:'#2e2b33',padE:'#3d3a44',gold:'#e2b13c',floor:'#24222a'};
const D2R=Math.PI/180;
function ik(r,t,a,b,s){
  const dx=t[0]-r[0],dy=t[1]-r[1];let d=Math.hypot(dx,dy);const base=Math.atan2(dy,dx);
  d=Math.max(Math.abs(a-b)+0.5,Math.min(a+b-0.05,d));
  const c=(a*a+d*d-b*b)/(2*a*d);const al=Math.acos(Math.max(-1,Math.min(1,c)));const g=base+s*al;
  return [[r[0]+a*Math.cos(g),r[1]+a*Math.sin(g)],[r[0]+d*Math.cos(base),r[1]+d*Math.sin(base)]];
}
function mix(a,b,t){
  if(a===undefined) return b; if(b===undefined) return a;
  if(typeof a==='number') return a+(b-a)*t;
  if(Array.isArray(a)) return a.map((v,i)=>mix(v,b[i],t));
  if(typeof a==='object'&&a){const o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>o[k]=mix(a[k],b[k],t));return o;}
  return t<0.5?a:b;
}
const ease=t=>t<0?0:t>1?1:t*t*t*(t*(t*6-15)+10);
const lerp2=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
const add=(p,v,k=1)=>[p[0]+v[0]*k,p[1]+v[1]*k];
function nrmLimb(p0,p1){const dx=p1[0]-p0[0],dy=p1[1]-p0[1],l=Math.hypot(dx,dy)||1;return [dy/l,-dx/l];}
function nrmTorso(p0,p1){const dx=p1[0]-p0[0],dy=p1[1]-p0[1],l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l];}

/* ---------- pose resolution ---------- */
function solveSide(P){
  const H=P.hip, a=(P.tA||0)*D2R;
  const S=[H[0]+RIG.torso*Math.sin(a),H[1]-RIG.torso*Math.cos(a)];
  const na=a+(P.nA||0)*D2R;
  const Nk=[S[0]+7*Math.sin(na),S[1]-7*Math.cos(na)];
  const Hd=[S[0]+17*Math.sin(na),S[1]-17*Math.cos(na)];
  const off=[-2.5,-1.5];
  const Sf=add(S,off), Hf=add(H,off);
  const hN=P.hN, hF=P.hF||add(P.hN,off);
  const fN=P.fN, fF=P.fF||add(P.fN,off);
  const [eN,wN]=ik(S,hN,RIG.ua,RIG.fa,P.eB??1);
  const [eF,wF]=ik(Sf,hF,RIG.ua,RIG.fa,P.eBF??P.eB??1);
  const [kN,aN]=ik(H,fN,RIG.th,RIG.sh,P.kB??-1);
  const [kF,aF]=ik(Hf,fF,RIG.th,RIG.sh,P.kBF??P.kB??-1);
  const ft=(an,deg)=>[an[0]+RIG.foot*Math.cos(deg*D2R),an[1]+RIG.foot*Math.sin(deg*D2R)];
  return {view:'side',H,S,Nk,Hd,na,Sf,Hf,eN,wN,eF,wF,kN,aN,kF,aF,
    tN:ft(aN,P.ftN??0),tF:ft(aF,P.ftF??P.ftN??0)};
}
function solveFront(P){
  const C=P.c, a=(P.tA||0)*D2R, ux=[Math.cos(a),Math.sin(a)], up=[Math.sin(a),-Math.cos(a)];
  const at=(x,u)=>[C[0]+ux[0]*x+up[0]*u*RIG.torso, C[1]+ux[1]*x+up[1]*u*RIG.torso];
  const lift=P.sh||0;
  const SA=add(at(-18,1),[0,-lift]), SB=add(at(18,1),[0,-lift]);
  const na=a+(P.nA||0)*D2R;
  const top=at(0,1);
  const Nk=[top[0]+7*Math.sin(na),top[1]-7*Math.cos(na)];
  const Hd=[top[0]+17*Math.sin(na),top[1]-17*Math.cos(na)];
  const HA=at(-9,0), HB=at(9,0);
  let eA,wA,eB,wB;
  if(P.eA){eA=P.eA;wA=P.hA;} else [eA,wA]=ik(SA,P.hA,RIG.ua,RIG.fa,P.ebA??-1);
  if(P.eBx){eB=P.eBx;wB=P.hB;} else [eB,wB]=ik(SB,P.hB,RIG.ua,RIG.fa,P.ebB??1);
  let kA,aA,kB,aB;

/* ---------- drawing primitives ---------- */
function cap(ctx,p,q,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
function dot(ctx,p,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill();}
function heat(level,far){
  const base=far?COL.idleFarRGB:COL.idleRGB;
  const k=Math.max(0,Math.min(1,level));
  const c=base.map((v,i)=>Math.round(v+(COL.hot[i]-v)*k));
  return 'rgb('+c.join(',')+')';
}
/* lens-shaped muscle along a segment */
function lens(ctx,p0,p1,u0,u1,n,side,off,depth,lvl,far,bulge){
  const a=add(lerp2(p0,p1,u0),n,side*off), b=add(lerp2(p0,p1,u1),n,side*off);
  const m=lerp2(a,b,.5), d=depth*(1+(bulge||0)*lvl*0.35);

  paintMuscle(ctx,lvl,far,()=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(c1[0],c1[1],b[0],b[1]);ctx.quadraticCurveTo(c2[0],c2[1],a[0],a[1]);ctx.closePath();});
}
function blob(ctx,p,rx,ry,rot,lvl,far){
  paintMuscle(ctx,lvl,far,()=>{ctx.beginPath();ctx.ellipse(p[0],p[1],rx,ry,rot||0,0,7);});

function paintMuscle(ctx,lvl,far,path){
  ctx.save();
  if(lvl>0.05&&!far){ctx.shadowColor='rgba(255,84,54,'+(0.85*lvl)+')';ctx.shadowBlur=14*lvl;}
  path();ctx.fillStyle=heat(lvl,far);ctx.fill();

  ctx.restore();
}

/* ---------- body renderers ---------- */
function drawSide(ctx,J,M){

  const v0=add(add(J.Hd,fn,7.5),fd,1.5),v1=add(add(J.Hd,fn,9.2),fd,-2.5);ctx.moveTo(v0[0],v0[1]);ctx.lineTo(v1[0],v1[1]);ctx.stroke();ctx.restore();
  // torso muscles
  lens(ctx,H,S,0.62,0.97,n,1,7.5,4.6,L('chest'),false,1);

function legSide(ctx,H,K,A,T,far,L){

function legFront(ctx,H,K,A,L,back,side){

function normPose(P,v){

  o._n=1;return o;
}
function frameAt(an,phase){
  if(an.cyc){const r=an.cyc(phase);return {P:r.p,e:r.e,hl:null};}
  const K=an.keys,n=K.length,x=phase*n,i=Math.floor(x)%n,f=x-Math.floor(x),hold=an.hold??0.22;

  return {P:mix(a.p,b.p,t),e:a.e+(b.e-a.e)*t,hl:(t<0.5?a.hl:b.hl)||null};

function animBox(id){

  for(let k=0;k<24;k++){const J=solveAt(an,k/24);

  ease:''},

crosstrainer:{n:'Crosstrainer',aka:'Elliptical / cross trainer',
  p:['quads','glutes'],s:['hamstrings','calves','chest','lats'],
  setup:['Step on with your feet flat in the centre of the pedals.','Hold the moving handles at about chest height.','Stand tall — chest up, shoulders relaxed.'],
  steps:['Minutes 0–3: easy pace, low resistance, to warm up.','Minutes 3–12: raise resistance to a level where you breathe hard but can still speak in short sentences. Push and pull the handles so your arms work too.','Minutes 12–15: lower the resistance and slow down to cool off.'],
  breathe:'Steady rhythmic breathing. If you\'re gasping, lower the resistance.',
  cues:['Keep your heels down on the pedals as much as you can.','Knees point straight ahead.','For variety: alternate 1 minute fast and 1 minute easy in the middle section.'],
  avoid:['Leaning your body weight onto the handles.','Hunching over the console.','Zero resistance with very fast legs.'],
  ease:'Use the fixed handles and keep the resistance low.'},

battlerope:{n:'Battle Rope',aka:'Alternating waves',
  p:['shoulders'],s:['forearms','abs','rear_delts','glutes'],
  setup:['Stand facing the anchor and hold one rope end in each hand.','Step back until the ropes have only a little slack.','Feet shoulder-width apart, knees bent into a quarter squat, hips back, chest up, stomach tight.','Grip the ends like a handshake, thumbs on top.'],
  steps:['Raise one arm quickly to about shoulder height while the other arm goes down.','Keep alternating fast so waves travel all the way to the anchor.','Each arm hit counts as one. Do 50 hits in total.','Rest 30–45 seconds, then repeat for 3 rounds.'],
  breathe:'Short quick breaths in rhythm with the waves. Don\'t hold your breath.',
  cues:['Power comes from your shoulders with slightly bent elbows.','Stay low in the quarter squat for the whole round.','Big waves beat fast tiny flicks.'],
  avoid:['Standing up straight (this loads your lower back).','Rounding your back.','Tiny arm-only waves that die halfway.'],
  ease:'Step closer to the anchor for more slack — lighter waves.'},

crunch:{n:'Crunches',aka:'Floor crunch',
  p:['abs'],s:['obliques'],
  setup:['Lie on your back with knees bent at about 90° and feet flat, hip-width apart.','Fingertips lightly behind your ears (not hands clasped behind your head) or arms crossed on your chest.','Lower back gently pressed into the floor. Keep a fist-sized gap between chin and chest.'],
  steps:['Breathe out and curl your upper back off the floor, bringing your ribs toward your hips.','Lift until your shoulder blades are off the floor.','Pause for one second and squeeze your abs.','Lower slowly, keeping a little tension — don\'t flop down.'],
  breathe:'Breathe out as you crunch up, breathe in as you lower.',
  cues:['It\'s a small movement: you\'re curling, not sitting up.','Look at the ceiling, not your knees, to protect your neck.','Squeeze at the top every rep.'],
  avoid:['Pulling on your neck with your hands.','Sitting all the way up (the hip muscles take over).','Jerking up fast.','Feet lifting off the floor.'],
  ease:'Arms straight, reaching toward your knees as you curl.'},

revcrunch:{n:'Rev. Crunches',aka:'Reverse crunch (lower abs)',
  p:['abs'],s:['obliques'],
  setup:['Lie on your back, arms by your sides with palms down (or hold a bench behind your head).','Lift your legs so your thighs are vertical and knees bent at 90°.','Press your lower back into the floor.'],
  steps:['Breathe out and curl your hips off the floor, bringing your knees toward your chest.','Think of rolling your tailbone up — the lower abs do the work.','Lower your hips slowly back down until your thighs return to vertical.'],
  breathe:'Breathe out as you curl up, breathe in as you lower.',
  cues:['Slow and controlled; the lift is only a few centimetres.','Keep your knee angle the same throughout.','Don\'t let your feet touch the floor between reps.'],
  avoid:['Swinging your legs to create momentum.','Pushing hard into the floor with your hands.','Lower back arching as you lower.'],
  ease:'Keep the movement smaller and pause at the bottom.'},

sidecrunch:{n:'Side Crunches',aka:'Oblique crunch on the floor',
  p:['obliques'],s:['abs'],
  setup:['Lie on your back with knees bent, then drop both knees together to one side so your hips turn.','Keep your shoulders as flat on the floor as possible.','Fingertips lightly behind your ears.'],
  steps:['Breathe out and curl your shoulders straight up toward the ceiling.','You\'ll feel the side of your stomach working.','Pause, then lower slowly.','Do all 12 reps, then drop your knees to the other side and repeat.'],
  breathe:'Breathe out as you crunch, breathe in as you lower.',
  cues:['Lift straight up, not toward your knees.','Keep your elbows wide.','Short range, steady pace.'],
  avoid:['Yanking on your neck.','Knees drifting back to the centre.','Rushing.'],
  ease:'Cross your arms on your chest instead of hands behind the head.'},

sidebend:{n:'Side Bend on M.',aka:'Cable / machine side bend',
  p:['obliques'],s:['lower_back','abs'],
  setup:['Stand side-on to a low cable pulley (or side bend machine), feet hip-width apart.','Hold the handle in the hand nearest the machine, arm straight. Other hand on your hip or behind your head.','Stand tall with stomach tight.'],
  steps:['Bend slowly sideways toward the machine, letting the handle pull you down along your leg.','Bend only to the side — no twisting or leaning forward.','Use the opposite side of your waist to pull yourself back upright and slightly past centre.','Do 12 reps, then turn around and do the other side.'],
  breathe:'Breathe in as you bend down, breathe out as you come up.',
  cues:['Imagine you\'re between two panes of glass: only sideways movement.','Keep your arm straight; it\'s just a hook.','Moderate weight, slow reps.'],
  avoid:['Leaning forward or backward.','Twisting your torso.','Holding weight in both hands (it cancels the work).','Heavy, jerky reps.'],
  ease:'Do it with no weight, hands behind your head.'},

plank:{n:'Fore Arm Plank',aka:'Elbow plank hold',
  p:['abs'],s:['obliques','shoulders','glutes','quads'],
  setup:['Forearms on the floor, elbows directly under your shoulders, forearms parallel (or hands lightly clasped).','Feet hip-width apart, up on your toes.','Body in one straight line from head to heels.'],
  steps:['Tighten your stomach as if pulling your belly button toward your spine.','Squeeze your glutes and thighs.','Push the floor away with your forearms so your upper back doesn\'t sag.','Hold for 60 seconds, breathing steadily. If your form breaks, drop to your knees and finish the time.'],
  breathe:'Breathe slowly and steadily the whole time. Never hold your breath.',
  cues:['Look at the floor just in front of your hands.','Quality beats time: a perfect 40 seconds is better than a sagging 60.','Tuck your tailbone slightly to stop your back arching.'],
  avoid:['Hips sagging toward the floor.','Hips piked up high.','Holding your breath.','Head drooping.'],
  ease:'Hold the plank on your knees, keeping a straight line from knees to head.'},

spinbike:{n:'Spinning Bike',aka:'Indoor cycling',
  p:['quads','glutes'],s:['hamstrings','calves'],
  setup:['Seat height: standing beside the bike, the seat should be at your hip bone.','On the bike, your knee should be slightly bent (about 25–35°) when the pedal is at the bottom.','Seat forward/back: with pedals level (3 o\'clock), your knee should be roughly above the pedal.','Handlebars level with or a bit higher than the seat for beginners. Ball of the foot over the pedal centre, straps snug.'],
  steps:['Minutes 0–3: easy spin with light resistance.','Minutes 3–12: add resistance until it feels like riding up a gentle hill. Keep a steady cadence.','Minutes 12–15: reduce resistance and spin easy to cool down.'],
  breathe:'Steady deep breaths. You should be able to say short sentences.',
  cues:['Always keep some resistance on; spinning freely is hard on the knees.','Hips stay still on the saddle — no rocking side to side.','Relax your shoulders, light grip on the bars.'],
  avoid:['Seat too low (causes knee pain).','Bouncing in the saddle at high speed.','Hunching your back and shrugging.'],
  ease:'Keep resistance light and stay seated the whole time.'},

hyper:{n:'Hyper Extension',aka:'45° or flat back extension bench',
  p:['lower_back'],s:['glutes','hamstrings'],
  setup:['Adjust the pad so its top edge sits just below your hip bones — your hips must be free to bend.','Lock your ankles under the rollers.','Cross your arms on your chest (or fingertips behind your ears).'],
  steps:['Start with your body in a straight line.','Bend forward slowly at the hips with a flat back until your body is at about 60–90°, feeling a stretch in your hamstrings.','Rise back up using your glutes and lower back until your body is in a straight line again — not past it.','Hold the top position for 2–3 seconds (that\'s the "hold" in your plan), then lower again.'],
  breathe:'Breathe in as you go down, breathe out as you come up.',
  cues:['Squeeze your glutes at the top.','Move slowly; this is a control exercise, not a power one.','Keep your chin slightly tucked.'],
  avoid:['Overarching backward past a straight line.','Rounding your back on the way down.','Jerking up quickly.','Pad set too high so your hips can\'t bend.'],
  ease:'Use a smaller range, only going halfway down.'},

benchpress:{n:'Flat Bench Press',aka:'Barbell bench press',
  p:['chest'],s:['shoulders','triceps'],
  setup:['Lie on the bench with your eyes directly under the bar.','Feet flat on the floor, wider than your hips, slightly behind your knees.','Head, upper back and glutes stay on the bench; both feet stay on the floor.','Grip about 1.5× shoulder-width so your forearms are vertical when the bar touches your chest. Wrap your thumbs around the bar.','Pull your shoulder blades back and down, keep a small natural arch in your lower back, chest lifted. Ask someone to spot you.'],
  steps:['Lift the bar off the rack with straight arms and bring it over your shoulders.','Breathe in and lower the bar slowly to your lower chest (around nipple level). Elbows at about 45–70° from your body.','Touch your chest lightly — no bouncing.','Press up and slightly back so the bar finishes over your shoulders.'],
  breathe:'Breathe in at the top, hold as you lower, breathe out as you press past the hardest part.',
  cues:['Bend the bar: imagine snapping it in half to keep your elbows tucked.','Wrists straight, bar sitting low in your palm.','Drive your feet into the floor.'],
  avoid:['Bouncing the bar off your chest.','Lifting your hips off the bench.','Elbows flared out at 90°.','Wrists bent back.','Lifting heavy without a spotter.'],
  ease:'Start with the empty bar or use the Smith machine.'},

inclinedb:{n:'Incline Press D\'bell',aka:'Incline dumbbell press',
  p:['chest'],s:['shoulders','triceps'],
  setup:['Set the bench to 30–45° (30° hits the upper chest best).','Sit with the dumbbells on your thighs, then lie back and use your knees to kick them up to chest level.','Feet flat on the floor. Squeeze your shoulder blades back and down.','Palms facing forward, dumbbells beside your upper chest, forearms vertical.'],
  steps:['Press the dumbbells up and slightly inward until your arms are almost straight over your upper chest.','Lower slowly until the dumbbells are at chest level and you feel a stretch.','Keep your elbows at roughly 45° from your body.'],
  breathe:'Breathe out as you press, breathe in as you lower.',
  cues:['Dumbbells move in a slight upside-down V path.','Keep your back and head on the bench.','To finish, bring the dumbbells to your chest, then sit up using your knees.'],
  avoid:['Bench too steep — it becomes a shoulder press.','Clanging the dumbbells together.','Elbows flared straight out.','Dropping the dumbbells to the floor from straight arms.'],
  ease:'Use the incline chest press machine if one is available.'},

pullup:{n:'Pull Ups',aka:'Overhand pull-up (assisted if needed)',
  p:['lats'],s:['biceps','mid_back','forearms','rear_delts'],
  setup:['Grip the bar slightly wider than your shoulders, palms facing away.','Hang with your arms straight, but pull your shoulders slightly down so you\'re not completely loose.','Legs straight or crossed behind you, stomach tight.'],
  steps:['Pull your shoulder blades down and back first.','Then pull your elbows down toward your ribs until your chin clears the bar.','Lower slowly over 2–3 seconds until your arms are straight again.'],
  breathe:'Breathe out as you pull up, breathe in as you lower.',
  cues:['Lead with your chest, not your chin.','Don\'t swing — control every centimetre.','Can\'t do 15 yet? That\'s normal. See the easier options below.'],
  avoid:['Kicking or swinging (kipping).','Half reps that stop with bent arms.','Reaching your chin forward to "cheat" over the bar.','Shrugging into your ears.'],
  ease:'Use the assisted pull-up machine (more counterweight = easier) or a resistance band. You can also jump up and lower yourself slowly for 3–5 seconds.'},

closepull:{n:'Close Grip Pull Down',aka:'V-bar / close-grip lat pulldown',
  p:['lats'],s:['biceps','mid_back'],
  setup:['Attach a V-handle (close, palms facing each other).','Thighs locked under the pad, feet flat.','Sit tall, lean back slightly (10–20°), chest up.'],
  steps:['Pull the handle to your upper chest, driving your elbows down and close to your sides.','Squeeze your lats for one second.','Let it rise slowly until your arms are straight and you feel a full stretch overhead.'],
  breathe:'Breathe out as you pull down, breathe in as you return.',
  cues:['Touch the handle to your upper chest, not your chin.','Keep your chest up the whole time.','Elbows stay tight to your body.'],
  avoid:['Leaning far back so it becomes a row.','Rounding forward on the way up.','Using momentum.'],
  ease:'Lower the weight and pause at the bottom of each rep.'},

shrug:{n:'Shrugs',aka:'Dumbbell shoulder shrug',
  p:['traps'],s:['forearms'],
  setup:['Stand tall with feet hip-width apart, dumbbells at your sides, palms facing your body.','Arms straight, chest up, chin level.'],
  steps:['Lift your shoulders straight up toward your ears as high as you can.','Hold for 1–2 seconds and squeeze.','Lower slowly until you feel a stretch at the base of your neck.'],
  breathe:'Breathe out as you shrug up, breathe in as you lower.',
  cues:['Straight up and straight down, like an elevator.','Keep your arms straight — no elbow bending.','Pause at the top every rep.'],
  avoid:['Rolling your shoulders in circles (no extra benefit, more joint stress).','Bending your elbows.','Pushing your chin forward.','Bouncing the weight.'],
  ease:'Use lighter dumbbells and a longer pause at the top.'},

frontraise:{n:'Front Raises',aka:'Dumbbell front raise',
  p:['shoulders'],s:['chest','traps'],
  setup:['Stand with feet hip-width apart and knees soft.','Dumbbells in front of your thighs, palms facing your thighs (or facing each other).','Stomach tight, shoulders down.'],
  steps:['Raise one or both arms straight forward, with a slight bend in the elbows, until your hands reach shoulder height.','Pause for one second.','Lower slowly over 2–3 seconds.'],
  breathe:'Breathe out as you raise, breathe in as you lower.',
  cues:['Stop at shoulder height; going higher with weight isn\'t needed.','Keep your body still, like a statue.','Light weights work well here.'],
  avoid:['Swinging or leaning back.','Shrugging your shoulders up.','Locking your elbows.'],
  ease:'Alternate arms, one at a time.'},

reardelt:{n:'Rear Deltoid M.',aka:'Reverse pec deck (rear delt fly machine)',
  p:['rear_delts'],s:['mid_back','traps'],
  setup:['Sit facing the machine with your chest against the pad.','Adjust the seat so the handles are at shoulder height.','Set the handles to the rear-delt position (fully forward).','Grip with palms facing down or facing each other, arms straight out in front with a slight elbow bend.'],
  steps:['Move your arms out and back in a wide arc until they are in line with your body, forming a T.','Squeeze the back of your shoulders for one second.','Return slowly to the start.'],
  breathe:'Breathe out as you open, breathe in as you return.',
  cues:['Think "push your hands out wide", not "squeeze your shoulder blades".','Keep your chest on the pad.','Use a light-to-moderate weight; rear delts are small.'],
  avoid:['Squeezing the shoulder blades hard (turns it into a back exercise).','Shrugging up.','Bending your elbows more as you pull.','Swinging.'],
  ease:'Do it one arm at a time.'},

lyingfrench:{n:'Lying French Press',aka:'Skull crusher (EZ-bar or dumbbells)',
  p:['triceps'],s:['forearms'],
  setup:['Lie on a flat bench, feet flat on the floor.','Hold an EZ bar on the inner bends with an overhand grip (or two dumbbells, palms facing each other).','Press the bar straight up over your chest, then tilt your arms slightly back toward your head.'],
  steps:['Keeping your upper arms still, bend your elbows to lower the bar toward your forehead or just past it.','Stop when your elbows reach about 90° or slightly more.','Straighten your elbows to raise the bar back up and squeeze your triceps.'],
  breathe:'Breathe in as you lower, breathe out as you extend.',
  cues:['Only the elbows bend.','Elbows point at the ceiling, about shoulder-width apart.','Lower slowly — this bar is near your face.'],
  avoid:['Elbows flaring outward.','Upper arms moving back and forth.','Lowering fast or too heavy without a spotter.'],
  ease:'Use two light dumbbells instead of a bar.'},

hammer:{n:'Hammer D\'bell Curling',aka:'Hammer curl (neutral grip)',
  p:['biceps','forearms'],s:[],
  setup:['Stand tall with feet hip-width apart.','Dumbbells at your sides, palms facing your body, thumbs forward — hold them like hammers.','Elbows tucked at your sides.'],
  steps:['Curl the dumbbells up, keeping palms facing each other, until they\'re near your shoulders.','Pause for one second.','Lower slowly to straight arms. You can alternate arms or do both together.'],
  breathe:'Breathe out as you curl, breathe in as you lower.',
  cues:['Thumbs lead the way up.','Elbows stay at your sides.','Works the forearm and the muscle under the biceps (brachialis), which makes arms look thicker.'],
  avoid:['Swinging the body.','Elbows drifting forward.','Twisting your wrists during the curl.'],
  ease:'Do one arm at a time.'},

preacher:{n:'Preacher Curling M.',aka:'Preacher curl machine',
  p:['biceps'],s:['forearms'],
  setup:['Adjust the seat so your armpits fit snugly over the top of the pad and your upper arms lie flat on it.','Line your elbows up with the machine\'s pivot point.','Grip the handles with palms facing up.'],
  steps:['Curl up until your forearms are nearly vertical.','Squeeze your biceps for one second.','Lower slowly over about 3 seconds until your arms are almost straight — keep a tiny bend.'],
  breathe:'Breathe out as you curl, breathe in as you lower.',
  cues:['Keep the backs of your arms pressed into the pad.','The slow lowering is the most important part.','Lighter than your normal curl is fine.'],
  avoid:['Lifting your elbows or shoulders off the pad.','Dropping fast to a fully locked arm (stresses the elbow tendon).','Seat too low so you\'re hunched over.'],
  ease:'Use one arm at a time with a lighter weight.'},

widesquat:{n:'Wide Squats',aka:'Sumo / plié squat',
  p:['adductors','glutes','quads'],s:['hamstrings'],
  setup:['Feet much wider than shoulders (about 1.5–2× shoulder-width), toes turned out 30–45°.','Optional: hold one dumbbell vertically with both hands between your legs.','Chest up, stomach tight.'],
  steps:['Sit straight down, pushing your knees out so they stay in line with your toes.','Keep your torso more upright than in a normal squat.','Lower until your thighs are parallel to the floor.','Push back up, squeezing your glutes and inner thighs at the top.'],
  breathe:'Breathe in on the way down, breathe out as you stand.',
  cues:['Knees and toes always point the same way.','Think "down like an elevator", not "back like sitting on a chair".','Feel it in your inner thighs and glutes.'],
  avoid:['Knees collapsing inward.','Leaning your chest forward.','The inside edges of your feet lifting.','Toes pointing forward while knees go out (twists the knee).'],
  ease:'Use bodyweight only and a smaller range.'},

lunge:{n:'Lunges',aka:'Forward lunge (bodyweight or dumbbells)',
  p:['quads','glutes'],s:['hamstrings','adductors','calves'],
  setup:['Stand tall with feet hip-width apart, as if on two train tracks (not on one tightrope).','Dumbbells at your sides, or hands on hips for bodyweight.'],
  steps:['Step forward about 60–90 cm, long enough that your front shin stays close to vertical.','Lower straight down until your back knee is 2–3 cm above the floor. Both knees should be at about 90°.','Front knee stays over your ankle and points the same way as your toes.','Push through your front heel to step back to the start. Alternate legs (ask your trainer whether 20 means 20 total or 20 per leg).'],
  breathe:'Breathe in as you lower, breathe out as you push back up.',
  cues:['Go down, not forward.','Keep your chest up and shoulders over your hips.','Keep most of your weight on the front leg.'],
  avoid:['Front knee caving inward.','Front heel lifting.','Leaning your upper body forward.','Feet in one line (you\'ll lose balance).','Banging the back knee on the floor.'],
  ease:'Do reverse lunges (step backward), which are easier on the knees, or hold onto something for balance.'},

stepup:{n:'Step Up with Weights',aka:'Dumbbell step-up onto a box or bench',
  p:['quads','glutes'],s:['hamstrings','calves'],
  setup:['Use a box or bench at knee height or lower (beginners: 30–45 cm).','Hold dumbbells at your sides, standing facing the box.'],
  steps:['Place your whole foot on the box.','Lean slightly forward and drive through the heel of that foot to stand up fully on the box.','Bring your other foot up to meet it.','Step down with the same trailing leg first, slowly. Finish all reps on one leg, then switch (or alternate).'],
  breathe:'Breathe out as you step up, breathe in as you step down.',
  cues:['The top leg does all the work.','Knee tracks over your toes.','Stand fully tall at the top.'],
  avoid:['Pushing off hard with the bottom foot.','Front knee caving in.','Box too high.','Only half your foot on the box.'],
  ease:'Use a lower step and no dumbbells.'},

abductor:{n:'Abductor M.',aka:'Outer thigh / hip machine (push out)',
  p:['abductors'],s:['glutes'],
  setup:['Sit with your back against the pad and hold the handles.','Place your legs so the pads press against the outside of your knees. Start with legs together.','Feet on the footrests.'],
  steps:['Push your legs outward as wide as comfortable.','Hold for one second.','Return slowly without letting the weights touch down.'],
  breathe:'Breathe out as you push out, breathe in as you return.',
  cues:['Sitting upright works the outer hip. Leaning slightly forward works the glutes more.','Slow and controlled, especially on the way back in.','Moderate weight is plenty.'],
  avoid:['Slamming the weights.','Bouncing out with momentum.','Lifting your hips off the seat.'],
  ease:'Shorten the range and reduce the weight.'},

legext:{n:'Leg Extension',aka:'Leg extension machine',
  p:['quads'],s:[],
  setup:['Adjust the backrest so your knee joint lines up with the machine\'s pivot point (often marked with a coloured dot).','Back flat against the pad.','The ankle pad sits on the front of your lower shin, just above the ankle.','Hold the side handles. Knees start at about 90°.'],
  steps:['Straighten your legs until they\'re fully extended, without snapping your knees.','Squeeze your quads for one second.','Lower slowly over about 3 seconds.'],
  breathe:'Breathe out as you extend, breathe in as you lower.',
  cues:['Toes pointed up toward the ceiling.','Hips stay pressed into the seat.','A controlled squeeze at the top is the goal.'],
  avoid:['Hips lifting off the seat.','Kicking the weight up fast.','Ankle pad too high up the shin.','Using too much weight (stresses the knees).'],
  ease:'Do one leg at a time with a lighter weight.'},

calfseated:{n:'Calves Raises Seated',aka:'Seated calf raise machine',
  p:['calves'],s:[],
  setup:['Sit with the balls of your feet on the platform edge and heels hanging off.','Knee pad snug on your lower thighs, just above the knees.','Release the safety lever.'],
  steps:['Lower your heels until you feel a deep stretch. Pause for one second.','Push up onto the balls of your feet as high as you can.','Squeeze for 1–2 seconds at the top.','Lower slowly. Lock the safety lever after the last rep.'],
  breathe:'Breathe out as you rise, breathe in as you lower.',
  cues:['Seated raises target the deeper calf muscle (soleus).','Full stretch, full squeeze, every rep.','Push through the big toe.'],
  avoid:['Bouncing.','Short half reps.','Feet rolling outward.'],
  ease:'Lower weight and pause longer at the bottom.'}
};

w_march:{n:'High-knee march',aka:'Marching in place, knees to hip height',warm:1,

  cues:['Land on the balls of your feet, softly.','Stay tall — don\'t lean back to lift your knees.','This raises your heart rate and warms your hips.'],

  breathe:'Breathe slowly and evenly.',

  cues:['Land softly with slightly bent knees.','Stay on the balls of your feet.'],

function muscleSVG(p,s){
  const fill=m=> p.includes(m)?'var(--muscle)': s.includes(m)?'var(--muscle-2)':'var(--idle)';
  const op=m=> s.includes(m)&&!p.includes(m)?' fill-opacity=".75"':'';
  const half=list=>list.map(([m,d])=>`<path d="${d}" fill="${fill(m)}"${op(m)}><title>${MUSCLES[m]}</title></path>`).join('');
  const fig=(list,x,label)=>`<g transform="translate(${x} 0)">
    <g fill="var(--sil)"><ellipse cx="100" cy="32" rx="17" ry="21"/><rect x="91" y="48" width="18" height="18"/><path d="${SIL}"/><path d="${SIL}" transform="translate(200 0) scale(-1 1)"/></g>
    <g stroke="var(--plate)" stroke-width="1.3">${half(list)}<g transform="translate(200 0) scale(-1 1)">${half(list)}</g></g>
    ${label==='Front'?'<path d="M88 140h24M88 160h24" stroke="var(--plate)" stroke-width="1.3"/>':''}
    <text x="100" y="400" text-anchor="middle" fill="var(--muted)" font-size="14" font-family="Barlow, sans-serif">${label}</text></g>`;
  return `<svg viewBox="20 0 380 408" role="img" aria-label="Muscles worked: ${p.map(m=>MUSCLES[m]).join(', ')}">${fig(FRONT,0,'Front')}${fig(BACK,200,'Back')}</svg>`;
}


const DB_RAW=[["3_4_Sit-Up","3/4 Sit-Up","pull","b","compound","body only",["abdominals"],[],"strength",["Lie down on the floor and secure your feet. Your legs should be bent at the knees.","Place your hands behind or to the side of your head. You will begin with your back on the ground. This will be your starting position.","Flex your hips and spine to raise your torso toward your knees.","At the top of the contraction your torso should be perpendicular to the ground. Reverse the motion, going only ¾ of the way down.","Repeat for the recommended amount of repetitions."]],["90_90_Hamstring","90/90 Hamstring","push","b","","body only",["hamstrings"],["calves"],"stretching",["Lie on your back, with one leg extended straight out.","With the other leg, bend the hip and knee to 90 degrees. You may brace your leg with your hands if necessary. This will be your starting position.","Extend your leg straight into the air, pausing briefly at the top. Return the leg to the starting position.","Repeat for 10-20 repetitions, and then switch to the other leg."]],["Ab_Crunch_Machine","Ab Crunch Machine","pull","i","isolation","machine",["abdominals"],[],"strength",["Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.","At the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.","After a second pause, slowly return to the starting position as you breathe in.","Repeat the movement for the prescribed amount of repetitions."]],["Ab_Roller","Ab Roller","pull","i","compound","other",["abdominals"],["shoulders"],"strength",["Hold the Ab Roller with both hands and kneel on the floor.","Now place the ab roller on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.","Slowly roll the ab roller straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.","After a pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times."]],["Adductor","Adductor","static","i","isolation","foam roll",["adductors"],[],"stretching",["Lie face down with one leg on a foam roll.","Rotate the leg so that the foam roll contacts against your inner thigh. Shift as much weight onto the foam roll as can be tolerated.","While trying to relax the muscles if the inner thigh, roll over the foam between your hip and knee, holding points of tension for 10-30 seconds. Repeat with the other leg."]],["Adductor_Groin","Adductor/Groin","static","i","","",["adductors"],[],"stretching",["Lie on your back with your feet raised towards the ceiling.","Have your partner hold your feet or ankles. Abduct your legs as far as you can. This will be your starting position.","Attempt to squeeze your legs together for 10 or more seconds, while your partner prevents you from doing so.","Now, relax the muscles in your legs as your partner pushes your feet apart, stretching as far as is comfortable for you. Be sure to let your partner know when the stretch is adequate to prevent overstretching or injury."]],["Advanced_Kettlebell_Windmill","Advanced Kettlebell Windmill","push","i","isolation","kettlebells",["abdominals"],["glutes","hamstrings","shoulders"],"strength",["Clean and press a kettlebell overhead with one arm.","Keeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Keep the non-working arm behind your back and turn your feet out at a forty-five degree angle from the arm with the kettlebell.","Lower yourself as far as possible.","Pause for a second and reverse the motion back to the starting position."]],["Air_Bike","Air Bike","pull","b","compound","body only",["abdominals"],[],"strength",["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put your hands beside your head. Be careful however to not strain with the neck as you perform it. Now lift your shoulders into the crunch position.","Bring knees up to where they are perpendicular to the floor, with your lower legs parallel to the floor. This will be your starting position.","Now simultaneously, slowly go through a cycle pedal motion kicking forward with the right leg and bringing in the knee of the left leg. Bring your right elbow close to your left knee by crunching to the side, as you breathe out.","Go back to the initial position as you breathe in.","Crunch to the opposite side as you cycle your legs and bring closer your left elbow to your right knee and exhale.","Continue alternating in this manner until all of the recommended repetitions for each side have been completed."]],["All_Fours_Quad_Stretch","All Fours Quad Stretch","static","i","","body only",["quadriceps"],["quadriceps"],"stretching",["Start off on your hands and knees, then lift your leg off the floor and hold the foot with your hand.","Use your hand to hold the foot or ankle, keeping the knee fully flexed, stretching the quadriceps and hip flexors.","Focus on extending your hips, thrusting them towards the floor. Hold for 10-20 seconds and then switch sides."]],["Alternate_Hammer_Curl","Alternate Hammer Curl","pull","b","isolation","dumbbell",["biceps"],["forearms"],"strength",["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","While holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."]],["Alternate_Heel_Touchers","Alternate Heel Touchers","pull","b","isolation","body only",["abdominals"],[],"strength",["Lie on the floor with the knees bent and the feet on the floor around 18-24 inches apart. Your arms should be extended by your side. This will be your starting position.","Crunch over your torso forward and up about 3-4 inches to the right side and touch your right heel as you hold the contraction for a second. Exhale while performing this movement.","Now go back slowly to the starting position as you inhale.","Now crunch over your torso forward and up around 3-4 inches to the left side and touch your left heel as you hold the contraction for a second. Exhale while performing this movement and then go back to the starting position as you inhale. Now that both heels have been touched, that is considered 1 repetition.","Continue alternating sides in this manner until all prescribed repetitions are done."]],["Alternate_Incline_Dumbbell_Curl","Alternate Incline Dumbbell Curl","pull","b","isolation","dumbbell",["biceps"],["forearms"],"strength",["Sit down on an incline bench with a dumbbell in each hand being held at arms length. Tip: Keep the elbows close to the torso.This will be your starting position.","While holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. As you do so, rotate the hand so that the palm is facing up. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbell back to starting position as your breathe in.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."]],["Alternate_Leg_Diagonal_Bound","Alternate Leg Diagonal Bound","push","b","compound","",["quadriceps"],["abductors","adductors","calves","glutes","hamstrings"],"plyometrics",["Assume a comfortable stance with one foot slightly in front of the other.","Begin by pushing off with the front leg, driving the opposite knee forward and as high as possible before landing. Attempt to cover as much distance to each side with each bound.","It may help to use a line on the ground to guage distance from side to side.","Repeat the sequence with the other leg."]],["Alternating_Cable_Shoulder_Press","Alternating Cable Shoulder Press","push","b","compound","cable",["shoulders"],["triceps"],"strength",["Move the cables to the bottom of the tower and select an appropriate weight.","Grasp the cables and hold them at shoulder height, palms facing forward. This will be your starting position.","Keeping your head and chest up, extend through the elbow to press one side directly over head.","After pausing at the top, return to the starting position and repeat on the opposite side."]],["Alternating_Deltoid_Raise","Alternating Deltoid Raise","push","b","isolation","dumbbell",["shoulders"],[],"strength",["In a standing position, hold a pair of dumbbells at your side.","Keeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.","Return the weights to your side.","On the next repetition, raise the weights laterally, raising them out to your side to about shoulder height.","Return the weights to the starting position and continue alternating to the front and side."]],["Alternating_Floor_Press","Alternating Floor Press","push","b","compound","kettlebells",["chest"],["abdominals","shoulders","triceps"],"strength",["Lie on the floor with two kettlebells next to your shoulders.","Position one in place on your chest and then the other, gripping the kettlebells on the handle with the palms facing forward.","Extend both arms, so that the kettlebells are being held above your chest. Lower one kettlebell, bringing it to your chest and turn the wrist in the direction of the locked out kettlebell.","Raise the kettlebell and repeat on the opposite side."]],["Alternating_Hang_Clean","Alternating Hang Clean","pull","i","compound","kettlebells",["hamstrings"],["biceps","calves","forearms","glutes","lower back","traps"],"strength",["Place two kettlebells between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean one kettlebell to your shoulder and hold on to the other kettlebell in a hanging position. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so.","Lower the cleaned kettlebell to a hanging position and clean the alternate kettlebell. Repeat."]],["Alternating_Kettlebell_Press","Alternating Kettlebell Press","push","i","compound","kettlebells",["shoulders"],["triceps"],"strength",["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so.","Press one directly overhead by extending through the elbow, turning it so the palm faces forward while holding the other kettlebell stationary .","Lower the pressed kettlebell to the starting position and immediately press with your other arm."]],["Alternating_Kettlebell_Row","Alternating Kettlebell Row","pull","i","isolation","kettlebells",["middle back"],["biceps","lats"],"strength",["Place two kettlebells in front of your feet. Bend your knees slightly and push your butt out as much as possible. As you bend over to get into the starting position grab both kettlebells by the handles.","Pull one kettlebell off of the floor while holding on to the other kettlebell. Retract the shoulder blade of the working side, as you flex the elbow, drawing the kettlebell towards your stomach or rib cage.","Lower the kettlebell in the working arm and repeat with your other arm."]],["Alternating_Renegade_Row","Alternating Renegade Row","pull","e","compound","kettlebells",["middle back"],["abdominals","biceps","chest","lats","triceps"],"strength",["Place two kettlebells on the floor about shoulder width apart. Position yourself on your toes and your hands as though you were doing a pushup, with the body straight and extended. Use the handles of the kettlebells to support your upper body. You may need to position your feet wide for support.","Push one kettlebell into the floor and row the other kettlebell, retracting the shoulder blade of the working side as you flex the elbow, pulling it to your side.","Then lower the kettlebell to the floor and begin the kettlebell in the opposite hand. Repeat for several reps."]],["Ankle_Circles","Ankle Circles","pull","b","isolation","",["calves"],[],"stretching",["Use a sturdy object like a squat rack to hold yourself.","Lift the right leg in the air (just around 2 inches from the floor) and perform a circular motion with the big toe. Pretend that you are drawing a big circle with it. Tip: One circle equals 1 repetition. Breathe normally as you perform the movement.","When you are done with the right foot, then repeat with the left leg."]],["Ankle_On_The_Knee","Ankle On The Knee","static","b","","",["glutes"],[],"stretching",["From a lying position, bend your knees and keep your feet on the floor.","Place your ankle of one foot on your opposite knee.","Grasp the thigh or knee of the bottom leg and pull both of your legs into the chest. Relax your neck and shoulders. Hold for 10-20 seconds and then switch sides."]],["Anterior_Tibialis-SMR","Anterior Tibialis-SMR","static","i","","other",["calves"],[],"stretching",["Begin seated on the ground with your legs bent and your feet on the floor.","Using a Muscle Roller or a rolling pin, apply pressure to the muscles on the outside of your shins. Work from just below the knee to above the ankle, pausing at points of tension for 10-30 seconds. Repeat on the other leg."]],["Anti-Gravity_Press","Anti-Gravity Press","push","b","compound","barbell",["shoulders"],["middle back","traps","triceps"],"strength",["Place a bar on the ground behind the head of an incline bench.","Lay on the bench face down. With a pronated grip, pick the barbell up from the floor. Flex the elbows, performing a reverse curl to bring the bar near your chest. This will be your starting position.","To begin, press the barbell out in front of your head by extending your elbows. Keep your arms parallel to the ground throughout the movement.","Return to the starting position and repeat to complete the set."]],["Arm_Circles","Arm Circles","push","b","isolation","",["shoulders"],["traps"],"stretching",["Stand up and extend your arms straight out by the sides. The arms should be parallel to the floor and perpendicular (90-degree angle) to your torso. This will be your starting position.","Slowly start to make circles of about 1 foot in diameter with each outstretched arm. Breathe normally as you perform the movement.","Continue the circular motion of the outstretched arms for about ten seconds. Then reverse the movement, going the opposite direction."]],["Arnold_Dumbbell_Press","Arnold Dumbbell Press","push","i","compound","dumbbell",["shoulders"],["triceps"],"strength",["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.","Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.","Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.","After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]],["Around_The_Worlds","Around The Worlds","push","i","compound","dumbbell",["chest"],["shoulders"],"strength",["Lay down on a flat bench holding a dumbbell in each hand with the palms of the hands facing towards the ceiling. Tip: Your arms should be parallel to the floor and next to your thighs. To avoid injury, make sure that you keep your elbows slightly bent. This will be your starting position.","Now move the dumbbells by creating a semi-circle as you displace them from the initial position to over the head. All of the movement should happen with the arms parallel to the floor at all times. Breathe in as you perform this portion of the movement.","Reverse the movement to return the weight to the starting position as you exhale."]],["Atlas_Stone_Trainer","Atlas Stone Trainer","pull","i","compound","other",["lower back"],["biceps","forearms","glutes","hamstrings","quadriceps"],"strongman",["This trainer is effective for developing Atlas Stone strength for those who don't have access to stones, and are typically made from bar ends or heavy pipe.","Begin by loading the desired weight onto the bar. Straddle the weight, wrapping your arms around the implement, bending at the hips.","Begin by pulling the weight up past the knees, extending through the hips. As the weight clears the knees, it can be lapped by resting it on your thighs and sitting back, hugging it tightly to your chest.","Finish the movement by extending through your hips and knees to raise the weight as high as possible. The weight can be returned to the lap or to the ground for successive repetitions."]],["Atlas_Stones","Atlas Stones","pull","e","compound","other",["lower back"],["abdominals","adductors","biceps","calves","forearms","glutes","hamstrings","middle back","quadriceps","traps"],"strongman",["Begin with the atlas stone between your feet. Bend at the hips to wrap your arms vertically around the Atlas Stone, attempting to get your fingers underneath the stone. Many stones will have a small flat portion on the bottom, which will make the stone easier to hold.","Pulling the stone into your torso, drive through the back half of your feet to pull the stone from the ground.","As the stone passes the knees, lap it by sitting backward, pulling the stone on top of your thighs.","Sit low, getting the stone high onto your chest as you change your grip to reach over the stone. Stand, driving through with your hips. Close distance to the loading platform, and lean back, extending the hips to get the stone as high as possible."]],["Axle_Deadlift","Axle Deadlift","pull","i","compound","other",["lower back"],["forearms","glutes","hamstrings","middle back","quadriceps","traps"],"strongman",["Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an over/under grip.","With your feet and your grip set, take a big breath and then lower your hips and flex the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward.","After the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.","Lower the bar by bending at the hips and guiding it to the floor."]],["Back_Flyes_-_With_Bands","Back Flyes - With Bands","pull","b","compound","bands",["shoulders"],["middle back","triceps"],"strength",["Run a band around a stationary post like that of a squat rack.","Grab the band by the handles and stand back so that the tension in the band rises.","Extend and lift the arms straight in front of you. Tip: Your arms should be straight and parallel to the floor while perpendicular to your torso. Your feet should be firmly planted on the floor spread at shoulder width. This will be your starting position.","As you exhale, move your arms to the sides and back. Keep your arms extended and parallel to the floor. Continue the movement until the arms are extended to your sides.","After a pause, go back to the original position as you inhale.","Repeat for the recommended amount of repetitions."]],["Backward_Drag","Backward Drag","pull","b","compound","other",["quadriceps"],["calves","forearms","glutes","hamstrings","lower back"],"strongman",["Load a sled with the desired weight, attaching a rope or straps to the sled that you can hold onto.","Begin the exercise by moving backwards for a given distance. Leaning back, extend through the legs for short steps to move as quickly as possible."]],["Backward_Medicine_Ball_Throw","Backward Medicine Ball Throw","push","b","compound","medicine ball",["shoulders"],[],"plyometrics",["This exercise is best done with a partner. If you lack a partner, the ball can be thrown and retrieved or thrown against a wall.","Begin standing a few meters in front of your partner, both facing the same direction. Begin holding the ball between your legs.","Squat down and then forcefully reverse direction, coming to full extension and you toss the ball over your head to your partner.","Your partner can then roll the ball back to you. Repeat for the desired number of repetitions."]],["Balance_Board","Balance Board","","b","compound","other",["calves"],["hamstrings","quadriceps"],"strength",["Place a balance board in front of you.","Stand up on it and try to balance yourself.","Hold the balance for as long as desired."]],["Ball_Leg_Curl","Ball Leg Curl","pull","b","isolation","exercise ball",["hamstrings"],["calves","glutes"],"strength",["Begin on the floor laying on your back with your feet on top of the ball.","Position the ball so that when your legs are extended your ankles are on top of the ball. This will be your starting position.","Raise your hips off of the ground, keeping your weight on the shoulder blades and your feet.","Flex the knees, pulling the ball as close to you as you can, contracting the hamstrings.","After a brief pause, return to the starting position."]],["Band_Assisted_Pull-Up","Band Assisted Pull-Up","","b","compound","other",["lats"],["abdominals","forearms","middle back"],"strength",["Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.","Pull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.","Pull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.","After a brief pause, return to the starting position."]],["Band_Good_Morning","Band Good Morning","pull","b","compound","bands",["hamstrings"],["glutes","lower back"],"powerlifting",["Using a 41 inch band, stand on one end, spreading your feet a small amount. Bend at the hips to loop the end of the band behind your neck. This will be your starting position.","Keeping your legs straight, extend through the hips to come to a near vertical position.","Ensure that you do not round your back as you go down back to the starting position."]],["Band_Good_Morning_Pull_Through","Band Good Morning (Pull Through)","pull","b","compound","bands",["hamstrings"],["glutes","lower back"],"powerlifting",["Loop the band around a post. Standing a little ways away, loop the opposite end around the neck. Your hands can help hold the band in position.","Begin by bending at the hips, getting your butt back as far as possible. Keep your back flat and bend forward to about 90 degrees. Your knees should be only slightly bent.","Return to the starting position be driving through with the hips to come back to a standing position."]],["Band_Hip_Adductions","Band Hip Adductions","pull","b","isolation","bands",["adductors"],[],"strength",["Anchor a band around a solid post or other object.","Stand with your left side to the post, and put your right foot through the band, getting it around the ankle.","Stand up straight and hold onto the post if needed. This will be your starting position.","Keeping the knee straight, raise your right legs out to the side as far as you can.","Return to the starting position and repeat for the desired rep count.","Switch sides."]],["Band_Pull_Apart","Band Pull Apart","pull","b","isolation","bands",["shoulders"],["middle back","traps"],"strength",["Begin with your arms extended straight out in front of you, holding the band with both hands.","Initiate the movement by performing a reverse fly motion, moving your hands out laterally to your sides.","Keep your elbows extended as you perform the movement, bringing the band to your chest. Ensure that you keep your shoulders back during the exercise.","Pause as you complete the movement, returning to the starting position under control."]],["Band_Skull_Crusher","Band Skull Crusher","push","b","isolation","bands",["triceps"],[],"strength",["Secure a band to the base of a rack or the bench. Lay on the bench so that the band is lined up with your head.","Take hold of the band, raising your elbows so that the upper arm is perpendicular to the floor. With the elbow flexed, the band should be above your head. This will be your starting position.","Extend through the elbow to straighten your arm, keeping your upper arm in place. Pause at the top of the motion, and return to the starting position."]],["Barbell_Ab_Rollout","Barbell Ab Rollout","pull","i","compound","barbell",["abdominals"],["lower back","shoulders"],"strength",["For this exercise you will need to get into a pushup position, but instead of having your hands of the floor, you will be grabbing on to an Olympic barbell (loaded with 5-10 lbs on each side) instead. This will be your starting position.","While keeping a slight arch on your back, lift your hips and roll the barbell towards your feet as you exhale. Tip: As you perform the movement, your glutes should be coming up, you should be keeping the abs tight and should maintain your back posture at all times. Also your arms should be staying perpendicular to the floor throughout the movement. If you don't, you will work out your shoulders and back more than the abs.","After a second contraction at the top, start to roll the barbell back forward to the starting position slowly as you inhale.","Repeat for the recommended amount of repetitions."]],["Barbell_Ab_Rollout_-_On_Knees","Barbell Ab Rollout - On Knees","pull","e","compound","barbell",["abdominals"],["lower back","shoulders"],"strength",["Hold an Olympic barbell loaded with 5-10lbs on each side and kneel on the floor.","Now place the barbell on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.","Slowly roll the barbell straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.","After a second pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at al
