eeping your foot off of the floor, pull on the belt, using the tension to pull the toes up. Hold for 10-20 seconds, and repeat on the other side."]],["Iliotibial_Tract-SMR","Iliotibial Tract-SMR","static","i","isolation","foam roll",["abductors"],[],"stretching",["Lay on your side, with the bottom leg placed onto a foam roller between the hip and the knee. The other leg can be crossed in front of you.","Place as much of your weight as is tolerable onto your bottom leg; there is no need to keep your bottom leg in contact with the ground. Be sure to relax the muscles of the leg you are stretching.","Roll your leg over the foam from you hip to your knee, pausing for 10-30 seconds at points of tension. Repeat with the opposite leg."]],["Inchworm","Inchworm","","b","compound","body only",["hamstrings"],[],"stretching",["Stand with your feet close together. Keeping your legs straight, stretch down and put your hands on the floor directly in front of you. This will be your starting position.","Begin by walking your hands forward slowly, alternating your left and your right. As you do so, bend only at the hip, keeping your legs straight.","Keep going until your body is parallel to the ground in a pushup position.","Now, keep your hands in place and slowly take short steps with your feet, moving only a few inches at a time.","Continue walking until your feet are by hour hands, keeping your legs straight as you do so."]],["Incline_Barbell_Triceps_Extension","Incline Barbell Triceps Extension","push","i","isolation","barbell",["triceps"],["forearms"],"strength",["Hold a barbell with an overhand grip (palms down) that is a little closer together than shoulder width.","Lie back on an incline bench set at any angle between 45-75-degrees.","Bring the bar overhead with your arms extended and elbows in. The arms should be in line with the torso above the head. This will be your starting position.","Now lower the bar in a semicircular motion behind your head until your forearms touch your biceps. Inhale as you perform this movement. Tip: Keep your upper arms stationary and close to your head at all times. Only the forearms should move.","Return to the starting position as you breathe out and you contract the triceps. Hold the contraction for a second.","Repeat for the recommended amount of repetitions."]],["Incline_Bench_Pull","Incline Bench Pull","pull","b","isolation","barbell",["middle back"],["lats","shoulders"],"strength",["Grab a dumbbell in each hand and lie face down on an incline bench that is set to an incline that is approximately 30 degrees.","Let the arms hang to your sides fully extended as they point to the floor.","Turn the wrists until your hands have a pronated (palms down) grip.","Now flare the elbows out. This will be your starting position.","As you breathe out, start to pull the dumbbells up as if you are doing a reverse bench press. You will do this by bending at the elbows and bringing the upper arms up as you let the forearms hang. Continue this motion until the upper arms are at the same level as your back. Tip: The elbows will come out to the side and your upper arms and torso should make the letter \"T\" at the top of the movement. Hold the contraction at the top for a second.","Slowly go back down to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]],["Incline_Cable_Chest_Press","Incline Cable Chest Press","push","b","compound","cable",["chest"],["shoulders","triceps"],"strength",["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to the starting position, keeping tension on the cables."]],["Incline_Cable_Flye","Incline Cable Flye","push","i","isolation","cable",["chest"],["shoulders"],"strength",["To get yourself into the starting position, set the pulleys at the floor level (lowest level possible on the machine that is below your torso).","Place an incline bench (set at 45 degrees) in between the pulleys, select a weight on each one and grab a pulley on each hand.","With a handle on each hand, lie on the incline bench and bring your hands together at arms length in front of your face. This will be your starting position.","With a slight bend of your elbows (in order to prevent stress at the biceps tendon), lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary. The movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and exhale. Hold the contracted position for a second. Tip: Make sure to use the same arc of motion used to lower the weights.","Repeat the movement for the prescribed amount of repetitions."]],["Incline_Dumbbell_Bench_With_Palms_Facing_In","Incline Dumbbell Bench With Palms Facing In","push","b","compound","dumbbell",["chest"],["shoulders","triceps"],"strength",["Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.","Once at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.","Now bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."]],["Incline_Dumbbell_Curl","Incline Dumbbell Curl","pull","b","isolation","dumbbell",["biceps"],[],"strength",["Sit back on an incline bench with a dumbbell in each hand held at arms length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]],["Incline_Dumbbell_Flyes","Incline Dumbbell Flyes","push","b","compound","dumbbell",["chest"],["shoulders"],"strength",["Hold a dumbbell on each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.","Repeat for the recommended amount of repetitions."]],["Incline_Dumbbell_Flyes_-_With_A_Twist","Incline Dumbbell Flyes - With A Twist","push","b","compound","dumbbell",["chest"],["shoulders"],"strength",["Hold a dumbbell in each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.","Repeat for the recommended amount of repetitions."]],["Incline_Dumbbell_Press","Incline Dumbbell Press","push","b","compound","dumbbell",["chest"],["shoulders","triceps"],"strength",["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."]],["Incline_Hammer_Curls","Incline Hammer Curls","pull","b","isolation","dumbbell",["biceps"],[],"strength",["Seat yourself on an incline bench with a dumbbell in each hand. You should pressed firmly against he back with your feet together. Allow the dumbbells to hang straight down at your side, holding them with a neutral grip. This will be your starting position.","Initiate the movement by flexing at the elbow, attempting to keep the upper arm stationary.","Continue to the top of the movement and pause, then slowly return to the start position."]],["Incline_Inner_Biceps_Curl","Incline Inner Biceps Curl","","b","isolation","dumbbell",["biceps"],[],"strength",["Hold a dumbbell in each hand and lie back on an incline bench.","The dumbbells should be at arm's length hanging at your sides and your palms should be facing out. This will be your starting position.","Now as you exhale curl the weight outward and up while keeping your forearms in line with your side deltoids. Continue the curl until the dumbbells are at shoulder height and to the sides of your deltoids. Tip: The end of the movement should look similar to a double biceps pose.","After a second contraction at the top of the movement, start to inhale and slowly lower the weights back to the starting position using the same path used to bring them up.","Repeat for the recommended amount of repetitions."]],["Incline_Push-Up","Incline Push-Up","push","b","compound","body only",["chest"],["shoulders","triceps"],"strength",["Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width.","Position forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body. Keeping body straight, lower chest to edge of box or platform by bending arms.","Push body up until arms are extended. Repeat."]],["Incline_Push-Up_Close-Grip","Incline Push-Up Close-Grip","push","b","compound","body only",["triceps"],["chest","shoulders"],"strength",["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands next to one another on the bar.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]],["Incline_Push-Up_Depth_Jump","Incline Push-Up Depth Jump","push","b","compound","other",["chest"],["shoulders","triceps"],"plyometrics",["For this drill you will need a box about 12 inches high, and two thick mats or aerobics steps.","Place the steps just outside of your shoulders, and place your feet on top of the box so that you are in an incline pushup position, your hands just inside the steps. This will be your starting position.","Begin by bending at the elbows to lower your body, quickly reversing position to push your body off of the ground. As you leave the ground, move your hands onto the steps, bending your elbows to absorb the impact.","Repeat the motion to return to the starting position."]],["Incline_Push-Up_Medium","Incline Push-Up Medium","push","b","compound","body only",["chest"],["abdominals","shoulders","triceps"],"strength",["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar, with your hands about shoulder width apart.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]],["Incline_Push-Up_Reverse_Grip","Incline Push-Up Reverse Grip","push","b","compound","body only",["chest"],["abdominals","shoulders","triceps"],"strength",["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar palms up, with your hands about shoulder width apart.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]],["Incline_Push-Up_Wide","Incline Push-Up Wide","push","b","compound","body only",["chest"],["abdominals","shoulders","triceps"],"strength",["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar, with your hands wider than shoulder width.","Position your feet back from the bar with arms and body straight. Your arms should be perpendicular to the body. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]],["Intermediate_Groin_Stretch","Intermediate Groin Stretch","static","i","isolation","other",["hamstrings"],[],"stretching",["Lie on your back with your legs extended. Loop a belt, rope, or band around one of your feet, and swing that leg as far to the side as you can. This will be your starting position.","Pull gently on the belt to create tension in your groin and hamstring muscles. Hold for 10-20 seconds, and repeat on the other side."]],["Intermediate_Hip_Flexor_and_Quad_Stretch","Intermediate Hip Flexor and Quad Stretch","static","i","compound","other",["quadriceps"],[],"stretching",["Lie face down on the floor, with a rope, belt, or band looped around one foot.","Flex the knee and extend the hip of the leg to be stretched, using both hands to pull on the belt. Your knee and your hip should come off of the floor, creating tension in the hip flexors and quadriceps. Hold the stretch for 10-20 seconds, and repeat on the other leg."]],["Internal_Rotation_with_Band","Internal Rotation with Band","","b","isolation","bands",["shoulders"],[],"strength",["Choke the band around a post. The band should be at the same height as your elbow. Stand with your right side to the band a couple of feet away.","Grasp the end of the band with your right hand, and keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.","With your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching away from your torso. This will be your starting position.","Execute the movement by rotating your arm in a forehand motion, keeping your elbow in place.","Continue as far as you are able, pause, and then return to the starting position."]],["Inverted_Row","Inverted Row","pull","b","compound","",["middle back"],["lats"],"strength",["Position a bar in a rack to about waist height. You can also use a smith machine.","Take a wider than shoulder width grip on the bar and position yourself hanging underneath the bar. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.","Begin by flexing the elbow, pulling your chest towards the bar. Retract your shoulder blades as you perform the movement.","Pause at the top of the motion, and return yourself to the start position.","Repeat for the desired number of repetitions."]],["Inverted_Row_with_Straps","Inverted Row with Straps","pull","b","compound","other",["middle back"],["biceps","lats"],"strength",["Hang a rope or suspension straps from a rack or other stable object. Grasp the ends and position yourself in a supine position hanging from the ropes. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.","Begin by flexing the elbow, pulling your chest to your hands. Retract your shoulder blades as you perform the movement.","Pause at the top of the motion, and return yourself to the start position.","Repeat for the desired number of repetitions."]],["Iron_Cross","Iron Cross","push","i","compound","dumbbell",["shoulders"],["chest","glutes","hamstrings","lower back","quadriceps","traps"],"strength",[]],["Iron_Crosses_stretch","Iron Crosses (stretch)","pull","i","compound","",["quadriceps"],[],"stretching",["Lie face down on the floor, with your arms extended out to your side, palms pressed to the floor. This will be your starting position.","To begin, flex one knee and bring that leg across the back of your body, attempting to touch it to the ground near the opposite hand.","Promptly return the leg to the starting postion, and quickly repeat with the other leg. Continue alternating for 10-20 repetitions."]],["Isometric_Chest_Squeezes","Isometric Chest Squeezes","static","b","compound","body only",["chest"],["shoulders","triceps"],"plyometrics",["While either seating or standing, bend your arms at a 90-degree angle and place the palms of your hands together in front of your chest. Tip: Your hands should be open with the palms together and fingers facing forward (perpendicular to your torso).","Push both hands against each other as you contract your chest. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.","Hold for the recommended number of seconds.","Now release the tension slowly.","Rest for the recommended amount of time and repeat."]],["Isometric_Neck_Exercise_-_Front_And_Back","Isometric Neck Exercise - Front And Back","static","b","isolation","body only",["neck"],[],"strength",["With your head and neck in a neutral position (normal position with head erect facing forward), place both of your hands on the front side of your head.","Now gently push forward as you contract the neck muscles but resisting any movement of your head. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.","Hold for the recommended number of seconds.","Now release the tension slowly.","Rest for the recommended amount of time and repeat with your hands placed on the back side of your head."]],["Isometric_Neck_Exercise_-_Sides","Isometric Neck Exercise - Sides","static","b","isolation","body only",["neck"],[],"strength",["With your head and neck in a neutral position (normal position with head erect facing forward), place your left hand on the left side of your head.","Now gently push towards the left as you contract the left neck muscles but resisting any movement of your head. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.","Hold for the recommended number of seconds.","Now release the tension slowly.","Rest for the recommended amount of time and repeat with your right hand placed on the right side of your head."]],["Isometric_Wipers","Isometric Wipers","push","b","compound","body only",["chest"],["abdominals","shoulders","triceps"],"strength",["Assume a push-up position, supporting your weight on your hands and toes while keeping your body straight. Your hands should be just outside of shoulder width. This will be your starting position.","Begin by shifting your body weight as far to one side as possible, allowing the elbow on that side to flex as you lower your body.","Reverse the motion by extending the flexed arm, pushing yourself up and then dropping to the other side.","Repeat for the desired number of repetitions."]],["JM_Press","JM Press","push","b","compound","barbell",["triceps"],["chest","shoulders"],"strength",["Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in. However, instead of having the arms perpendicular to the torso, make sure the bar is set in a direct line above the upper chest. This will be your starting position.","Now beginning from a fully extended position lower the bar down as if performing a lying triceps extension. Inhale as you perform this movement. When you reach the half way point, let the bar roll back about one inch by moving the upper arms towards your legs until they are perpendicular to the torso. Tip: Keep the bend at the elbows constant as you bring the upper arms forward.","As you exhale, press the bar back up by using the triceps to perform a close grip bench press.","Now go back to the starting position and start over.","Repeat for the recommended amount of repetitions."]],["Jackknife_Sit-Up","Jackknife Sit-Up","pull","b","compound","body only",["abdominals"],[],"strength",["Lie flat on the floor (or exercise mat) on your back with your arms extended straight back behind your head and your legs extended also. This will be your starting position.","As you exhale, bend at the waist while simultaneously raising your legs and arms to meet in a jackknife position. Tip: The legs should be extended and lifted at approximately a 35-45 degree angle from the floor and the arms should be extended and parallel to your legs. The upper torso should be off the floor.","While inhaling, lower your arms and legs back to the starting position.","Repeat for the recommended amount of repetitions."]],["Janda_Sit-Up","Janda Sit-Up","pull","b","isolation","body only",["abdominals"],[],"strength",["Position your body on the floor in the basic sit-up position; knees to a ninety degree angle with feet flat on the floor and arms either crossed over your chest or to the sides. This will be your starting position.","As you strongly tighten your glutes and hamstrings, fill your lungs with air and in a slow (three to six second count) ascent, slowly exhale. Tip: It is important to tighten the glutes and hamstrings as this will cause the hip flexors to be inactivated in a process called reciprocal inhibition, which basically means that opposite muscles to the contracted ones will relax.","As you inhale, slowly go back in a controlled manner to the starting position.","Repeat for the recommended amount of repetitions."]],["Jefferson_Squats","Jefferson Squats","push","i","compound","barbell",["quadriceps"],["calves","glutes","hamstrings","lower back","traps"],"strength",["Place a barbell on the floor.","Stand in the middle of the bar length wise.","Bend down by bending at the knees and keeping your back straight and grasp the front of the bar with your right hand. Your palm should be in (neutral grip) facing the left side.","Grasp the rear of the bar with your left hand. The palm of your hand should be in neutral grip alignment (palms facing the right side). Tip: Ensure that your grip is even on the bar. Your torso should be positioned right in the middle of the bar and the distance between your torso and your right hand (which should be at the front) should be the same as the distance between your torso and your left hand (which should be to your back).","Now stand straight up with the weight. Tip: Your feet should be shoulder width apart and your toes slightly pointed out.","Squat down by bending at the knees and keeping your back straight until your upper thighs are parallel with the floor. Tip: Keep your back as vertical as possible with the floor and your head up. Also remember to not let your knees go past your toes. Inhale during this portion of the movement.","Now drive yourself back up to the starting position by pushing with the feet . Tip: Keep the bar hanging at arm's length and your elbows locked with a slight bend. The arms only serve as hooks. Avoid doing any lifting with them. Do the lifting with your thighs; not your arms."]],["Jerk_Balance","Jerk Balance","push","i","compound","barbell",["shoulders"],["glutes","hamstrings","quadriceps","triceps"],"olympic weightlifting",["This drill helps you learn to drive yourself low enough during the jerk and corrects those who move backward during the movement. Begin with the bar racked in the jerk position, with the shoulders forward, torso upright, and the feet split slightly apart.","Initiate the movement as you would a normal jerk, dipping at the knees while keeping your torso vertical, and driving back up forcefully, using momentum and not your arms to elevate the weight.","Keep the rear foot in place, using it to drive your body forward into a full split as you jerk the weight. Recover by standing up with the weight overhead."]],["Jerk_Dip_Squat","Jerk Dip Squat","push","i","compound","barbell",["quadriceps"],["abdominals","calves"],"olympic weightlifting",["This movement strengthens the dip portion of the jerk. Begin with the bar racked in the jerk position, with the shoulders forward to create a shelf and the bar lightly contacting the throat. The feet should be directly under the hips, with the feet turned out as is comfortable.","Keeping the torso vertical, dip by flexing the knees, allowing them to travel forward and without moving the hips to the rear. The dip should not be excessive. Return the weight to the starting position by driving forcefully though the feet."]],["Jogging_Treadmill","Jogging, Treadmill","","b","","machine",["quadriceps"],["glutes","hamstrings"],"cardio",["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."]],["Keg_Load","Keg Load","pull","i","compound","other",["lower back"],["abdominals","biceps","calves","forearms","glutes","hamstrings","middle back","quadriceps","shoulders","traps"],"strongman",["To load kegs, place the desired number a distance from the loading platform, typically 30-50 feet.","Begin by grabbing the close handle of the first keg, tilting it onto its side to grab the opposite edge of the bottom of the keg. Lift the keg up to your chest.","The higher you can place the keg, the faster you should be able to move to the platform. Shouldering is usually not allowed. Be sure to keep a firm hold on the keg. Move as quickly as possible to the platform, and load it, extending through your hips, knees, and ankles to get it as high as possible.","Return to the starting position to retrieve the next keg, and repeat until the event is completed."]],["Kettlebell_Arnold_Press","Kettlebell Arnold Press","push","i","compound","kettlebells",["shoulders"],["triceps"],"strength",["Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you raise the kettlebell towards your shoulder. The palm should be facing inward.","Looking straight ahead, press the kettlebell out and overhead, rotating your wrist so that your palm faces forward at the top of the motion.","Return the kettlebell to the starting position, with the palm facing in."]],["Kettlebell_Dead_Clean","Kettlebell Dead Clean","pull","i","compound","kettlebells",["hamstrings"],["calves","glutes","lower back","quadriceps","traps"],"strength",["Place kettlebell between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean the kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.","Lower the kettlebell, keeping the hamstrings loaded by keeping your back straight and your butt out."]],["Kettlebell_Figure_8","Kettlebell Figure 8","pull","i","","kettlebells",["abdominals"],["hamstrings","shoulders"],"strength",["Place one kettlebell between your legs and take a wider than shoulder width stance. Bend over by pushing your butt out and keeping your back flat.","Pick up a kettlebell and pass it to your other hand between your legs. The receiving hand should reach from behind the legs. Go back and forth for several repetitions."]],["Kettlebell_Halo","Kettlebell Halo","","b","compound","kettlebells",["shoulders"],["traps","middle back","abdominals","triceps"],"strength",["Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down. This is your starting position.","Keeping your elbows close to your head, move the kettlebell up past one ear and around behind your head.","Continue the circle past the opposite ear and back down to the starting position in front of your chest, letting the bell pass close to your body throughout.","Complete the prescribed number of circles in one direction, then repeat the same number in the opposite direction.","Move slowly and keep your head, hips and lower back still. If your lower back arches or the bell drifts far from your head, use a lighter weight."]],["Kettlebell_Halo_With_Overhead_Extension","Kettlebell Halo with Overhead Extension","push","i","compound","kettlebells",["shoulders","triceps"],["traps","middle back","abdominals"],"strength",["Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down. This is your starting position.","Keeping your elbows close to your head, move the kettlebell up past one ear and around until it sits behind your head. Pause here.","From this position, extend your elbows to press the kettlebell up and overhead until your arms are straight, keeping your upper arms alongside your head.","Bend your elbows to lower the kettlebell back to the pause position behind your head, under control.","Continue the circle past the opposite ear and back down to the starting position in front of your chest to complete one repetition.","Alternate the direction of the circle on each repetition. Keep your head, hips and lower back still throughout; if your lower back arches or you cannot reach the overhead position without leaning back, use a lighter weight or perform the halo and the extension as separate exercises."]],["Kettlebell_Hang_Clean","Kettlebell Hang Clean","pull","i","compound","kettlebells",["hamstrings"],["calves","glutes","lower back","shoulders","traps"],"strength",["Place kettlebell between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.","Lower kettlebell to a hanging position between your legs while keeping the hamstrings loaded. Keep your head up at all times."]],["Kettlebell_One-Legged_Deadlift","Kettlebell One-Legged Deadlift","pull","i","compound","kettlebells",["hamstrings"],["glutes","lower back"],"strength",["Hold a kettlebell by the handle in one hand. Stand on one leg, on the same side that you hold the kettlebell.","Keeping that knee slightly bent, perform a stiff legged deadlift by bending at the hip, extending your free leg behind you for balance.","Continue lowering the kettlebell until you are parallel to the ground, and then return to the upright position."]],["Kettlebell_Overhead_Triceps_Extension","Kettlebell Overhead Triceps Extension","push","b","isolation","kettlebells",["triceps"],["shoulders","abdominals"],"strength",["Stand with your feet hip-width apart, holding a kettlebell by the horns with both hands. Press it overhead until your arms are extended, with the bell hanging behind your hands.","Brace your abdominals and keep your upper arms vertical and close to your head. This is your starting position.","Bend at the elbows to lower the kettlebell behind your head, going as far as your shoulder mobility allows without your elbows flaring outward.","Extend your elbows to press the kettlebell back to the starting position, keeping your upper arms still throughout.","Keep your ribcage down and avoid arching your lower back as you extend."]],["Kettlebell_Pass_Between_The_Legs","Kettlebell Pass Between The Legs","pull","i","compound","kettlebells",["abdominals"],["glutes","hamstrings","shoulders"],"strength",["Place one kettlebell between your legs and take a comfortable stance. Bend over by pushing your butt out and keeping your back flat.","Pick up a kettlebell and pass it to your other hand between your legs, in the fashion of a \"W\". Go back and forth for several repetitions."]],["Kettlebell_Pirate_Ships","Kettlebell Pirate Ships","push","b","compound","kettlebells",["shoulders"],["abdominals"],"strength",["With a wide stance, hold a kettlebell with both hands. Allow it to hang at waist level with your arms extended. This will be your starting position.","Initiate the movement by turning to one side, swinging the kettlebell to head height. Briefly pause at the top of the motion.","Allow the bell to drop as you rotate to the opposite side, again raising the kettlebell to head height.","Repeat for the desired amount of repetitions."]],["Kettlebell_Pistol_Squat","Kettlebell Pistol Squat","push","e","compound","kettlebells",["quadriceps"],["calves","glutes","hamstrings","shoulders"],"strength",["Pick up a kettlebell with two hands and hold it by the horns. Hold one leg off of the floor and squat down on the other.","Squat down by flexing the knee and sitting back with the hips, holding the kettlebell up in front of you.","Hold the bottom position for a second and then reverse the motion, driving through the heel and keeping your head and chest up.","Lower yourself again and repeat."]],["Kettlebell_Seated_Press","Kettlebell Seated Press","push","i","compound","kettlebells",["shoulders"],["triceps"],"strength",["Sit on the floor and spread your legs out comfortably.","Clean one kettlebell to your shoulder.","Press the kettlebell up and out until it is locked out overhead. Return to the starting position."]],["Kettlebell_Seesaw_Press","Kettlebell Seesaw Press","push","i","compound","kettlebells",["shoulders"],["triceps"],"strength",["Clean two kettlebells two your shoulders.","Press one kettlebell.","Lower the kettlebell and immediately press the other kettlebell. Make sure to do the same amount of reps on both sides."]],["Kettlebell_Sumo_High_Pull","Kettlebell Sumo High Pull","pull","i","compound","kettlebells",["traps"],["adductors","glutes","hamstrings","quadriceps","shoulders"],"strength",["Place a kettlebell on the ground between your feet. Position your feet in a wide stance, and grasp the kettlebell with two hands. Set your hips back as far as possible, with your knees bent. Keep your chest and head up. This will be your starting position.","Begin by extending the hips and knees, simultaneously pulling the kettlebell to your shoulders, raising your elbows as you do so. Reverse the motion to return to the starting position."]],["Kettlebell_Thruster","Kettlebell Thruster","push","i","compound","kettlebells",["shoulders"],["quadriceps","triceps"],"strength",["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so. This will be your starting position.","Begin to squat by flexing your hips and knees, lowering your hips between your legs. Maintain an upright, straight back as you descend as low as you can.","At the bottom, reverse direction and squat by extending your knees and hips, driving through your heels. As you do so, press both kettlebells overhead by extending your arms straight up, using the momentum from the squat to help drive the weights upward.","As you begin the next repetition, return the weights to the shoulders."]],["Kettlebell_Turkish_Get-Up_Lunge_style","Kettlebell Turkish Get-Up (Lunge style)","push","i","compound","kettlebells",["shoulders"],["abdominals","hamstrings","quadriceps","triceps"],"strength",["Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.","Keeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position. Using your free hand, push yourself to a seated position, then progressing to one knee.","While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."]],["Kettlebell_Turkish_Get-Up_Squat_style","Kettlebell Turkish Get-Up (Squat style)","push","i","compound","kettlebells",["shoulders"],["abdominals","calves","hamstrings","quadriceps","triceps"],"strength",["Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.","Keeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position.","Using your free hand, push yourself to a seated position, then progressing to your feet. While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."]],["Kettlebell_Windmill","Kettlebell Windmill","pull","i","compound","kettlebells",["abdominals"],["glutes","hamstrings","shoulders","triceps"],"strength",["Place a kettlebell in front of your lead foot and clean and press it overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so, so that the palm faces forward. Press it overhead by extending the elbow.","Keeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Turn your feet out at a forty-five degree angle from the arm with the locked out kettlebell. Bending at the hip to one side, sticking your butt out, slowly lean until you can touch the floor with your free hand. Keep your eyes on the kettlebell that you hold over your head at all times.","Pause for a second after reaching the ground and reverse the motion back to the starting position."]],["Kipping_Muscle_Up","Kipping Muscle Up","pull","i","compound","other",["lats"],["abdominals","biceps","forearms","middle back","shoulders","traps","triceps"],"strength",["Grip the rings using a false grip, with the base of your palms on top of the rings.","Begin with a movement swinging your legs backward slightly.","Counter that movement by swinging your legs forward and up, jerking your chin and chest back, pulling yourself up with both arms as you do so. As you reach the top position of the pull-up, pull the rings to your armpits as you roll your shoulders forward, allowing your elbows to move straight back behind you. This puts you into the proper position to continue into the dip portion of the movement.","Maintaining control and stability, extend through the elbow to complete the motion.","Use care when lowering yourself to the ground."]],["Knee_Across_The_Body","Knee Across The Body","static","b","","",["glutes"],["abductors","lower back"],"stretching",["Lie down on the floor with your right leg straight. Bend your left leg and lower it across your body, holding the knee down toward the floor with your right hand. (The knee doesn't need to touch the floor if you're tight.)","Place your left arm comfortably beside you and turn your head to the left. Imagine you have a weight tied to your tailbone. let your tailbone fall back toward the floor as your chest reaches in the opposite direction to stretch your lower back. Switch sides."]],["Knee_Circles","Knee Circles","pull","b","compound","body only",["calves"],["hamstrings","quadriceps"],"stretching",["Stand with your legs together and hands by your waist.","Now move your knees in a circular motion as you breathe normally.","Repeat for the recommended amount of repetitions."]],["Knee_Hip_Raise_On_Parallel_Bars","Knee/Hip Raise On Parallel Bars","pull","b","isolation","other",["abdominals"],[],"strength",["Position your body on the vertical leg raise bench so that your forearms are resting on the pads next to the torso and holding on to the handles. Your arms will be bent at a 90 degree angle.","The torso should be straight with the lower back pressed against the pad of the machine and the legs extended pointing towards the floor. This will be your starting position.","Now as you breathe out, lift your legs up as you keep them extended. Continue this movement until your legs are roughly parallel to the floor and then hold the contraction for a second. Tip: Do not use any momentum or swinging as you perform this exercise.","Slowly go back to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]],["Knee_Tuck_Jump","Knee Tuck Jump","push","b","compound","body only",["hamstrings"],["abductors","adductors","calves","glutes","quadriceps"],"plyometrics",["Begin in a comfortable standing position with your knees slightly bent. Hold your hands in front of you, palms down with your fingertips together at chest height. This will be your starting position.","Rapidly dip down into a quarter squat and immediately explode upward. Drive the knees towards the chest, attempting to touch them to the palms of the hands.","Jump as high as you can, raising your knees up, and then ensure a good land be re-extending your legs, absorbing impact through be allowing the knees to rebend."]],["Kneeling_Arm_Drill","Kneeling Arm Drill","pull","b","","",["shoulders"],["abdominals"],"plyometrics",["This drill helps increase arm efficiency during the run. Begin kneeling, left foot in front, right knee down. Apply pressure through the front heel to keep your glutes and hamstrings activated.","Begin by blocking the arms in long, pendulum like swings. Close the arm angle, blocking with the arms as you would when jogging, progressing to a run and finally a sprint.","As soon as your hands pass the hip, accelerate them forward during the sprinting motion to move them as quickly as possible.","Switch knees and repeat."]],["Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists","Kneeling Cable Crunch With Alternating Oblique Twists","pull","b","isolation","cable",["abdominals"],[],"strength",["Connect a rope attachment to a high pulley cable and position a mat on the floor in front of it.","Grab the rope with both hands and kneel approximately two feet back from the tower.","Position the rope behind your head with your hands by your ears.","Keep your hands in the same place, contract your abs and pull downward on the rope in a crunching movement until your elbows reach your knees.","Pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.","Repeat the same downward movement until you're halfway down, at which time you'll begin rotating one of your elbows to the opposite knee.","Again, pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.","Repeat the same movement as before, but alternate the other elbow to the opposite knee.","Continue this series of movements to failure."]],["Kneeling_Cable_Triceps_Extension","Kneeling Cable Triceps Extension","push","i","isolation","cable",["triceps"],[],"strength",["Place a bench sideways in front of a high pulley machine.","Hold a straight bar attachment above your head with your hands about 6 inches apart with your palms facing down.","Face away from the machine and kneel.","Place your head and the back of your upper arms on the bench. Your elbows should be bent with the forearms pointing towards the high pulley. This will be your starting position.","While keeping your upper arms close to your head at all times with the elbows in, press the bar out in a semicircular motion until the elbows are locked and your arms are parallel to the floor. Contract the triceps hard and keep this position for a second. Exhale as you perform this movement.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]],["Kneeling_Forearm_Stretch","Kneeling Forearm Stretch","static","b","isolation","",["forearms"],[],"stretching",["Start by kneeling on a mat with your palms flat and your fingers pointing back toward your knees.","Slowly lean back keeping your palms flat on the floor until you feel a stretch in your wrists and forearms. Hold for 20-30 seconds."]],["Kneeling_High_Pulley_Row","Kneeling High Pulley Row","pull","b","compound","cable",["lats"],["biceps","middle back"],"strength",["Select the appropriate weight using a pulley that is above your head. Attach a rope to the cable and kneel a couple of feet away, holding the rope out in front of you with both arms extended. This will be your starting position.","Initiate the movement by flexing the elbows and fully retracting your shoulders, pulling the rope toward your upper chest with your elbows out.","After pausing briefly, slowly return to the starting position."]],["Kneeling_Hip_Flexor","Kneeling Hip Flexor","static","b","isolation","",["quadriceps"],["quadriceps"],"stretching",["Kneel on a mat and bring your right knee up so the bottom of your foot is on the floor and extend your left leg out behind you so the top of your foot is on the floor.","Shift your weight forward until you feel a stretch in your hip. Hold for 15 seconds, then repeat for your other side."]],["Kneeling_Jump_Squat","Kneeling Jump Squat","push","e","compound","barbell",["glutes"],["calves","hamstrings","quadriceps"],"olympic weightlifting",["Begin kneeling on the floor with a barbell racked across the back of your shoulders, or you can use your body weight for this exercise. This can be done inside of a power rack to make unracking easier.","Sit back with your hips until your glutes touch your feet, keeping your head and chest up.","Explode up with your hips, generating enough power to land with your feet flat on the floor.","Continue with the squat by driving through your heels and extending the knees to come to a standing position."]],["Kneeling_Single-Arm_High_Pulley_Row","Kneeling Single-Arm High Pulley Row","pull","b","compound","cable",["lats"],["biceps","middle back"],"strength",["Attach a single handle to a high pulley and make your weight selection.","Kneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.","Starting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.","After a brief pause, return to the starting position."]],["Kneeling_Squat","Kneeling Squat","push","i","compound","barbell",["glutes"],["abdominals","hamstrings","lower back"],"powerlifting",["Set the bar to the proper height in a power rack. Kneel behind the bar; it may be beneficial to put a mat down to pad your knees. Slide under the bar, racking it across the back of your shoulders. Your shoulder blades should be retracted and the bar tight across your back. Unrack the weight.","With your head looking forward, sit back with your butt until you touch your calves.","Reverse the motion, returning the torso to an upright position."]],["Landmine_180s","Landmine 180's","pull","b","compound","barbell",["abdominals"],["glutes","lower back","shoulders"],"strength",["Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.","Raise the bar from the floor, taking it to shoulder height with both hands with your arms extended in front of you. Adopt a wide stance. This will be your starting position.","Perform the movement by rotating the trunk and hips as you swing the weight all the way down to one side. Keep your arms extended throughout the exercise.","Reverse the motion to swing the weight all the way to the opposite side.","Continue alternating the movement until the set is complete."]],["Landmine_Linear_Jammer","Landmine Linear Jammer","push","i","compound","barbell",["shoulders"],["abdominals","calves","chest","hamstrings","quadriceps","triceps"],"strength",["Position a bar into landmine or, lacking one, securely anchor it in a corner. Load the bar to an appropriate weight and position the handle attachment on the bar.","Raise the bar from the floor, taking the handles to your shoulders. This will be your starting position.","In an athletic stance, squat by flexing your hips and setting your hips back, keeping your arms flexed.","Reverse the motion by powerfully extending through the hips, knees, and ankles, while also extending the elbows to straighten the arms. This movement should be done explosively, coming out of the squat to full extension as powerfully as possible.","Return to the starting position."]],["Lateral_Bound","Lateral Bound","push","b","compound","body only",["adductors"],["abductors","calves","glutes","hamstrings","quadriceps"],"plyometrics",["Assume a half squat position facing 90 degrees from your direction of travel. This will be your starting position.","Allow your lead leg to do a countermovement inward as you shift your weight to the outside leg.","Immediately push off and extend, attempting to bound to the side as far as possible.","Upon landing, immediately push off in the opposite direction, returning to your original start position.","Continue back and forth for several repetitions."]],["Lateral_Box_Jump","Lateral Box Jump","push","b","compound","other",["adductors"],["abductors","calves","glutes","hamstrings","quadriceps"],"plyometrics",["Assume a comfortable standing position, with a short box positioned next to you. This will be your starting position.","Quickly dip into a quarter squat to initiate the stretch reflex, and immediately reverse direction to jump up and to the side.","Bring your knees high enough to ensure your feet have good clearance over the box.","Land on the center of the box, using your legs to absorb the impact.","Carefully jump down to the other side of the box, and continue going back and forth for several repetitions."]],["Lateral_Cone_Hops","Lateral Cone Hops","push","b","compound","other",["adductors"],["abductors","calves","glutes","hamstrings","quadriceps"],"plyometrics",["Position a number of cones in a row several feet apart.","Stand next to the end of the cones, facing 90 degrees to the direction of travel. This will be your starting position.","Begin the jump by dipping with the knees to initiate a stretch reflex, and immediately reverse direction to push off the ground, jumping up and sideways over the cone.","Use your legs to absorb impact upon landing, and rebound into the next jump, continuing down the row of cones."]],["Lateral_Raise_-_With_Bands","Lateral Raise - With Bands","push","b","isolation","bands",["shoulders"],[],"strength",["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on the sides of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the handles to the sides as you exhale. Continue to lift the handles until they are slightly above parallel. Tip: As you lift the handles, slightly tilt the hand as if you were pouring water and keep your arms extended. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]],["Latissimus_Dorsi-SMR","Latissimus Dorsi-SMR","static","b","isolation","foam roll",["lats"],[],"stretching",["While lying on the floor, place a foam roll under your back and to one side, just behind your arm pit. This will be your starting position.","Keep the arm of the side being stretched behind and to the side of you as you shift your weight onto your lats, keeping your upper body off of the ground. Hold for 10-30 seconds, and switch sides."]],["Leg-Over_Floor_Press","Leg-Over Floor Press","push","i","compound","kettlebells",["chest"],["shoulders","triceps"],"strength",["Lie on the floor with one kettlebell in place on your chest, holding it by the handle. Extend leg on working side over leg on non-working side.Your free arm can be extended out to your side for support.","Press the kettlebll into a locked out position.","Lower the weight until the elbow touches the ground, keeping the kettlebell above the elbow. Repeat for the desired number of repetitions."]],["Leg-Up_Hamstring_Stretch","Leg-Up Hamstring Stretch","push","b","isolation","",["hamstrings"],[],"stretching",["Lie flat on your back, bend one knee, and put that foot flat on the floor to stabilize your spine.","Extend the other leg in the air. If you're tight, you wont be able to straighten it. That's okay. Extend the knee so that the sole of the lifted foot faces the ceiling (or as close as you can get it).","Slowly straighten the legs as much as possible and then pull the leg toward your nose. Switch sides."]],["Leg_Extensions","Leg Extensions","push","b","isolation","machine",["quadriceps"],[],"strength",["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."]],["Leg_Lift","Leg Lift","push","b","isolation","body only",["glutes"],["hamstrings"],"strength",["While standing up straight with both feet next to each other at around shoulder width, grab a sturdy surface such as the sides of a squat rack or the top of a chair to brace yourself and keep balance.","With or without an ankle weight, lift one leg behind you as if performing a leg curl but standing up while keeping the other leg straight. Breathe out as you perform this movement.","Slowly bring the raised leg back to the floor as you breathe in.","Repeat for the recommended amount of repetitions.","Repeat the movement with the opposite leg."]],["Leg_Press","Leg Press","push","b","compound","machine",["quadriceps"],["calves","glutes","hamstrings"],"strength",["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."]],["Leg_Pull-In","Leg Pull-In","pull","b","compound","body only",["abdominals"],[],"strength",["Lie on an exercise mat with your legs extended and your hands either palms facing down next to you or under your glutes. Tip: My preference is with the hands next to me. This will be your starting position.","Bend your knees and pull your upper thighs into your midsection as you breathe out. Continue the motion until your knees are around chest level. Contract your abs as you execute this movement and hold for a second at the top. Tip: As you perform the motion, the lower legs (calves) should always remain parallel to the floor.","Return to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]],["Leverage_Chest_Press","Leverage Chest Press","push","b","compound","machine",["chest"],["shoulders","triceps"],"strength",["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.","Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]],["Leverage_Deadlift","Leverage Deadlift","pull","b","compound","machine",["quadriceps"],["glutes","hamstrings"],"strength",["Load the pins to an appropriate weight. Position yourself directly between the handles. Grasp the bottom handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up. This will be your starting position.","Return the weight to the starting position."]],["Leverage_Decline_Chest_Press","Leverage Decline Chest Press","push","b","compound","machine",["chest"],["shoulders","triceps"],"strength",["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]],["Leverage_High_Row","Leverage High Row","pull","b","compound","machine",["middle back"],["lats"],"strength",["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position.","For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."]],["Leverage_Incline_Chest_Press","Leverage Incline Chest Press","push","b","compound","machine",["chest"],["shoulders","triceps"],"strength",["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]],["Leverage_Iso_Row","Leverage Iso Row","pull","b","compound","machine",["lats"],["biceps","middle back"],"strength",["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."]],["Leverage_Shoulder_Press","Leverage Shoulder Press","push","b","compound","machine",["shoulders"],["triceps"],"strength",["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.","Press the handles upward by extending through the elbow.","After a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]],["Leverage_Shrug","Leverage Shrug","pull","b","isolation","machine",["traps"],["forearms"],"strength",["Load the pins to an appropriate weight. Position yourself directly between the handles.","Grasp the top handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up.","Drive through the floor with your heels, extending your hips and knees as you rise to a standing position. Keep your arms straight throughout the movement, finishing with your shoulders back. This will be your starting position.","Raise the weight by shrugging the shoulders towards your ears, moving straight up and down.","Pause at the top of the motion, and then return the weight to the starting position."]],["Linear_3-Part_Start_Technique","Linear 3-Part Start Technique","push","b","compound","",["hamstrings"],["calves","quadriceps"],"plyometrics",["This drill helps you accelerate as quickly as possible into a sprint from a dead stop. It helps to use a line to start from. Begin with two feet on the line. Place your left foot with the toe next to your right ankle. Place your right foot 4-6 inches behind the left.","Place your right hand onto the line, and thing bring your nose close to your left knee.","Squat down as you lean foward, your head being lower than your hips and your weight loaded onto the left leg. This will be your starting position.","Take your left hand up so that it is parallel to the ground, pointing behind you, and explode out when ready."]],["Linear_Acceleration_Wall_Drill","Linear Acceleration Wall Drill","","b","compound","",["hamstrings"],["calves","glutes","quadriceps"],"plyometrics",["Lean at around 45 degrees against a wall. Your feet should be together, glutes contracted.","Begin by lifting your right knee quickly, pausing, and then driving it straight down into the ground.","Switch legs, raising the opposite knee, and then attacking the ground straight down.","Repeat once more with your right leg, and as soon as the right foot strikes the ground hammer them out rapidly, alternating left and right as fast as you can."]],["Linear_Depth_Jump","Linear Depth Jump","push","i","compound","other",["quadriceps"],["calves","glutes","hamstrings"],"plyometrics",["You will need two boxes or benches spaced a few feet away from each other. Begin by standing on one box facing towards the other platform.","To initiate the movement, gently drop down to the ground between your platforms, allowing the knees and hips to flex.","Reverse the motion by exploding, extending through the hips, knees, and ankles to jump onto the other platform.","Land softly, asborbing the impact through the legs."]],["Log_Lift","Log Lift","push","i","compound","other",["shoulders"],["abdominals","chest","glutes","hamstrings","lower back","middle back","quadriceps","traps","triceps"],"strongman",["Begin standing with the log in front of you. Grasp the handles, and begin to clean the log. As you are bent over to start the clean, attempt to get the log as high as possible, pulling it into your chest. Extend through the hips and knees to bring it up to complete the clean.","Push your head back and look up, creating a shelf on your chest to rest the log. Begin the press by dipping, flexing slightly through the knees and reversing the motion. This push press will generate momentum to start the log moving vertically. Continue by extending through the elbows to press the log above your head. There are no strict rules on form, so use whatever techniques you are most efficient with. As the log is pressed, ensure that you push your head through on each repetition, looking forward.","Repeat as many times as possible. Attempt to control the descent of the log as it is returned to the ground."]],["London_Bridges","London Bridges","pull","i","compound","other",["lats"],["biceps","forearms","middle back"],"strength",["Attach a climbing rope to a high beam or cross member. Below it, ensure that the smith machine bar is locked in place with the safeties and cannot move. Alternatively, a secure box could also be utilized.","Stand on the bar, using the rope to balance yourself. This will be your starting position.","Keeping your body straight, lean back and lower your body by slowly going hand over hand with the rope. Continue until you are perpendicular to the ground.","Keeping your body straight, reverse the motion, going hand over hand back to the starting position."]],["Looking_At_Ceiling","Looking At Ceiling","static","b","isolation","",["quadriceps"],[],"stretching",["Kneel on the floor, holding your heels with both hands.","Lift your buttocks up and forward while bringing your head back to look up at the ceiling, to give an arch in your back."]],["Low_Cable_Crossover","Low Cable Crossover","push","b","isolation","cable",["chest"],["shoulders"],"strength",["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.","Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.","With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.","Return your arms back to the starting position after a brief pause."]],["Low_Cable_Triceps_Extension","Low Cable Triceps Extension","push","b","isolation","cable",["triceps"],[],"strength",["Select the desired weight and lay down face up on the bench of a seated row machine that has a rope attached to it. Your head should be pointing towards the attachment.","Grab the outside of the rope ends with your palms facing each other (neutral grip).","Position your elbows so that they are bent at a 90 degree angle and your upper arms are perpendicular (90 degree angle) to your torso. Tip: Keep the elbows in and make sure that the upper arms point to the ceiling while your forearms point towards the pulley above your head. This will be your starting position.","As you breathe out, extend your lower arms until they are straight and vertical. The upper arms and elbows remain stationary throughout the movement. Only the forearms should move. Contract the triceps hard for a second.","As you breathe in slowly return to the starting position.","Repeat for the recommended amount of repetitions."]],["Low_Pulley_Row_To_Neck","Low Pulley Row To Neck","pull","b","compound","cable",["shoulders"],["biceps","middle back","traps"],"strength",["Sit on a low pulley row machine with a rope attachment.","Grab the ends of the rope using a palms-down grip and sit with your back straight and your knees slightly bent. Tip: Keep your back almost completely vertical and your arms fully extended in front of you. This will be your starting position.","While keeping your torso stationary, lift your elbows and start bending them as you pull the rope towards your neck while exhaling. Throughout the movement your upper arms should remain parallel to the floor. Tip: Continue this motion until your hands are almost next to your ears (the forearms will not be parallel to the floor at the end of the movement as they will be angled a bit upwards) and your elbows are out away from your sides.","After holding for a second or so at the contracted position, come back slowly to the starting position as you inhale. Tip: Again, during no part of the movement should the torso move.","Repeat for the recommended amount of repetitions."]],["Lower_Back-SMR","Lower Back-SMR","static","b","","foam roll",["lower back"],[],"stretching",["In a seated position, place a foam roll under your lower back. Cross your arms in front of you and protract your shoulders. This will be your starting position.","Raise your hips off of the floor and lean back, keeping your weight on your lower back. Now shift your weight slightly to one side, keeping your weight off of the spine and on the muscles to the side of it. Roll over your lower back, holding points of tension for 10-30 seconds. Repeat on the other side."]],["Lower_Back_Curl","Lower Back Curl","static","b","","body only",["abdominals"],[],"stretching",["Lie on your stomach with your arms out to your sides. This will be your starting position.","Using your lower back muscles, extend your spine lifting your chest off of the ground. Do not use your arms to push yourself up. Keep your head up during the movement. Repeat for 10-20 repetitions."]],["Lunge_Pass_Through","Lunge Pass Through","push","i","compound","kettlebells",["hamstrings"],["calves","glutes","quadriceps"],"strength",["Stand with your torso upright holding a kettlebell in your right hand. This will be your starting position.","Step forward with your left foot and lower your upper body down by flexing the hip and the knee, keeping the torso upright. Lower your back knee until it nearly touches the ground.","As you lunge, pass the kettlebell under your front leg to your opposite hand.","Pressing through the heel of your foot, return to the starting position.","Repeat the movement for the recommended amount of repetitions, alternating legs."]],["Lunge_Sprint","Lunge Sprint","push","i","compound","machine",["quadriceps"],["calves","glutes","hamstrings"],"strength",["Adjust a bar in a Smith machine to an appropriate height. Position yourself under the bar, racking it across the back of your shoulders. Unrack the bar, and then split your feet, moving one foot forward and one foot back. This will be your starting position.","Lower your back knee nearly to the ground, flexing the knees and lowering your hips as you do so.","At the bottom of the descent, immediately reverse direction. Explosively drive through the heel of your front foot with light pressure from your back foot. Jump up and reverse the position of your legs.","Repeat for the recommended amount of repetitions."]],["Lying_Bent_Leg_Groin","Lying Bent Leg Groin","static","e","","other",["adductors"],[],"stretching",["Lie on your back with your knees bent and the soles of the feet pressed together. Have your partner hold your knees. This will be your starting position.","Attempt to squeeze your knees together, while your partner prevents any movement from occurring.","After 10-20 seconds, relax your muscles as your partner gently pushes your knees towards the floor. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching."]],["Lying_Cable_Curl","Lying Cable Curl","pull","i","isolation","cable",["biceps"],[],"strength",["Grab a straight bar or E-Z bar attachment that is attached to the low pulley with both hands, using an underhand (palms facing up) shoulder-width grip.","Lie flat on your back on top of an exercise mat in front of the weight stack with your feet flat against the frame of the pulley machine and your legs straight.","With your arms extended and your elbows close to your body slightly bend your arms. This will be your starting position.","While keeping your upper arms stationary and the elbows close to your body, curl the bar up slowly toward your chest as you breathe out and you squeeze the biceps.","After a second squeeze at the top of the movement, slowly return to the starting position.","Repeat for the recommended amount of repetitions."]],["Lying_Cambered_Barbell_Row","Lying Cambered Barbell Row","pull","b","isolation","barbell",["middle back"],["biceps","lats","traps"],"strength",["Place a cambered bar underneath an exercise bench.","Lie face down on the exercise bench and grab the bar using a palms down (pronated grip) that is wider than shoulder width. This will be your starting position.","As you exhale row the bar up as you keep the elbows close to your body to either your chest, in order to target the upper mid back, or to your stomach if targeting the lats is your goal.","After a second hold at the top, lower back down to the starting position slowly as you inhale."]],["Lying_Close-Grip_Bar_Curl_On_High_Pulley","Lying Close-Grip Bar Curl On High Pulley","pull","b","isolation","cable",["biceps"],[],"strength",["Place a flat bench in front of a high pulley or lat pulldown machine.","Hold the straight bar attachment using an underhand grip (palms up) that is about shoulder width.","Lie on your back with your head over the end of the bench.","Now extend your arms straight above your shoulders. Your torso and your arms should make a 90-degree angle and the elbows should be in. This will be your starting position.","As you breathe out, curl the bar down in a semicircular motion until it touches your chin. Squeeze the biceps for a second at the top contracted position. Tip: As you execute this motion only the forearms should move. At no time should the upper arms be moving at all. They are to remain perpendicular throughout the movement.","Return to starting position slowly.","Repeat for the recommended amount of repetitions."]],["Lying_Close-Grip_Barbell_Triceps_Extension_Behind_The_Head","Lying Close-Grip Barbell Triceps Extension Behind The Head","push","i","isolation","barbell",["triceps"],[],"strength",["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head close to the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.","Extend your arms in front of you and slowly bring the bar back in a semi circular motion (while keeping the arms extended) to a position over your head. At the end of this step your arms should be overhead and parallel to the floor. This will be your starting position. Tip: Keep your elbows in at all times.","As you inhale, lower the bar by bending at the elbows and while keeping the upper arm stationary. Keep lowering the bar until your forearms are perpendicular to the floor.","As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion until the lower arms are also parallel to the floor. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times.","Repeat for the recommended amount of repetitions."]],["Lying_Close-Grip_Barbell_Triceps_Press_To_Chin","Lying Close-Grip Barbell Triceps Press To Chin","push","i","isolation","e-z curl bar",["triceps"],[],"strength",["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head off the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.","Extend your arms in front of you as you hold the barbell over your chest. The arms should be perpendicular to your torso (90-degree angle). This will be your starting position.","As you inhale, lower the bar in a semi-circular motion by bending at the elbows and while keeping the upper arm stationary and elbows in. Keep lowering the bar until it lightly touches your chin.","As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times.","Repeat for the recommended amount of repetitions."]],["Lying_Crossover","Lying Crossover","static","e","","body only",["abductors"],[],"stretching",["Lie on your back with your legs extended.","Cross one leg over you
