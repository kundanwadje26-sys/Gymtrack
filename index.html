f the plate.","Using your inside foot, push the weight plate, sliding it across the floor to where you were just standing.","Place your inside foot on the weight plate, adopting a wide stance for the next repetition."]],["Squats_-_With_Bands","Squats - With Bands","push","b","compound","bands",["quadriceps"],["calves","glutes","hamstrings","lower back"],"strength",["To start out, make sure that the exercise band is at an even split between both the left and right side of the body. To do this, use your hands to grab both sides of the band and place both feet in the middle of the band. Your feet should be shoulder width apart from each other.","When holding the bands, they should be the same height on each side. You should be using a pronated grip (palms facing forward) and have the handles of the bands next to your face for this exercise. This is the starting position.","Slowly start to bend the knees and lower the legs so that your thighs are parallel to the floor while exhaling.","Use the heel of your feet to push your body up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."]],["Stairmaster","Stairmaster","","i","","machine",["quadriceps"],["calves","glutes","hamstrings"],"cardio",["To begin, step onto the stairmaster and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise.","Pump your legs up and down in an established rhythm, driving the pedals down but not all the way to the floor. It is recommended that you maintain your grip on the handles so that you don't fall. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.","Stairmasters offer convenience, cardiovascular benefits, and usually have less impact than running outside. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."]],["Standing_Alternating_Dumbbell_Press","Standing Alternating Dumbbell Press","push","b","compound","dumbbell",["shoulders"],["triceps"],"strength",["Stand with a dumbbell in each hand. Raise the dumbbells to your shoulders with your palms facing forward and your elbows pointed out. This will be your starting position.","Extend one arm to press the dumbbell straight up, keeping your off hand in place. Do not lean or jerk the weight during the movement.","After a brief pause, return the weight to the starting position.","Repeat for the opposite side, continuing to alternate between arms."]],["Standing_Barbell_Calf_Raise","Standing Barbell Calf Raise","push","b","isolation","barbell",["calves"],[],"strength",["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the bar on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: For better range of motion you may also place the ball of your feet on a wooden block but be careful as this option requires more balance and a sturdy block.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."]],["Standing_Barbell_Press_Behind_Neck","Standing Barbell Press Behind Neck","push","i","compound","barbell",["shoulders"],["triceps"],"strength",["This exercise is best performed inside a squat rack for easier pick up of the bar. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Your back should be kept straight while performing this exercise. This will be your starting position.","Elevate the barbell overhead by fully extending your arms while breathing out.","Hold the contraction for a second and lower the barbell back down to the starting position by inhaling.","Repeat for the recommended amount of repetitions."]],["Standing_Bent-Over_One-Arm_Dumbbell_Triceps_Extension","Standing Bent-Over One-Arm Dumbbell Triceps Extension","push","b","isolation","dumbbell",["triceps"],["shoulders"],"strength",["With a dumbbell in one hand and the palm facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.","The upper arm should be close to the torso and parallel to the floor while the forearm is pointing towards the floor as the hand holds the weight. Tip: There should be a 90-degree angle between the forearm and the upper arm. This is your starting position.","Keeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.","After a second contraction at the top, slowly lower the dumbbell back to the starting position as you inhale.","Repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the exercise."]],["Standing_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension","Standing Bent-Over Two-Arm Dumbbell Triceps Extension","push","b","isolation","dumbbell",["triceps"],[],"strength",["With a dumbbell in each hand and the palms facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up. The upper arms should be close to the torso and parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights. Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.","Keeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arms are extended. Like many other arm exercises, only the forearm moves.","After a second contraction at the top, slowly lower the dumbbells back to their starting position as you inhale.","Repeat the movement for the prescribed amount of repetitions."]],["Standing_Biceps_Cable_Curl","Standing Biceps Cable Curl","pull","b","isolation","cable",["biceps"],[],"strength",["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the curl bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]],["Standing_Biceps_Stretch","Standing Biceps Stretch","static","b","isolation","other",["biceps"],["chest","shoulders"],"stretching",["Clasp your hands behind your back with your palms together, straighten arms and then rotate them so your palms face downward.","Raise your arms up and hold until you feel a stretch in your biceps."]],["Standing_Bradford_Press","Standing Bradford Press","push","b","compound","barbell",["shoulders"],["triceps"],"strength",["Place a loaded bar at shoulder level in a rack. With a pronated grip at shoulder width, begin with the bar racked across the front of your shoulders. This is your starting position.","Initiate the lift by extending the elbows to press the bar overhead. Avoid locking out the elbow as you move the weight behind your head.","Lower the bar down to the back of the head until your elbow forms a right angle.","Lift the bar back over your head by extending the elbows","Lower the bar down to the starting position.","Alternate in this manner until you complete the recommended amount of repetitions."]],["Standing_Cable_Chest_Press","Standing Cable Chest Press","push","b","compound","cable",["chest"],["shoulders","triceps"],"strength",["Position dual pulleys to chest height and select an appropriate weight. Stand a foot or two in front of the cables, holding one in each hand. You can stagger your stance for better stability.","Position the upper arm at a 90 degree angle with the shoulder blades together. This will be your starting position.","Keeping the rest of the body stationary, extend through the elbows to press the handles forward, drawing them together in front of you.","Pause at the top of the motion, and return to the starting position."]],["Standing_Cable_Lift","Standing Cable Lift","pull","b","compound","cable",["abdominals"],["shoulders"],"strength",["Connect a standard handle on a tower, and move the cable to the lowest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, squat down and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle up and across your body until your arms are in a fully-extended position above your head.","Keep your back straight and your arms close to your body as you pivot your back foot and straighten your legs to get a full range of motion.","Retract your arms and then your body. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."]],["Standing_Cable_Wood_Chop","Standing Cable Wood Chop","pull","b","compound","cable",["abdominals"],["shoulders"],"strength",["Connect a standard handle to a tower, and move the cable to the highest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle down and across your body to your front knee while rotating your torso.","Keep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.","Maintain your stance and straight arms. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."]],["Standing_Calf_Raises","Standing Calf Raises","push","b","isolation","machine",["calves"],[],"strength",["Adjust the padded lever of the calf raise machine to fit your height.","Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."]],["Standing_Concentration_Curl","Standing Concentration Curl","pull","b","isolation","dumbbell",["biceps"],["forearms"],"strength",["Taking a dumbbell in your working hand, lean forward. Allow your working arm to hang perpendicular to the ground with the elbow pointing out. This will be your starting position.","Flex the elbow to curl the weight, keeping the upper arm stationary. At the top of the repetition, flex the biceps and pause.","Lower the dumbbell back to the starting position.","Repeat the movement for the prescribed amount of repetitions."]],["Standing_Dumbbell_Calf_Raise","Standing Dumbbell Calf Raise","push","i","isolation","dumbbell",["calves"],[],"strength",["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.","With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.","As you inhale, go back to the starting position by slowly lowering the heels.","Repeat for the recommended amount of times."]],["Standing_Dumbbell_Press","Standing Dumbbell Press","push","b","compound","dumbbell",["shoulders"],["triceps"],"strength",["Standing with your feet shoulder width apart, take a dumbbell in each hand. Raise the dumbbells to head height, the elbows out and about 90 degrees. This will be your starting position.","Maintaining strict technique with no leg drive or leaning back, extend through the elbow to raise the weights together directly above your head.","Pause, and slowly return the weight to the starting position."]],["Standing_Dumbbell_Reverse_Curl","Standing Dumbbell Reverse Curl","pull","i","isolation","dumbbell",["biceps"],["forearms"],"strength",["To begin, stand straight with a dumbbell in each hand using a pronated grip (palms facing down). Your arms should be fully extended while your feet are shoulder width apart from each other. This is the starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]],["Standing_Dumbbell_Straight-Arm_Front_Delt_Raise_Above_Head","Standing Dumbbell Straight-Arm Front Delt Raise Above Head","push","i","isolation","dumbbell",["shoulders"],[],"strength",["Hold the dumbbells in front of your thighs, palms facing your thighs.","Keep your arms straight with a slight bend at the elbows but keep them locked. This will be your starting position.","Raise the dumbbells in a semicircular motion to arm's length overhead as you exhale.","Slowly return to the starting position using the same path as you inhale.","Repeat for the recommended amount of repetitions."]],["Standing_Dumbbell_Triceps_Extension","Standing Dumbbell Triceps Extension","push","b","isolation","dumbbell",["triceps"],[],"strength",["To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.","The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hands should be facing up towards the ceiling. This will be your starting position.","Keeping your upper arms close to your head with elbows in and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."]],["Standing_Dumbbell_Upright_Row","Standing Dumbbell Upright Row","pull","b","compound","dumbbell",["traps"],["biceps","shoulders"],"strength",["Grasp a dumbbell in each hand with a pronated (palms forward) grip that is slightly less than shoulder width. The dumbbells should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the dumbbells as you exhale. The dumbbells should be close to the body as you move it up and the elbows should drive the motion. Continue to lift them until they nearly touch your chin. Tip: Your elbows should drive the motion. As you lift the dumbbells, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbells back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]],["Standing_Elevated_Quad_Stretch","Standing Elevated Quad Stretch","static","b","","other",["quadriceps"],[],"stretching",["Start by standing with your back about two to three feet away from a bench or step.","Lift one leg behind you and rest your foot on the step,either on your instep or the ball of your foot, whichever you find most comfortable.","Keep your supporting knee slightly bent and avoid letting that knee extend out beyond your toes. Switch sides."]],["Standing_Front_Barbell_Raise_Over_Head","Standing Front Barbell Raise Over Head","push","i","isolation","barbell",["shoulders"],[],"strength",["To begin, stand straight with a barbell in your hands. You should grip the bar with palms facing down and a closer than shoulder width grip apart from each other.","Your feet should be shoulder width apart from each other. Your elbows should be slightly bent. This is the starting position.","Lift the barbell up until it is directly over your head while exhaling. Make sure to keep your elbows slightly bent when performing each repetition.","Once you feel the contraction, begin to lower the barbell back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]],["Standing_Gastrocnemius_Calf_Stretch","Standing Gastrocnemius Calf Stretch","static","b","","",["calves"],["hamstrings"],"stretching",["Place your right heel on a step with your knee extended and lean forward to grab your right toe with your right hand. Your left knee should be slightly bent and your back should be straight.","Support your weight on your left leg and place your left hand on your left thigh.","Pull your right toes toward your knee until you feel a stretch in your calf."]],["Standing_Hamstring_and_Calf_Stretch","Standing Hamstring and Calf Stretch","static","b","","other",["hamstrings"],[],"stretching",["Being by looping a belt, band, or rope around one foot. While standing, place that foot forward.","Bend your back leg, while keeping the front one straight. Now raise the toes of your front foot off of the ground and lean forward.","Using the belt, pull on the top of the foot to increase the stretch in the calf. Hold for 10-20 seconds and repeat with the other foot."]],["Standing_Hip_Circles","Standing Hip Circles","pull","b","isolation","body only",["abductors"],["adductors"],"stretching",["Begin standing on one leg, holding to a vertical support.","Raise the unsupported knee to 90 degrees. This will be your starting position.","Open the hip as far as possible, attempting to make a big circle with your knee.","Perform this movement slowly for a number of repetitions, and repeat on the other side."]],["Standing_Hip_Flexors","Standing Hip Flexors","static","b","isolation","",["quadriceps"],[],"stretching",["Stand up straight with the spine vertical, the left foot slightly in front of the right.","Bend both knees and lift the back heel off the floor as you press the right hip forward. You can't get a thorough, deep stretch in this position, however, because it's hard to relax the hip flexor and stand on it at the same time. Switch sides."]],["Standing_Inner-Biceps_Curl","Standing Inner-Biceps Curl","pull","i","isolation","dumbbell",["biceps"],[],"strength",["Stand up with a dumbbell in each hand being held at arms length. The elbows should be close to the torso. Your legs should be at about shoulder's width apart from each other.","Rotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.","While holding the upper arms stationary, curl the weights out while contracting the biceps as you breathe out. Your wrist should turn so that when the weights are fully elevated you have supinated grip (palms facing up).","Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: Keep the forearms aligned with your outer deltoids.","Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate the wrists as you lower the weight in order to switch back to a neutral grip.","Repeat for the recommended amount of repetitions."]],["Standing_Lateral_Stretch","Standing Lateral Stretch","static","b","","",["abdominals"],[],"stretching",["Take a slightly wider than hip distance stance with your knees slightly bent.","Place your right hand on your right hip to support the spine.","Raise your left arm in a vertical line and place your left hand behind your head. Keep it there as you incline your torso to the right.","Keep your weight evenly distributed between both legs (don't lean into your left hip). Switch sides."]],["Standing_Leg_Curl","Standing Leg Curl","pull","b","isolation","machine",["hamstrings"],[],"strength",["Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.","Keeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.","As you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.","Perform the same exercise now for the left leg."]],["Standing_Long_Jump","Standing Long Jump","push","b","compound","body only",["quadriceps"],["calves","glutes","hamstrings"],"plyometrics",["This drill is best done in sand or other soft landing surface. Ensure that you are able to measure distance. Stand in a partial squat stance with feet shoulder width apart.","Utilizing a big arm swing and a countermovement of the legs, jump forward as far as you can.","Attempt to land with your feet out in front you, reaching as far as possible with your legs.","Measure the distance from your landing point to the starting point and track results."]],["Standing_Low-Pulley_Deltoid_Raise","Standing Low-Pulley Deltoid Raise","push","b","isolation","cable",["shoulders"],["forearms"],"strength",["Start by standing to the right side of a low pulley row. Use your left hand to come across the body and grab a single handle attached to the low pulley with a pronated grip (palms facing down). Rest your arm in front of you. Your right hand should grab the machine for better support and balance.","Make sure that your back is erect and your feet are shoulder width apart from each other. This is the starting position.","Begin to use the left hand and come across your body out until it is elevated to shoulder height while exhaling.","Feel the contraction at the top for a second and begin to slowly lower the handle back down to the original starting position while inhaling.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]],["Standing_Low-Pulley_One-Arm_Triceps_Extension","Standing Low-Pulley One-Arm Triceps Extension","push","i","isolation","cable",["triceps"],["chest","shoulders"],"strength",["Grab a single handle with your left arm next to the low pulley machine. Turn away from the machine keeping the handle to the side of your body with your arm fully extended. Now use both hands to elevate the single handle directly above the head with the palm facing forward. Keep your upper arm completely vertical (perpendicular to the floor) and put your right hand on your left elbow to help keep it steady. This is the starting position.","Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the single handle. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]],["Standing_Military_Press","Standing Military Press","push","b","compound","barbell",["shoulders"],["triceps"],"strength",["Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.","Slightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."]],["Standing_Olympic_Plate_Hand_Squeeze","Standing Olympic Plate Hand Squeeze","static","b","isolation","other",["forearms"],["biceps"],"strength",["To begin, stand straight while holding a weight plate by the ridge at arm's length in each hand using a neutral grip (palms facing in). You feet should be shoulder width apart from each other. This will be your starting position.","Lower the plates until the fingers are nearly extended but can still hold weights. Inhale as you lower the plates.","Now raise the plates back to the starting position as you exhale by closing your hands.","Repeat for the recommended amount of repetitions prescribed in your program."]],["Standing_One-Arm_Cable_Curl","Standing One-Arm Cable Curl","pull","i","isolation","cable",["biceps"],[],"strength",["Start out by grabbing single handle next to the low pulley machine. Make sure you are far enough from the machine so that your arm is supporting the weight.","Make sure that your upper arm is stationary, perpendicular to the floor with elbows in and palms facing forward. Your non lifting arm should be grabbing your waist. This will allow you to keep your balance.","Slowly begin to curl the single handle upwards while keeping the upper arm stationary until your forearm touches your bicep while exhaling. Tip: Only the forearm should move.","Hold the contraction position as you squeeze the bicep and then lower the single handle back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions.","Switch arms while performing this exercise."]],["Standing_One-Arm_Dumbbell_Curl_Over_Incline_Bench","Standing One-Arm Dumbbell Curl Over Incline Bench","pull","b","isolation","dumbbell",["biceps"],[],"strength",["Stand on the back side of an incline bench as if you were going to be a spotter for someone. Have a dumbbell in one hand and rest it across the incline bench with a supinated (palms up) grip.","Position your non lifting hand at the corner or side of the incline bench. The chest should be pressed against the top part of the incline and your feet should be pressed against the floor at a wide stance. This is the starting position.","While holding the upper arm stationary, curl the dumbbell upward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a second.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions.","Switch arms while performing this exercise."]],["Standing_One-Arm_Dumbbell_Triceps_Extension","Standing One-Arm Dumbbell Triceps Extension","push","b","isolation","dumbbell",["triceps"],["chest","shoulders"],"strength",["To begin, stand up with a dumbbell held in one hand. Your feet should be about shoulder width apart from each other. Now fully extend the arm with the dumbbell over your head. Tip: The small finger of your hand should be facing the ceiling and the palm of your hand should be facing forward. The dumbbell should be above your head.","This will be your starting position.","Keeping your upper arm close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearm touch your bicep. Tip: The upper arm should remain stationary and only the forearm should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]],["Standing_Overhead_Barbell_Triceps_Extension","Standing Overhead Barbell Triceps Extension","push","b","isolation","barbell",["triceps"],["shoulders"],"strength",["To begin, stand up holding a barbell or e-z bar using a pronated grip (palms facing forward) with your hands closer than shoulder width apart from each other. Your feet should be about shoulder width apart.","Now elevate the barbell above your head until your arms are fully extended. Keep your elbows in. This will be your starting position.","Keeping your upper arms close to your head and elbows in, perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the barbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."]],["Standing_Palm-In_One-Arm_Dumbbell_Press","Standing Palm-In One-Arm Dumbbell Press","push","b","compound","dumbbell",["shoulders"],["triceps"],"strength",["Start by having a dumbbell in one hand with your arm fully extended to the side using a neutral grip. Use your other arm to hold on to an incline bench to keep your balance.","Your feet should be shoulder width apart from each other. Now slowly lift the dumbbell up until you create a 90 degree angle with your arm. Note: Your forearm should be perpendicular to the floor. Continue to maintain a neutral grip throughout the entire exercise.","Slowly lift the dumbbell up until your arm is fully extended. This the starting position.","While inhaling lower the weight down until your arm is at a 90 degree angle again.","Feel the contraction for a second and then lift the weight back up towards the starting position while exhaling. Remember to hold on to the incline bench and keep your feet positioned to keep balance during the exercise.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]],["Standing_Palms-In_Dumbbell_Press","Standing Palms-In Dumbbell Press","push","i","compound","dumbbell",["shoulders"],["triceps"],"strength",["Start by having a dumbbell in each hand with your arm fully extended to the side using a neutral grip. Your feet should be shoulder width apart from each other. Now slowly lift the dumbbells up until you create a 90 degree angle with your arms. Note: Your forearms should be perpendicular to the floor. This the starting position.","Continue to maintain a neutral grip throughout the entire exercise. Slowly lift the dumbbells up until your arms are fully extended.","While inhaling lower the weights down until your arm is at a 90 degree angle again.","Repeat for the recommended amount of repetitions."]],["Standing_Palms-Up_Barbell_Behind_The_Back_Wrist_Curl","Standing Palms-Up Barbell Behind The Back Wrist Curl","pull","b","isolation","barbell",["forearms"],[],"strength",["Start by standing straight and holding a barbell behind your glutes at arm's length while using a pronated grip (palms will be facing back away from the glutes) and having your hands shoulder width apart from each other.","You should be looking straight forward while your feet are shoulder width apart from each other. This is the starting position.","While exhaling, slowly elevate the barbell up by curling your wrist in a semi-circular motion towards the ceiling. Note: Your wrist should be the only body part moving for this exercise.","Hold the contraction for a second and lower the barbell back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions.","When finished, lower the barbell down to the squat rack or the floor by bending the knees. Tip: It is easiest to either pick it up from a squat rack or have a partner hand it to you."]],["Standing_Pelvic_Tilt","Standing Pelvic Tilt","static","b","isolation","",["lower back"],["glutes"],"stretching",["Start off with your feet hip-distance apart.","Bend your knees slightly to keep them soft and springy.","You may want to move your pelvis forward and backward and back few times before holding the tailbone forward in this stretch."]],["Standing_Rope_Crunch","Standing Rope Crunch","pull","b","isolation","cable",["abdominals"],[],"strength",["Attach a rope to a high pulley and select an appropriate weight.","Stand with your back to the cable tower. Take the rope with both hands over your shoulders, holding it to your upper chest. This will be your starting position.","Perform the movement by flexing the spine, crunching the weight down as far as you can.","Hold the peak contraction for a moment before returning to the starting position."]],["Standing_Soleus_And_Achilles_Stretch","Standing Soleus And Achilles Stretch","static","b","isolation","",["calves"],[],"stretching",["Stand with your feet hip-distance apart, one foot slightly in front of the other.","Bend both knees, keeping your back heel on the floor. Switch sides."]],["Standing_Toe_Touches","Standing Toe Touches","static","b","","",["hamstrings"],["calves"],"stretching",["Stand with some space in front and behind you.","Bend at the waist, keeping your legs straight, until you can relax and let your upper body hang down in front of you. Let your arms and hands hang down naturally. Hold for 10 to 20 seconds."]],["Standing_Towel_Triceps_Extension","Standing Towel Triceps Extension","push","b","isolation","body only",["triceps"],[],"strength",["To begin, stand up with both arms fully extended above the head holding one end of a towel with both hands. Your elbows should be in and the arms perpendicular to the floor with the palms facing each other while your feet should be shoulder width apart from each other. This is the starting position.","Now communicate with your partner so that he/she can grip the other side of the towel to apply resistance. Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the towel. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."]],["Standing_Two-Arm_Overhead_Throw","Standing Two-Arm Overhead Throw","pull","b","compound","medicine ball",["shoulders"],["chest","lats"],"plyometrics",["Stand with your feet shoulder width apart holding a medicine ball in both hands. To begin, reach the medicine ball deep behind your head as you bend the knees slightly and lean back.","Violently throw the ball forward, flexing at the hip and using your whole body to complete the movement.","The medicine ball can be thrown to a partner or to a wall, receiving it as it bounces back."]],["Star_Jump","Star Jump","push","b","compound","body only",["quadriceps"],["calves","glutes","hamstrings","shoulders"],"plyometrics",["Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.","To initiate the move, squat down halfway and explode back up as high as possible. Fully extend your entire body, spreading your legs and arms away from the body.","As you land, bring your limbs back in and absorb your impact through the legs."]],["Step-up_with_Knee_Raise","Step-up with Knee Raise","push","b","compound","body only",["glutes"],["hamstrings","quadriceps"],"strength",["Stand facing a box or bench of an appropriate height with your feet together. This will be your starting position.","Begin the movement by stepping up, putting your left foot on the top of the bench. Extend through the hip and knee of your front leg to stand up on the box. As you stand on the box with your left leg, flex your right knee and hip, bringing your knee as high as you can.","Reverse this motion to step down off the box, and then repeat the sequence on the opposite leg."]],["Step_Mill","Step Mill","","i","","machine",["quadriceps"],["calves","glutes","hamstrings"],"cardio",["To begin, step onto the stepmill and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Use caution so that you don't trip as you climb the stairs. It is recommended that you maintain your grip on the handles so that you don't fall.","Stepmills offer convenience, cardiovascular benefits, and usually have less impact than running outside while offering a similar rate of calories burned. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."]],["Stiff-Legged_Barbell_Deadlift","Stiff-Legged Barbell Deadlift","pull","i","compound","barbell",["hamstrings"],["glutes","lower back"],"strength",["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.","Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement.","Repeat for the recommended amount of repetitions."]],["Stiff-Legged_Dumbbell_Deadlift","Stiff-Legged Dumbbell Deadlift","pull","b","compound","dumbbell",["hamstrings"],["glutes","lower back"],"strength",["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."]],["Stiff_Leg_Barbell_Good_Morning","Stiff Leg Barbell Good Morning","push","b","compound","barbell",["lower back"],["glutes","hamstrings"],"strength",["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position.","Keeping your legs stationary, move your torso forward by bending at the hips while inhaling. Lower your torso until it is parallel with the floor.","Begin to raise the bar as you exhale by elevating your torso back to the starting position.","Repeat for the recommended amount of repetitions."]],["Stomach_Vacuum","Stomach Vacuum","static","b","isolation","body only",["abdominals"],[],"stretching",["To begin, stand straight with your feet shoulder width apart from each other. Place your hands on your hips. This is the starting position.","Now slowly inhale as much air as possible and then start to exhale as much as possible while bringing your stomach in as much as possible and hold this position. Try to visualize your navel touching your backbone.","One isometric contraction is around 20 seconds. During the 20 second hold, try to breathe normally. Then inhale and bring your stomach back to the starting position.","Once you have practiced this exercise, try to perform this exercise for longer than 20 seconds. Tip: You can work your way up to 40-60 seconds.","Repeat for the recommended amount of sets."]],["Straight-Arm_Dumbbell_Pullover","Straight-Arm Dumbbell Pullover","pull","i","compound","dumbbell",["chest"],["lats","shoulders","triceps"],"strength",["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.","Grasp the dumbbell with both hands and hold it straight over your chest at arms length. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position.\nCaution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.","While keeping your arms straight, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."]],["Straight-Arm_Pulldown","Straight-Arm Pulldown","pull","b","isolation","cable",["lats"],[],"strength",["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.","Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.","While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.","While keeping the arms straight, go back to the starting position while breathing in.","Repeat for the recommended amount of repetitions."]],["Straight_Bar_Bench_Mid_Rows","Straight Bar Bench Mid Rows","pull","b","compound","barbell",["middle back"],["biceps","lats"],"strength",["Place a loaded barbell on the end of a bench. Standing on the bench behind the bar, take a medium, pronated grip. Stand with your hips back and chest up, maintaining a neutral spine. This will be your starting position.","Row the bar to your torso by retracting the shoulder blades and flexing the elbows. Use a controlled movement with no jerking.","After a brief pause, slowly return the bar to the starting position, ensuring to go all the way down."]],["Straight_Raises_on_Incline_Bench","Straight Raises on Incline Bench","push","b","isolation","barbell",["shoulders"],["traps"],"strength",["Place a bar on the ground behind the head of an incline bench.","Lay on the bench face down. With a pronated grip, pick the barbell up from the floor, keeping your arms straight. Allow the bar to hang straight down. This will be your starting position.","To begin, raise the barbell out in front of your head while keeping your arms extended.","Return to the starting position."]],["Stride_Jump_Crossover","Stride Jump Crossover","push","b","compound","other",["quadriceps"],["abductors","adductors","calves","hamstrings"],"plyometrics",["Stand to the side of a box with your inside foot on top of it, close to the edge.","Begin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. Attempt to drive the opposite knee upward.","Land in the opposite position that you started, on the opposite side of the box. The foot that was initially on the box will now be on the ground, with the opposite foot now on the box.","Repeat the movement, crossing back over to the other side."]],["Sumo_Deadlift","Sumo Deadlift","pull","i","compound","barbell",["hamstrings"],["adductors","forearms","glutes","lower back","middle back","quadriceps","traps"],"powerlifting",["Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."]],["Sumo_Deadlift_with_Bands","Sumo Deadlift with Bands","pull","i","compound","barbell",["hamstrings"],["adductors","forearms","glutes","lower back","middle back","quadriceps","traps"],"powerlifting",["To deadlift with short bands, simply loop them over the bar before you start, and step into them to set up. Ensure that they under the back half of your foot, directly where you are driving into the floor.","Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."]],["Sumo_Deadlift_with_Chains","Sumo Deadlift with Chains","pull","i","compound","barbell",["hamstrings"],["abductors","adductors","forearms","glutes","lower back","middle back","quadriceps","traps"],"powerlifting",["You can attach the chains to the sleeves of the bar, or just drape the middle over the bar so there is a greater weight increase as you lift. Attempt to keep the ends of the chains away from the plates so you don't hit them when you lower the weight.","Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."]],["Superman","Superman","static","b","compound","body only",["lower back"],["glutes","hamstrings"],"stretching",["To begin, lie straight and face down on the floor or exercise mat. Your arms should be fully extended in front of you. This is the starting position.","Simultaneously raise your arms, legs, and chest off of the floor and hold this contraction for 2 seconds. Tip: Squeeze your lower back to get the best results from this exercise. Remember to exhale during this movement. Note: When holding the contracted position, you should look like superman when he is flying.","Slowly begin to lower your arms, legs and chest back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions prescribed in your program."]],["Supine_Chest_Throw","Supine Chest Throw","push","b","compound","medicine ball",["triceps"],["chest","shoulders"],"plyometrics",["This drill is great for chest passes when you lack a partner or a wall of sufficient strength. Lay on the ground on your back with your knees bent.","Begin with the ball on your chest, held with both hands on the bottom.","Explode up, extending through the elbow to throw the ball directly above you as high as possible.","Catch the ball with both hands as it comes down."]],["Supine_One-Arm_Overhead_Throw","Supine One-Arm Overhead Throw","pull","b","compound","medicine ball",["abdominals"],["chest","lats","shoulders"],"plyometrics",["Lay on the ground on your back with your knees bent. Hold the ball with one hand, extending the arm fully behind your head. This will be your starting position.","Initiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.","The ball can be thrown to a partner or bounced off of a wall."]],["Supine_Two-Arm_Overhead_Throw","Supine Two-Arm Overhead Throw","pull","b","compound","medicine ball",["abdominals"],["chest","lats","shoulders"],"plyometrics",["Lay on the ground on your back with your knees bent.","Hold the ball with both hands, extending the arms fully behind your head. This will be your starting position.","Initiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.","The ball can be thrown to a partner or bounced off of a wall."]],["Suspended_Fallout","Suspended Fallout","pull","i","isolation","other",["abdominals"],["chest","lower back","shoulders"],"strength",["Adjust the straps so the handles are at an appropriate height, below waist level.","Begin standing and grasping the handles. Lean into the straps, moving to an incline push-up position. This will be your starting position.","Keeping your arms straight, lean further into the suspension straps, bringing your body closer to the ground, allowing your shoulders to extend, raising your arms up and over your head.","Maintain a neutral spine and keep the rest of your body straight, your shoulders being the only joints allowed to move.","Pause during the peak contraction, and then return to the starting position."]],["Suspended_Push-Up","Suspended Push-Up","push","b","compound","other",["chest"],["shoulders","triceps"],"strength",["Anchor your suspension straps securely to the top of a rack or other object.","Leaning into the straps, take a handle in each hand and move into a push-up plank position. You should be as close to parallel to the ground as you can manage with your arms fully extended, maintaining good posture.","Maintaining a straight, rigid torso, descend slowly by allowing the elbows to flex.","Continue until your elbows break 90 degrees, pausing before you extend to return to the starting position."]],["Suspended_Reverse_Crunch","Suspended Reverse Crunch","pull","b","isolation","other",["abdominals"],[],"strength",["Secure a set of suspension straps with the handles hanging about a foot off of the ground. Move yourself into a pushup plank position facing away from the rack.","Place your feet into the handles. You should maintain a straight posture, not allowing the hips to sag. This will be your starting position.","Begin the movement by flexing the knees and hips, drawing the knees to your torso. As you do so, anteriorly tilt your pelvis, allowing your spine to flex.","At the top of the controlled motion, return to the starting position."]],["Suspended_Row","Suspended Row","pull","b","compound","other",["middle back"],["biceps","lats"],"strength",["Suspend your straps at around chest height. Take a handle in each hand and lean back. Keep your body erect and your head and chest up. Your arms should be fully extended. This will be your starting position.","Begin by flexing the elbow to initiate the movement. Protract your shoulder blades as you do so.","At the completion of the motion pause, and then return to the starting position."]],["Suspended_Split_Squat","Suspended Split Squat","push","i","compound","other",["quadriceps"],["abductors","adductors","calves","glutes","hamstrings"],"strength",["Suspend your straps so the handles are 18-30 inches from the floor.","Facing away from the setup, place your rear foot into the handle behind you. Keep your head looking forward and your chest up, with your knee slightly bent. This will be your starting position.","Descend by flexing the knee and hips, lowering yourself to the ground. Keep your weight on the heel of your foot and maintain your posture throughout the exercise.","At the bottom of the movement, reverse the motion, extending through the hip and knee to return to the starting position."]],["Svend_Press","Svend Press","push","b","compound","other",["chest"],["forearms","shoulders","triceps"],"strength",["Begin in a standing position.","Press two lightweight plates together with your hands. Hold the plates together close to your chest to create an isometric contraction in your chest muscles. Your fingers should be pointed forward. This is your starting position.","Squeeze the plates between your palms and extend your arms directly out in front of you in a controlled motion.","Pause at the top of the motion, and then slowly return to the starting position."]],["T-Bar_Row_with_Handle","T-Bar Row with Handle","pull","b","compound","barbell",["middle back"],["biceps","lats"],"strength",["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.","Assume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.","Pull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."]],["Tate_Press","Tate Press","push","i","isolation","dumbbell",["triceps"],["chest","shoulders"],"strength",["Lie down on a flat bench with a dumbbell in each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them in front of you at shoulder width. Note: when holding the dumbbells in front of you, make sure your arms are wider than shoulder width apart from each other using a pronated (palms forward) grip. Allow your elbows to point out. This is your starting position.","Keeping the upper arms stationary, slowly move the dumbbells in and down in a semi circular motion until they touch the upper chest while inhaling. Keep full control of the dumbbells at all times and do not move the upper arms nor rest the dumbbells on the chest.","As you breathe out, move the dumbbells up using your triceps and the same semi-circular motion but in reverse. Attempt to keep the dumbbells together as they move up. Lock your arms in the contracted position, hold for a second and then start coming down again slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions of your training program."]],["The_Straddle","The Straddle","static","b","","",["hamstrings"],["adductors","calves"],"stretching",["Begin in a seated, upright position. Start by extending your legs in front of you in a V.","With your hands on the floor, lean forward as far as possible. Hold for 10 to 20 seconds."]],["Thigh_Abductor","Thigh Abductor","push","b","isolation","machine",["abductors"],["glutes"],"strength",["To begin, sit down on the abductor machine and select a weight you are comfortable with. When your legs are positioned properly, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them away from each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."]],["Thigh_Adductor","Thigh Adductor","pull","b","isolation","machine",["adductors"],["glutes","hamstrings"],"strength",["To begin, sit down on the adductor machine and select a weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them towards each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary and avoid fast jerking motions in order to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."]],["Tire_Flip","Tire Flip","pull","i","compound","other",["quadriceps"],["calves","chest","forearms","glutes","hamstrings","lower back","shoulders","traps","triceps"],"strongman",["Begin by gripping the bottom of the tire on the tread, and position your feet back a bit. Your chest should be driving into the tire.","To lift the tire, extend through the hips, knees, and ankles, driving into the tire and up.","As the tire reaches a 45 degree angle, step forward and drive a knee into the tire. As you do so adjust your grip to the upper portion of the tire and push it forward as hard as possible to complete the turn. Repeat as necessary."]],["Toe_Touchers","Toe Touchers","pull","b","isolation","body only",["abdominals"],[],"stretching",["To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.","Your legs should be touching each other. Slowly elevate your legs up in the air until they are almost perpendicular to the floor with a slight bend at the knees. Your feet should be parallel to the floor.","Move your arms so that they are fully extended at a 45 degree angle from the floor. This is the starting position.","While keeping your lower back pressed against the floor, slowly lift your torso and use your hands to try and touch your toes. Remember to exhale while perform this part of the exercise.","Slowly begin to lower your torso and arms back down to the starting position while inhaling. Remember to keep your arms straight out pointing towards your toes.","Repeat for the recommended amount of repetitions."]],["Torso_Rotation","Torso Rotation","pull","b","","exercise ball",["abdominals"],[],"stretching",["Stand upright holding an exercise ball with both hands. Extend your arms so the ball is straight out in front of you. This will be your starting position.","Rotate your torso to one side, keeping your eyes on the ball as you move. Now, rotate back to the opposite direction. Repeat for 10-20 repetitions."]],["Trail_Running_Walking","Trail Running/Walking","","b","","",["quadriceps"],["calves","glutes","hamstrings"],"cardio",["Running or hiking on trails will get the blood pumping and heart beating almost immediately. Make sure you have good shoes. While you use the muscles in your calves and buttocks to pull yourself up a hill, the knees, joints and ankles absorb the bulk of the pounding coming back down. Take smaller steps as you walk downhill, keep your knees bent to reduce the impact and slow down to avoid falling.","A 150 lb person can burn over 200 calories for 30 minutes walking uphill, compared to 175 on a flat surface. If running the trail, a 150 lb person can burn well over 500 calories in 30 minutes."]],["Trap_Bar_Deadlift","Trap Bar Deadlift","pull","b","compound","other",["quadriceps"],["glutes","hamstrings"],"strength",["For this exercise load a trap bar, also known as a hex bar, to an appropriate weight resting on the ground. Stand in the center of the apparatus and grasp both handles.","Lower your hips, look forward with your head and keep your chest up.","Begin the movement by driving through the heels and extend your hips and knees. Avoid rounding your back at all times.","At the completion of the movement, lower the weight back to the ground under control."]],["Tricep_Dumbbell_Kickback","Tricep Dumbbell Kickback","push","b","isolation","dumbbell",["triceps"],[],"strength",["Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.","Now, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.","After a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position.","Repeat the movement for the prescribed amount of repetitions."]],["Tricep_Side_Stretch","Tricep Side Stretch","static","b","","",["triceps"],["shoulders"],"stretching",["Bring right arm across your body and over your left shoulder, holding your elbow with your left hand, until you feel a stretch in your tricep. Then repeat for your other arm."]],["Triceps_Overhead_Extension_with_Rope","Triceps Overhead Extension with Rope","push","b","isolation","cable",["triceps"],[],"strength",["Attach a rope to a low pulley. After selecting an appropriate weight, grasp the rope with both hands and face away from the cable.","Position your hands behind your head with your elbows point straight up. Your elbows should start out flexed, and you can stagger your stance and lean gently away from the machine to create greater stability. This will be your starting position.","To perform the movement, extend through the elbow while keeping the upper arm in position, raising your hands above your head.","Squeeze your triceps at the top of the movement, and slowly lower the weight back to the start position."]],["Triceps_Pushdown","Triceps Pushdown","push","b","isolation","cable",["triceps"],[],"strength",["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]],["Triceps_Pushdown_-_Rope_Attachment","Triceps Pushdown - Rope Attachment","push","b","isolation","cable",["triceps"],[],"strength",["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]],["Triceps_Pushdown_-_V-Bar_Attachment","Triceps Pushdown - V-Bar Attachment","push","b","isolation","cable",["triceps"],[],"strength",["Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. The thumbs should be higher than the small finger. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the V-Bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]],["Triceps_Stretch","Triceps Stretch","static","b","isolation","",["triceps"],["lats"],"stretching",["Reach your hand behind your head, grasp your elbow and gently pull. Hold for 10 to 20 seconds, then switch sides."]],["Tuck_Crunch","Tuck Crunch","pull","b","isolation","body only",["abdominals"],[],"strength",["To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.","Your legs should be crossed by wrapping one ankle around the other. Slowly elevate your legs up in the air until your thighs are perpendicular to the floor with a slight bend at the knees. Note: Your knees and toes should be parallel to the floor as opposed to the thighs.","Move your arms from the floor and cross them so they are resting on your chest. This is the starting position.","While keeping your lower back pressed against the floor, slowly lift your torso. Remember to exhale while perform this part of the exercise.","Slowly begin to lower your torso back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]],["Two-Arm_Dumbbell_Preacher_Curl","Two-Arm Dumbbell Preacher Curl","pull","b","isolation","dumbbell",["biceps"],[],"strength",["Grab a dumbbell with each arm and place the upper arms on top of the preacher bench or the incline bench. The dumbbell should be held at shoulder length. This will be your starting position.","As you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weights up until your biceps is fully contracted and the dumbbells are at shoulder height.","Squeeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions."]],["Two-Arm_Kettlebell_Clean","Two-Arm Kettlebell Clean","pull","i","compound","kettlebells",["shoulders"],["calves","glutes","hamstrings","lower back","traps"],"strength",["Place two kettlebells between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean the kettlebells to your shoulders by extending through the legs and hips as you raise the kettlebells towards your shoulders. Rotate your wrists as you do so.","Lower the kettlebells back to the starting position and repeat."]],["Two-Arm_Kettlebell_Jerk","Two-Arm Kettlebell Jerk","push","i","compound","kettlebells",["shoulders"],["calves","quadriceps","triceps"],"strength",["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you swing the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward. Squat down a few inches and reverse the motion rapidly driving both kettlebells overhead. Immediately after the initial push, squat down again and get under the kettlebells. Once the kettlebells are locked out, stand upright to complete the exercise."]],["Two-Arm_Kettlebell_Military_Press","Two-Arm Kettlebell Military Press","push","i","compound","kettlebells",["shoulders"],["triceps"],"strength",["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you swing the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward.","Press the kettlebells up and out. As the kettlebells pass your head, lean into the weights so that the kettlebells are racked behind your head. Make sure to contract your lats, butt, and stomach for added stability."]],["Two-Arm_Kettlebell_Row","Two-Arm Kettlebell Row","pull","i","compound","kettlebells",["middle back"],["biceps","lats"],"strength",["Place two kettlebells in front of your feet. Bend your knees slightly and then push your butt out as much as possible as you bend over to get in the starting position.","Grab both kettlebells and pull them to your stomach, retracting your shoulder blades and flexing the elbows. Keep your back straight. Lower and repeat."]],["Underhand_Cable_Pulldowns","Underhand Cable Pulldowns","pull","b","compound","cable",["lats"],["biceps","middle back","shoulders"],"strength",["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."]],["Upper_Back-Leg_Grab","Upper Back-Leg Grab","static","b","","",["hamstrings"],["lower back","middle back"],"stretching",["While seated, bend forward to hug your thighs from underneath with both arms.","Keep your knees together and your legs extended out as you bring your chest down to your knees. You can also stretch your middle back by pulling your back away from your knees as your hugging them."]],["Upper_Back_Stretch","Upper Back Stretch","static","b","","",["middle back"],["middle back"],"stretching",["Clasp fingers together with your thumbs pointing down, round your shoulders as you reach your hands forward."]],["Upright_Barbell_Row","Upright Barbell Row","pull","b","compound","barbell",["shoulders"],["traps"],"strength",["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.","Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]],["Upright_Cable_Row","Upright Cable Row","pull","i","compound","cable",["traps"],["shoulders"],"strength",["Grasp a straight bar cable attachment that is attached to a low pulley with a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The bar should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the cable bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]],["Upright_Row_-_With_Bands","Upright Row - With Bands","pull","b","compound","bands",["traps"],["shoulders"],"strength",["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the handles as you exhale. The handles should be close to the body as you move them up. Continue to lift the handles until they nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the handles, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]],["Upward_Stretch","Upward Stretch","static","b","","",["shoulders"],["chest","lats"],"stretching",["Extend both hands straight above your head, palms touching.","Slowly push your hands up and back, keeping your back straight."]],["V-Bar_Pulldown","V-Bar Pulldown","pull","i","compound","cable",["lats"],["biceps","middle back","shoulders"],"strength",["Sit down on a pull-down machine with a V-Bar attached to the top pulley.","Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance a
