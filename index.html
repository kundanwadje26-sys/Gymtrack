ttached to the bar.","Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.","Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement.","After a second hold on the contracted position, slowly bring the bar back to the starting position as you breathe in.","Repeat for the prescribed number of repetitions."]],["V-Bar_Pullup","V-Bar Pullup","pull","b","compound","body only",["lats"],["biceps","middle back","shoulders"],"strength",["Start by placing the middle of the V-bar in the middle of the pull-up bar (assuming that the pull-up station you are using does not have neutral grip handles). The V-Bar handles will be facing down so that you can hang from the pull-up bar through the use of the handles.","Once you securely place the V-bar, take a hold of the bar from each side and hang from it. Stick your chest out and lean yourself back slightly in order to better engage the lats. This will be your starting position.","Using your lats, pull your torso up while leaning your head back slightly so that you do not hit yourself with the chin-up bar. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion.","After a second hold on the contracted position, slowly lower your body back to the starting position as you breathe in.","Repeat for the prescribed number of repetitions."]],["Vertical_Swing","Vertical Swing","pull","b","compound","dumbbell",["hamstrings"],["glutes","quadriceps","shoulders"],"plyometrics",["Allow the dumbbell to hang at arms length between your legs, holding it with both hands. Keep your back straight and your head up.","Swing the dumbbell between your legs, flexing at the hips and bending the knees slightly.","Powerfully reverse the motion by extending at the hips, knees, and ankles to propel yourself upward, swinging the dumbell over your head.","As you land, absorb the impact through your legs and draw the dumbbell to your torso before the next repetition."]],["Walking_Treadmill","Walking, Treadmill","","b","","machine",["quadriceps"],["calves","glutes","hamstrings"],"cardio",["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than walking outside. When walking, you should move at a moderate to fast pace, not a leisurely one. Being an activity of lower intensity, walking doesn't burn as many calories as some other activities, but still provides great benefit. A 150 lb person will burn about 175 calories walking 4 miles per hour for 30 minutes, compared to 450 calories running twice as fast. Maintain proper posture as you walk, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."]],["Weighted_Ball_Hyperextension","Weighted Ball Hyperextension","pull","i","compound","exercise ball",["lower back"],["glutes","hamstrings","middle back"],"strength",["To begin, lie down on an exercise ball with your torso pressing against the ball and parallel to the floor. The ball of your feet should be pressed against the floor to help keep you balanced. Place a weighted plate under your chin or behind your neck. This is the starting position.","Slowly raise your torso up by bending at the waist and lower back. Remember to exhale during this movement.","Hold the contraction on your lower back for a second and lower your torso back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions prescribed in your program."]],["Weighted_Ball_Side_Bend","Weighted Ball Side Bend","pull","i","isolation","exercise ball",["abdominals"],[],"strength",["To begin, lie down on an exercise ball with your left side of the torso (waist, hips and shoulder) pressed against the ball.","Your feet should be on the floor while your legs are crossed and hanging from the ball. Hold a weighted plate with your right hand directly to the right side of your head. Tip: Make sure the smooth side of the plate is resting against your head.","Place your left arm across your torso so that your palm is on your obliques. There should be a right angle between your left forearm and upper arm. This is the starting position.","Raise the side of your torso up by laterally flexing at the waist while exhaling.","Hold the contraction for a second and slowly lower yourself back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions.","Switch sides and repeat the exercise."]],["Weighted_Bench_Dip","Weighted Bench Dip","push","i","compound","other",["triceps"],["chest","shoulders"],"strength",["For this exercise you will need to place a bench behind your back and another one in front of you. With the benches perpendicular to your body, hold on to one bench on its edge with the hands close to your body, separated at shoulder width. Your arms should be fully extended.","The legs will be extended forward on top of the other bench. Your legs should be parallel to the floor while your torso is to be perpendicular to the floor. Have your partner place the dumbbell on your lap. Note: This exercise is best performed with a partner as placing the weight on your lap can be challenging and cause injury without assistance. This will be your starting position.","Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.","Using your triceps to bring your torso up again, lift yourself back to the starting position while exhaling.","Repeat for the recommended amount of repetitions."]],["Weighted_Crunches","Weighted Crunches","pull","b","isolation","medicine ball",["abdominals"],[],"strength",["Lie flat on your back with your feet flat on the ground or resting on a bench with your knees bent at a 90 degree angle.","Hold a weight to your chest, or you may hold it extended above your torso. This will be your starting position.","Now, exhale and slowly begin to roll your shoulders off the floor. Your shoulders should come up off the floor about 4 inches while your lower back remains on the floor.","At the top of the movement, flex your abdominals and hold for a brief pause.","Then inhale and slowly lower yourself back down to the starting position."]],["Weighted_Jump_Squat","Weighted Jump Squat","push","i","compound","barbell",["quadriceps"],["calves","glutes","hamstrings","lower back"],"strength",["Position a lightly loaded barbell across the back of your shoulders. You could also use a weighted vest, sandbag, or other type of resistance for this exercise.","The weight should be light enough that it doesn't slow you down significantly. Your feet should be just outside of shoulder width with your head and chest up. This will be your starting position.","Using a countermovement, squat partially down and immediately reverse your direction to explode off of the ground, extending through your hips, knees, and ankles. Maintain good posture throughout the jump.","As you return to the ground, absorb the impact through your legs."]],["Weighted_Pull_Ups","Weighted Pull Ups","pull","i","compound","other",["lats"],["biceps","middle back"],"strength",["Attach a weight to a dip belt and secure it around your waist. Grab the pull-up bar with the palms of your hands facing forward. For a medium grip, your hands should be spaced at shoulder width. Both arms should be extended in front of you holding the bar at the chosen grip.","You'll want to bring your torso back about 30 degrees while creating a curvature in your lower back and sticking your chest out. This will be your starting position.","Now, exhale and pull your torso up until your head is above your hands. Concentrate on squeezing yourshoulder blades back and down as you reach the top contracted position.","After a brief moment at the top contracted position, inhale and slowly lower your torso back to the starting position with your arms extended and your lats fully stretched."]],["Weighted_Sissy_Squat","Weighted Sissy Squat","push","e","compound","barbell",["quadriceps"],["calves","glutes","hamstrings"],"strength",["Standing upright, with feet at shoulder width and toes raised, use one hand to hold onto the beams of a squat rack and the opposite arm to hold a plate on top of your chest. This is your starting position.","As you use one arm to hold yourself, bend at the knees and slowly lower your torso toward the ground by bringing your pelvis and knees forward. Inhale as you go down and stop when your upper and lower legs almost create a 90-degree angle. Hold the stretch position for a second.","After your one second hold, use your thigh muscles to bring your torso back up to the starting position. Exhale as you move up.","Repeat for the recommended amount of times."]],["Weighted_Sit-Ups_-_With_Bands","Weighted Sit-Ups - With Bands","pull","i","isolation","other",["abdominals"],[],"strength",["Start out by strapping the bands around the base of the decline bench. Place the handles towards the inside of the decline bench so that when lying down, you can reach for both of them.","Position your legs through the decline machine until they are secured. Now reach for the exercise bands with both hands. Use a pronated (palms forward) grip to grasp the handles. Position them near your collar bone and rotate your wrist to a neutral grip (palms facing the torso). Note: Your arms should remain stationary throughout the exercise. This is the starting position.","Move your torso upward until your upper body is perpendicular to the floor while exhaling. Hold the contraction for a second and lower your upper body back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]],["Weighted_Squat","Weighted Squat","push","i","compound","other",["quadriceps"],["calves","glutes","hamstrings"],"strength",["Start by positioning two flat benches shoulder width apart from each other. Stand on top of them and wrap the weighted belt around your waist with the amount of weight you feel comfortable with. Make sure your toes are facing out.","Once you are standing straight up with the weight hanging in between your legs, position your arms so that they are fully extended to the side of your body. This is the starting position.","Begin by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that are perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to move the body back up by pushing the floor of the flat bench with the ball of your foot mainly as you straighten the legs again and go back to the starting position. Exhale as you perform this portion of the exercise.","Repeat for the recommended amount of repetitions."]],["Wide-Grip_Barbell_Bench_Press","Wide-Grip Barbell Bench Press","push","i","compound","barbell",["chest"],["shoulders","triceps"],"strength",["Lie back on a flat bench with feet firm on the floor. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions."]],["Wide-Grip_Decline_Barbell_Bench_Press","Wide-Grip Decline Barbell Bench Press","push","i","compound","barbell",["chest"],["shoulders","triceps"],"strength",["Lie back on a decline bench with the feet securely locked at the front of the bench. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions."]],["Wide-Grip_Decline_Barbell_Pullover","Wide-Grip Decline Barbell Pullover","pull","i","compound","barbell",["chest"],["shoulders","triceps"],"strength",["Lie down on a decline bench with both legs securely locked in position. Reach for the barbell behind the head using a pronated grip (palms facing out). Make sure to grab the barbell wider than shoulder width apart for this exercise. Slowly lift the barbell up from the floor by using your arms.","When positioned properly, your arms should be fully extended and perpendicular to the floor. This is the starting position.","Begin by moving the barbell back down in a semicircular motion as if you were going to place it on the floor, but instead, stop when the arms are parallel to the floor. Tip: Keep the arms fully extended at all times. The movement should only happen at the shoulder joint. Inhale as you perform this portion of the movement.","Now bring the barbell up while exhaling until you are back at the starting position. Remember to keep full control of the barbell at all times.","Repeat the movement for the prescribed amount of repetitions of your training program.","When finished with your set, slowly lower the barbell back down until it is level with your head and release it."]],["Wide-Grip_Lat_Pulldown","Wide-Grip Lat Pulldown","pull","b","compound","cable",["lats"],["biceps","middle back","shoulders"],"strength",["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."]],["Wide-Grip_Pulldown_Behind_The_Neck","Wide-Grip Pulldown Behind The Neck","pull","i","compound","cable",["lats"],["biceps","middle back","shoulders"],"strength",["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso and head forward. Think of an imaginary line from the center of the bar down to the back of your neck. This is your starting position.","As you breathe out, bring the bar down until it touches the back of your neck by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second on the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."]],["Wide-Grip_Rear_Pull-Up","Wide-Grip Rear Pull-Up","pull","i","compound","body only",["lats"],["biceps","middle back","shoulders"],"strength",["Grab the pull-up bar with the palms facing forward using a wide grip.","As you have both arms extended in front of you holding the bar, bring your torso forward and head so that there is an imaginary line from the pull-up bar to the back of your neck. This is your starting position.","Pull your torso up until the bar is near the back of your neck. To do this, draw the shoulders and upper arms down and back while slightly leaning your head forward. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."]],["Wide-Grip_Standing_Barbell_Curl","Wide-Grip Standing Barbell Curl","pull","b","isolation","barbell",["biceps"],[],"strength",["Stand up with your torso upright while holding a barbell at the wide outer handle. The palm of your hands should be facing forward. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]],["Wide_Stance_Barbell_Squat","Wide Stance Barbell Squat","push","i","compound","barbell",["quadriceps"],["calves","glutes","hamstrings","lower back"],"strength",["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a wider-than-shoulder-width stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance, and also maintain a straight back. This will be your starting position.","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]],["Wide_Stance_Stiff_Legs","Wide Stance Stiff Legs","pull","i","compound","barbell",["hamstrings"],["adductors","glutes","lower back"],"olympic weightlifting",["Begin with a barbell loaded on the floor. Adopt a wide stance, and then bend at the hips to grab the bar. Your hips should be as far back as possible, and your legs nearly straight. Keep your back straight, and your head and chest up. This will be your starting position.","Begin the movement be engaging the hips, driving them forward as you allow the arms to hang straight. Continue until you are standing straight up, and then slowly return the weight to the starting position. For successive reps, the weight need not touch the floor."]],["Wind_Sprints","Wind Sprints","pull","b","compound","body only",["abdominals"],[],"strength",["Hang from a pull-up bar using a pronated grip. Your arms and legs should be extended. This will be your starting position.","Begin by quickly raising one knee as high as you can. Do not swing your body or your legs. 3","Immediately reverse the motion, returning that leg to the starting position. Simultaneously raise the opposite knee as high as possible.","Continue alternating between legs until the set is complete."]],["Windmills","Windmills","pull","i","","",["abductors"],["glutes","hamstrings","lower back"],"stretching",["Lie on your back with your arms extended out to the sides and your legs straight. This will be your starting position.","Lift one leg and quickly cross it over your body, attempting to touch the ground near the opposite hand.","Return to the starting position, and repeat with the opposite leg. Continue to alternate for 10-20 repetitions."]],["Worlds_Greatest_Stretch","World's Greatest Stretch","static","i","","",["hamstrings"],["calves","glutes","quadriceps"],"stretching",["This is a three-part stretch. Begin by lunging forward, with your front foot flat on the ground and on the toes of your back foot. With your knees bent, squat down until your knee is almost touching the ground. Keep your torso erect, and hold this position for 10-20 seconds.","Now, place the arm on the same side as your front leg on the ground, with the elbow next to the foot. Your other hand should be placed on the ground, parallel to your lead leg, to help support you during this portion of the stretch.","After 10-20 seconds, place your hands on either side of your front foot. Raise the toes of the front foot off of the ground, and straighten your leg. You may need to reposition your rear leg to do so. Hold for 10-20 seconds, and then repeat the entire sequence for the other side."]],["Wrist_Circles","Wrist Circles","pull","b","isolation","body only",["forearms"],[],"stretching",["Start by standing straight with your feet being shoulder width apart from each other. Elevate your arms to the side of you until they are fully extended and parallel to the floor at a height that is evenly aligned with your shoulders. Tip: Your torso and arms should form the letter \"T: Your palms should be facing down. This is the starting position.","Keeping your entire body stationary except for the wrists, begin to rotate both wrists forward in a circular motion. Tip: Pretend that you are trying to draw circles by using your hands as the brush. Breathe normally as you perform this exercise.","Repeat for the recommended amount of repetitions."]],["Wrist_Roller","Wrist Roller","pull","b","isolation","other",["forearms"],["shoulders"],"strength",["To begin, stand straight up grabbing a wrist roller using a pronated grip (palms facing down). Your feet should be shoulder width apart.","Slowly lift both arms until they are fully extended and parallel to the floor in front of you. Note: Make sure the rope is not wrapped around the roller. Your entire body should be stationary except for the forearms. This is the starting position.","Rotate one wrist at a time in an upward motion to bring the weight up to the bar by rolling the rope around the roller.","Once the weight has reached the bar, slowly begin to lower the weight back down by rotating the wrist in a downward motion until the weight reaches the starting position.","Repeat for the prescribed amount of repetitions in your program."]],["Wrist_Rotations_with_Straight_Bar","Wrist Rotations with Straight Bar","pull","b","isolation","barbell",["forearms"],[],"strength",["Hold a barbell with both hands and your palms facing down; hands spaced about shoulder width. This will be your starting position.","Alternating between each of your hands, perform the movement by extending the wrist as though you were rolling up a newspaper. Continue alternating back and forth until failure.","Reverse the motion by flexing the wrist, rolling the opposite direction. Continue the alternating motion until failure."]],["Yoke_Walk","Yoke Walk","","i","compound","other",["quadriceps"],["abdominals","abductors","adductors","calves","glutes","hamstrings","lower back"],"strongman",["The yoke is usually done with a yoke apparatus, but is sometimes seen with refrigerators or other heavy objects.","Begin by racking the apparatus across the back of the shoulders. With your head looking forward and back arched, lift the yoke by driving through the heels.","Begin walking as quickly as possible using short, quick steps. You may hold the side posts of the yoke to help steady it and hold it in position. Continue for the given distance as fast as possible, usually 75-100 feet."]],["Zercher_Squats","Zercher Squats","push","e","compound","barbell",["quadriceps"],["calves","glutes","hamstrings"],"strength",["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. The correct height should be anywhere above the waist but below the chest. Once the correct height is chosen and the bar is loaded, lock your hands together and place the bar on top of your arms in between the forearm and upper arm.","Lift the bar up so that it is resting on top of your forearms. If you are holding the bar properly, it should look as if you have your arms crossed but with a bar running across them.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the ball of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]],["Zottman_Curl","Zottman Curl","pull","i","isolation","dumbbell",["biceps"],["forearms"],"strength",["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","Make sure the palms of the hands are facing each other. This will be your starting position.","While holding the upper arm stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Your wrist should rotate so that you have a supinated (palms up) grip. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a second as you squeeze the biceps.","Now during the contracted position, rotate your wrist until you now have a pronated (palms facing down) grip with the thumb at a higher position than the pinky.","Slowly begin to bring the dumbbells back down using the pronated grip.","As the dumbbells close your thighs, start rotating the wrist so that you go back to a neutral (palms facing your body) grip.","Repeat for the recommended amount of repetitions."]],["Zottman_Preacher_Curl","Zottman Preacher Curl","pull","i","isolation","dumbbell",["biceps"],["forearms"],"strength",["Grab a dumbbell in each hand and place your upper arms on top of the preacher bench or the incline bench. The dumbbells should be held at shoulder height and the elbows should be flexed. Hold the dumbbells with the palms of your hands facing down. This will be your starting position.","As you breathe in, slowly lower the dumbbells keeping the palms down until your upper arm is extended and your biceps are fully stretched.","Now rotate your wrists once you are at the bottom of the movement so that the palms of the hands are facing up.","As you exhale, use your biceps to curl the weights up until they are fully contracted and the dumbbells are at shoulder height. Again, remember that to ensure full contraction you need to bring that small finger higher than the thumb.","Squeeze the biceps hard for a second at the contracted position and rotate your wrists so that the palms are facing down again.","Repeat for the recommended amount of repetitions."]]];

const KEY='kundan-gym-tracker-v3',OLDKEY='kundan-gym-tracker-v2';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
function parseDose(dose,count,timer,hold){
  if(hold)return {sets:1,reps:'',hold};
  if(timer)return {sets:count,time:timer};
  const m=dose.match(/×\s*(\d+)/);let reps=m?m[1]:'10';
  if(/alternating/.test(dose))reps+=' alt';else if(/each side/.test(dose))reps+='/side';else if(/hold at top/.test(dose))reps+=' + hold';
  return {sets:count,reps};
}
function trainerPlan(){
  return {id:'trainer',name:'Trainer plan',source:'trainer',created:Date.now(),
    note:'Your 6-day beginner plan from your trainer. 30–45 s rest between sets, program change after 8 active weeks.',
    days:DAYS.map(d=>({id:'d'+d.id,name:'Day '+d.id+', '+d.title,items:d.items.map(([ex,dose,count,timer,hold])=>Object.assign({ex,rest:(ex.startsWith('stretch')||timer)?0:40},parseDose(dose,count,timer,hold)))}))};
}
let S={v:3,profile:{name:'Kundan',goalWeight:'',bar:20,plates:[25,20,15,10,5,2.5,1.25]},plans:[],activePlan:'trainer',history:[],bodyweight:[],
  customEx:{},media:{},settings:{rest:30,autoRest:true,wake:false},dismissed:{},active:null};
(function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){S=Object.assign(S,JSON.parse(raw));}
    else{
      const old=localStorage.getItem(OLDKEY);
      if(old){const o=JSON.parse(old);
        S.settings.rest=o.rest||30;S.settings.autoRest=o.autoRest!==false;S.settings.wake=!!o.wake;
        S.history=(o.history||[]).map(h=>({id:h.id,planId:'trainer',dayId:'d'+h.day,dayName:'Day '+h.day+', '+h.title,start:h.start,end:h.end,
          warmEnd:h.warmEnd,warmSkipped:h.warmSkipped,warmDone:h.warmDone,warmTotal:h.warmTotal,
          items:h.items.map(x=>{const r=+(String(x.dose).match(/×\s*(\d+)/)||[0,0])[1]||0;return {ex:x.id,sets:Array.from({length:x.sets},()=>({w:+x.kg||0,r,done:true})),target:{sets:x.total,reps:String(r||'')},done:x.done,doneAt:x.doneAt,dur:x.dur};})}));
      }
    }
  }catch(e){}
  if(!S.plans.length)S.plans.push(trainerPlan());
  if(!S.plans.find(p=>p.id===S.activePlan))S.activePlan=S.plans[0].id;
})();

/* =========================================================
   TRAINING MATH
   ========================================================= */
const e1rm=(w,r)=>w>0&&r>0?w*(1+Math.min(r,15)/30):0;
function repRange(reps){const s=String(reps||'');const m=s.match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return [+m[1],+m[2]];const n=parseInt(s);return n?[n,n]:[0,0];}
function doseText(it){
  if(it.hold)return '1 round, hold '+it.hold+' s each';
  if(it.time)return (it.sets>1?it.sets+' × ':'')+(it.time>=60?Math.round(it.time/60)+' min':it.time+' s');
  return it.sets+' × '+(it.reps||'');
}
function exLogs(exId,beforeTs){ // sessions containing this exercise, oldest first
  const out=[];S.history.forEach(h=>{if(beforeTs&&h.start>=beforeTs)return;h.items.forEach(it=>{if(it.ex===exId){const sets=(it.sets||[]).filter(s=>s.done);if(sets.length)out.push({t:h.start,sets,target:it.target,hid:h.id});}});});

}

/* progression: double progression through the rep range */
function nextTarget(exId,item){
  const ex=exById(exId),L=exLogs(exId);if(!L.length)return null;

  const topW=Math.max(...last.sets.map(s=>s.w||0));
  const working=last.sets.filter(s=>(s.w||0)===topW);
  if(!hi)return {w:topW,why:''};
  const allHit=working.length>=Math.min(item.sets||1,last.sets.length)&&working.every(s=>s.r>=hi)&&last.sets.length>=(item.sets||1);
  if(topW>0&&allHit){const inc=incFor(ex);return {w:+(topW+inc).toFixed(2),up:inc,why:`You hit ${hi} reps on every set at ${topW} kg last time`};}
  if(topW===0&&allHit&&ex.bw)return {w:0,why:'You hit every rep. Try 2 more reps per set, or add weight.',repsUp:true};

}

/* muscle load from history */
function muscleStats(){

  Object.keys(MUSCLES).forEach(m=>{vol[m]=0;fat[m]=0;last[m]=null;});
  S.history.forEach(h=>h.items.forEach(it=>{const ex=exById(it.ex);if(ex.cat==='warmup')return;const n=(it.sets||[]).filter(s=>s.done).length;if(!n)return;

    ex.p.forEach(m=>add(m,1));(ex.s||[]).forEach(m=>add(m,0.5));}));

function rng(seed){let s=seed>>>0||1;return ()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return ((s>>>0)%10000)/10000;};}
function scoreEx(ex){

function candidates(slot,prefs,used){

    if(used.has(ex.id))return false;
    if(!['strength','powerlifting'].includes(ex.cat)&&!(ex.curated&&ex.cat==='strength'))return false;
    if(ex.cat==='powerlifting'&&prefs.level==='b')return false;
    if(!ex.p.some(m=>sp.m.includes(m)))return false;
    if(sp.m.length===1&&ex.p[0]!==sp.m[0])return false;
    if(sp.mech&&ex.mech&&ex.mech!==sp.mech)return false;
    if(sp.name&&!sp.name.test(ex.n))return false;
    if(sp.ex&&sp.ex.test(ex.n))return false;
    if(allowed&&!allowed.includes(ex.equip))return false;
    if(prefs.equipment==='gym'&&(['kettlebells','medicine ball','foam roll','bands'].includes(ex.equip)||/band|chain|suspend/i.test(ex.n)))return false;

    for(const k of prefs.avoid||[])if(INJURY[k]&&INJURY[k].test(ex.n))return false;

function generatePlan(prefs){

  const split=SPLITS[key];const G=GOALS[prefs.goal];
  const perDay={30:4,45:5,60:6,75:8}[prefs.minutes]||6;
  const FOCUS={chest:[['chest','incline','chestiso'],/push|upper|full/],back:[['row','vpull'],/pull|upper|full/],shoulders:[['lateral','reardelt','vpush'],/push|upper|full/],
    arms:[['biceps','triceps'],/upper|full/],biceps:[['biceps'],/pull/],triceps:[['triceps'],/push/],legs:[['squat','legpress','lunge','legext'],/lower|legs|full/],glutes:[['glutes','hinge'],/lower|legs|full/],core:[['core'],/./]};

    chestiso:['chest','incline'],incline:['chest','chestiso'],chest:['incline','chestiso'],traps:['reardelt','lateral'],lowback:['core','glutes'],reardelt:['lateral','row'],lateral:['vpush','reardelt'],vpush:['lateral'],glutes:['hinge','lunge'],hinge:['glutes','legcurl'],calves:['core'],biceps:['row'],triceps:['chest']};
  const days=split.days.map((tk,di)=>{
    const T=DAY_TEMPLATES[tk];let slots=T.slots.slice(0,perDay);
    let fi=0;(prefs.focus||[]).forEach(f=>{

      const [cand,dayRe]=FOCUS[f]||[[],/^$/];if(!keys&&!dayRe.test(tk))return;if(keys&&/lower|legs/.test(tk))return;
      const fit=(keys||cand).find(s=>!slots.includes(s)||(keys||cand).length===1);
      if(fit&&slots.length>3){slots.splice(slots.length-1-(fi%2),1);slots.push(fit);fi++;}});
    const used=new Set(),items=[{ex:'cardio',sets:1,time:300,rest:0}];
    slots.forEach(sl0=>{
      let sl=sl0,c=candidates(sl,prefs,used);

      if(!c.length)return;
      const top=c.slice(0,Math.min(c.length,sl==='core'?6:4));const pick=top[Math.floor(Math.pow(r(),2)*top.length)];used.add(pick.id);

function slotFits(s,tk){

function weekKey(ts){const x=new Date(ts);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime();}
function activeWeeks(planId){return new Set(S.history.filter(h=>!planId||h.planId===planId).map(h=>weekKey(h.start))).size;}
function suggestions(){
  const out=[],P=activePlan(),now=Date.now(),day=864e5;
  const add=(key,o)=>{if(S.dismissed[key]&&now-S.dismissed[key]<7*day)return;out.push(Object.assign({key},o));};
  const planIds=new Set(P.days.flatMap(d=>d.items.map(i=>i.ex)));
  // progression
  const ready=[];planIds.forEach(id=>{const item=P.days.flatMap(d=>d.items).find(i=>i.ex===id);if(!item||item.time||item.hold)return;const t=nextTarget(id,item);if(t&&t.up)ready.push([id,t]);});
  if(ready.length)add('prog-'+ready.map(r=>r[0]).join(),{kind:'up',title:ready.length===1?`Go heavier on ${exById(ready[0][0]).n}`:`${ready.length} exercises are ready for more weight`,
    body:ready.slice(0,3).map(([id,t])=>`${exById(id).n}: ${t.w} kg`).join(', ')+'. You hit the top of the rep range on every set, so next time the weight is pre-filled higher.',action:null});
  // plan age
  const w=activeWeeks(P.id);
  if(w>=8)add('age-'+P.id,{kind:'plan',title:'Time for a new plan',body:`You've trained ${w} active weeks on "${P.name}". Changing the plan now keeps you progressing. Generate one from your preferences and edit it.`,action:'generate',label:'Create a new plan'});
  // stalls
  const st=[...planIds].filter(id=>stalled(id));
  if(st.length)add('stall-'+st.join(),{kind:'swap',title:`${exById(st[0]).n} has stalled`,body:'No improvement in your last 3 sessions. Swap it for a similar exercise, or take a lighter week to recover.',action:'swap',ex:st[0],label:'See alternatives'});
  // neglected muscles
  const ms=muscleStats(),big=['chest','lats','mid_back','shoulders','quads','hamstrings','glutes','abs'];
  if(S.history.length>=3){const neglected=big.filter(m=>!ms.last[m]||now-ms.last[m]>12*day);
    if(neglected.length&&neglected.length<big.length)add('neg-'+neglected.join(),{kind:'muscle',title:'Some muscles are being skipped',body:`${neglected.map(m=>MUSCLES[m]).join(', ')}: not trained in the last 12 days. Pick a day that covers them next.`,action:'muscles',label:'Open muscle map'});}
  // push/pull balance (last 28 days)
  let push=0,pull=0;S.history.filter(h=>now-h.start<28*day).forEach(h=>h.items.forEach(it=>{const e=exById(it.ex),n=(it.sets||[]).filter(s=>s.done).length;if(['chest','triceps','shoulders'].includes(e.p[0]))push+=n;if(['lats','mid_back','biceps','rear_delts'].includes(e.p[0]))pull+=n;}));

  // comeback
  const last=S.history.length?S.history[S.history.length-1].start:null;
  if(last&&now-last>6*day)add('gap-'+weekKey(now),{kind:'info',title:'Welcome back',body:`It's been ${Math.round((now-last)/day)} days. Use about 80% of your usual weights today and build back up.`,action:null});

    if(Math.sign(slope)!==dir&&Math.abs(cur-goal)>0.5)add('bw-'+weekKey(now),{kind:'info',title:'Body weight is moving away from your goal',body:`Trend: ${slope>0?'+':''}${slope.toFixed(2)} kg per week. Goal: ${goal} kg.`,action:'weight',label:'Open body weight'});}
  // first time
  if(!S.history.length)add('first',{kind:'info',title:'Your trainer plan is loaded',body:'Start with it, or tap Plans to edit it, pick a template, or create a plan from your preferences.',action:'plans',label:'Open plans'});
  return out;
}

/* =========================================================

   ========================================================= */
const AM=new Set();
const ro=new ResizeObserver(es=>es.forEach(en=>{const h=en.target._anim;if(h){sizeCanvas(h);draw(h);}}));
const io=new IntersectionObserver(es=>es.forEach(en=>{const h=en.target._anim;if(h)h.visible=en.isIntersecting;}),{rootMargin:'80px'});
function mountAnims(root){
  (root||document).querySelectorAll('canvas[data-anim]:not([data-mounted])').forEach(cv=>{
    const id=cv.dataset.anim;cv.dataset.mounted=1;const an=ANIM[id];if(!an)return;
    const h={cv,id,ex:exById(id),pad:cv.dataset.fit!=null?+cv.dataset.fit:null,speed:1,playing:!reduceMotion,phase:an.cyc?0.15:0.5,visible:true};
    cv._anim=h;AM.add(h);io.observe(cv);ro.observe(cv);sizeCanvas(h);draw(h);
  });
}
function sizeCanvas(h){const r=h.cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);const w=Math.round(r.width*d),ht=Math.round(r.height*d);if(w&&(w!==h.cv.width||ht!==h.cv.height)){h.cv.width=w;h.cv.height=ht;}}
function draw(h){if(!h.cv.width)return;renderAnim(h.cv.getContext('2d'),h.id,h.phase,h.cv.width,h.cv.height,h.ex,h.pad);}
let lastTs=0;
(function loop(ts){const dt=lastTs?Math.min(64,ts-lastTs):16;lastTs=ts;
  AM.forEach(h=>{if(!h.cv.isConnected){AM.delete(h);io.unobserve(h.cv);ro.unobserve(h.cv);return;}if(!h.visible||!h.playing)return;
    h.phase=(h.phase+dt/ANIM[h.id].dur*h.speed)%1;if(!h.cv.width)sizeCanvas(h);draw(h);});
  requestAnimationFrame(loop);})(0);
const isVid=u=>/\.(mp4|webm|mov)(\?|$)/i.test(u);
function mediaFor(ex){return S.media[ex.id]||ex.media||'';}
function thumbHTML(ex,cls){
  const m=mediaFor(ex);
  if(m)return isVid(m)?`<video class="${cls||''}" src="${esc(m)}" muted loop autoplay playsinline></video>`:`<img class="${cls||''}" src="${esc(m)}" alt="" loading="lazy">`;
  if(ex.anim)return `<canvas data-anim="${ex.id}" data-fit="6"></canvas>`;
  if(ex.photo)return `<img src="${IMG+ex.photo}/0.jpg" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'noimg',textContent:'No picture'}))">`;
  return `<span class="noimg">${esc((ex.p||[]).map(m=>MUSCLES[m]).slice(0,1).join('')||'Custom')}</span>`;
}
function flipHTML(photo){return `<div class="flip"><img src="${IMG+photo}/0.jpg" alt="Start position"><img src="${IMG+photo}/1.jpg" alt="End position" class="f2"></div>`;}

/* body heat map */
function heatSVG(vals,rgb,label){
  const col=v=>{v=Math.max(0,Math.min(1,v||0));const a=[74,70,81];return 'rgb('+a.map((x,i)=>Math.round(x+(rgb[i]-x)*v)).join(',')+')';};
  const half=list=>list.map(([m,d])=>`<path d="${d}" fill="${col(vals[m])}"><title>${MUSCLES[m]}</title></path>`).join('');
  const fig=(list,x,t)=>`<g transform="translate(${x} 0)"><g fill="var(--sil)"><ellipse cx="100" cy="32" rx="17" ry="21"/><rect x="91" y="48" width="18" height="18"/><path d="${SIL}"/><path d="${SIL}" transform="translate(200 0) scale(-1 1)"/></g>
    <g stroke="var(--s1)" stroke-width="1.3">${half(list)}<g transform="translate(200 0) scale(-1 1)">${half(list)}</g></g><text x="100" y="400" text-anchor="middle" fill="var(--muted)" font-size="14">${t}</text></g>`;
  return `<svg viewBox="20 0 380 408" role="img" aria-label="${esc(label||'Muscle map')}">${fig(FRONT,0,'Front')}${fig(BACK,200,'Back')}</svg>`;
}

/* charts */
function lineChart(pts,o){
  o=o||{};const W=340,H=150,pl=34,pr=10,pt=12,pb=24;
  if(pts.length<2)return `<p class="muted small">${pts.length?'One entry so far. Log more to see the trend.':'No data yet.'}</p>`;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y).concat(o.goal?[o.goal]:[]);
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*0.15||1;y0-=pad;y1+=pad;
  const X=x=>pl+(x-x0)/(x1-x0||1)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0||1))*(H-pt-pb);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=d+` L${X(x1).toFixed(1)} ${H-pb} L${X(x0).toFixed(1)} ${H-pb} Z`;
  const ticks=[y0+pad,(y0+y1)/2,y1-pad];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">
    <defs><linearGradient id="lg${o.id||''}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${o.color||'#f2b84b'}" stop-opacity=".35"/><stop offset="1" stop-color="${o.color||'#f2b84b'}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${(+t.toFixed(1))}</text>`).join('')}
    ${o.goal?`<line x1="${pl}" x2="${W-pr}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="${W-pr}" y="${Y(o.goal)-4}" text-anchor="end" font-size="10" fill="var(--ok)">Goal ${o.goal}</text>`:''}
    <path d="${area}" fill="url(#lg${o.id||''})"/><path d="${d}" fill="none" stroke="${o.color||'#f2b84b'}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${o.color||'#f2b84b'}"/>`).join('')}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtShort(x0)}</text><text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtShort(x1)}</text></svg>`;
}
function barChart(bars,o){
  o=o||{};const W=340,H=140,pb=22,pt=14,max=Math.max(1,...bars.map(b=>b.v)),bw=(W-10)/bars.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${bars.map((b,i)=>{const h=(H-pb-pt)*b.v/max,x=5+i*bw;
    return `<rect x="${x+bw*0.18}" y="${H-pb-h}" width="${bw*0.64}" height="${Math.max(h,b.v?2:0)}" rx="3" fill="${b.hi?'#f2b84b':'#5b5764'}"/>${b.v?`<text x="${x+bw/2}" y="${H-pb-h-4}" font-size="10" text-anchor="middle" fill="var(--muted)">${b.v}</text>`:''}<text x="${x+bw/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(b.l)}</text>`;}).join('')}</svg>`;
}
function heatmap(weeks){
  const end=new Date();end.setHours(0,0,0,0);const start=new Date(weekKey(end.getTime()));start.setDate(start.getDate()-7*(weeks-1));
  const counts={};S.history.forEach(h=>{const k=new Date(h.start).setHours(0,0,0,0);counts[k]=(counts[k]||0)+(h.items.reduce((t,i)=>t+(i.sets||[]).filter(s=>s.done).length,0)||1);});
  let cells='';for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const t=new Date(start);t.setDate(t.getDate()+w*7+d);const k=t.getTime();const c=counts[k]||0;const fut=k>end.getTime();
    cells+=`<rect x="${w*15}" y="${d*15}" width="12" height="12" rx="3" fill="${fut?'transparent':c?`rgba(242,184,75,${Math.min(1,0.3+c/25)})`:'var(--s2)'}"><title>${fmtDate(k)}: ${c?c+' sets':'rest'}</title></rect>`;}
  return `<svg class="heat" viewBox="0 0 ${weeks*15} 105" role="img" aria-label="Training days, last ${weeks} weeks">${cells}</svg>`;
}

function nextDayOf(plan){
  const hs=S.history.filter(h=>h.planId===plan.id);if(!hs.length)return plan.days[0];
  const li=plan.days.findIndex(d=>d.id===hs[hs.length-1].dayId);return plan.days[(li+1)%plan.days.length]||plan.days[0];
}
function startSession(){S.active={id:uid(),start:Date.now(),screen:'warmup',warm:{},warmEnd:null,items:[]};save();show();window.scrollTo(0,0);}
function toChoose(skipped){const a=A();a.warmEnd=Date.now();a.warmSkipped=!!skipped;a.screen='choose';save();show();window.scrollTo(0,0);}
function makeItem(it){
  const ex=exById(it.ex),target=Object.assign({},it),sets=[];
  if(it.hold||ex.stretch){sets.push({done:false,hold:it.hold||10});}
  else if(it.time){for(let k=0;k<(it.sets||1);k++)sets.push({sec:it.time,done:false});}
  else{
    const L=exLogs(it.ex),last=L.length?L[L.length-1]:null,nt=nextTarget(it.ex,it),[lo,hi]=repRange(it.reps);
    for(let k=0;k<(it.sets||1);k++){const ls=last&&last.sets[Math.min(k,last.sets.length-1)];
      const w=nt&&nt.up?nt.w:(ls?ls.w:'');const r=nt&&nt.repsUp&&ls?ls.r+2:(hi||(ls?ls.r:''));
      sets.push({w:w===''?'':w,r,done:false});}
    target.hint=nt&&(nt.up||nt.repsUp)?nt.why+(nt.up?`. Try ${nt.w} kg today.`:''):'';
  }
  return {ex:it.ex,target,sets,done:false};
}
function chooseDay(planId,dayId){
  const a=A(),P=S.plans.find(p=>p.id===planId),d=P.days.find(x=>x.id===dayId);
  Object.assign(a,{planId,dayId,dayName:d.name,workStart:Date.now(),screen:'workout',items:d.items.map(makeItem)});
  save();show();window.scrollTo(0,0);
}
function freestyle(){const a=A();Object.assign(a,{planId:null,dayId:null,dayName:'Freestyle workout',workStart:Date.now(),screen:'workout',items:[]});save();show();}
function completeItem(i,on){
  const a=A(),it=a.items[i];it.done=on;
  if(on){const now=Date.now(),prev=Math.max(a.workStart,...a.items.filter(x=>x!==it&&x.done&&x.doneAt).map(x=>x.doneAt));it.doneAt=now;it.dur=now-prev;
    it.sets.forEach(s=>{if(!s.done&&(s.r!==''||s.sec||s.hold))s.done=true;});
    if(navigator.vibrate)navigator.vibrate([30,40,30]);
    const left=a.items.filter(x=>!x.done).length;toast(left?`${exById(it.ex).n} done. ${left} to go.`:'Every exercise done. Tap Finish workout.');}
  else{delete it.doneAt;delete it.dur;}
  save();
}
function tickSet(i,k){
  const a=A(),it=a.items[i],s=it.sets[k],ex=exById(it.ex);
  s.done=!s.done;s.t=s.done?Date.now():undefined;
  if(s.done){
    if(navigator.vibrate)navigator.vibrate(20);
    s.w=+s.w||0;s.r=+s.r||0;
    // personal record check
    if(s.r>0&&!it.target.time){const rec=records(it.ex),v=e1rm(s.w,s.r),sessBest=Math.max(0,...it.sets.filter((x,j)=>j!==k&&x.done).map(x=>e1rm(x.w,x.r)));
      if(rec.sessions&&v>rec.e1+0.01&&v>sessBest){s.pr=true;toast(`New record: ${fmtKg(s.w)} kg × ${s.r}. Estimated max ${Math.round(v)} kg`);}
      else if(rec.sessions&&s.w>rec.w){s.pr=true;toast(`Heaviest ever on this lift: ${fmtKg(s.w)} kg`);}}
    const all=it.sets.every(x=>x.done);
    if(all&&!it.done)completeItem(i,true);
    if(S.settings.autoRest&&!it.target.time&&!ex.stretch){const r=it.target.rest||S.settings.rest;startTimer(r,'Rest','rest',all?'Then start the next exercise':'Then do set '+(k+2));}
  } else if(it.done){completeItem(i,false);}
  save();
}
function finishSession(){
  const a=A();if(!a)return;
  const done=a.items.filter(x=>x.done||x.sets.some(s=>s.done));
  if(!done.length&&!confirm('Nothing is ticked yet. Save this workout anyway?'))return;
  const end=Date.now();
  const entry={id:a.id,planId:a.planId,dayId:a.dayId,dayName:a.dayName,start:a.start,end,warmEnd:a.warmEnd,warmSkipped:!!a.warmSkipped,
    warmDone:Object.keys(a.warm).length,warmTotal:WARMUP.length,workStart:a.workStart,
    items:a.items.map(it=>({ex:it.ex,target:{sets:it.target.sets,reps:it.target.reps,time:it.target.time,hold:it.target.hold},sets:it.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0,sec:s.sec,done:true,pr:s.pr})),done:it.done,doneAt:it.doneAt||null,dur:it.dur||null}))};
  S.history.push(entry);S.active=null;save();summaryId=entry.id;nav='summary';stopTimer();show();window.scrollTo(0,0);
}
function endSession(){
  const a=A();
  if(a.screen==='workout'&&a.items.some(x=>x.sets.some(s=>s.done))){if(confirm('Finish and save this workout now?'))finishSession();return;}
  if(confirm('Cancel this session? Nothing will be saved.')){S.active=null;save();stopTimer();nav='home';show();}
}

/* ---------- workout ---------- */
function cardHTML(i){
  const a=A(),it=a.items[i],ex=exById(it.ex),t=it.target,isHold=!!(t.hold||ex.stretch),isTime=!!t.time&&!isHold;
  const L=exLogs(it.ex),last=L.length?L[L.length-1]:null;
  let rows='';
  if(isHold){rows=`<div class="row-actions"><button class="chipbtn" data-open="${i}">${ICON.steps} Open the stretch list</button><button class="setbtn big" data-tick="${i}:0" aria-pressed="${!!it.sets[0].done}" aria-label="Mark done">${it.sets[0].done?'✓':'1'}</button></div>`;}
  else if(isTime){rows=`<div class="row-actions">${it.sets.map((s,k)=>`<button class="setbtn" data-tick="${i}:${k}" aria-pressed="${!!s.done}" aria-label="Round ${k+1}">${s.done?'✓':k+1}</button>`).join('')}<button class="chipbtn" data-timer="${i}">${ICON.clock} ${t.time>=60?Math.round(t.time/60)+' min':t.time+' s'}</button></div>`;}
  else{
    rows=`<div class="sets"><div class="sethead"><span>Set</span><span>Last time</span><span>${ex.bw?'+kg':'kg'}</span><span>Reps</span><span></span></div>
    ${it.sets.map((s,k)=>{const ls=last&&last.sets[k];return `<div class="setrow ${s.done?'done':''}">
      <span class="sn">${s.pr?'<em title="Record">PR</em>':k+1}</span><span class="prev">${ls?`${fmtKg(ls.w)}×${ls.r}`:'–'}</span>
      <input class="w" inputmode="decimal" type="number" step="0.5" min="0" value="${s.w===''?'':fmtKg(s.w)}" data-w="${i}:${k}" aria-label="Set ${k+1} weight">
      <input class="r" inputmode="numeric" type="number" min="0" value="${s.r===''?'':s.r}" data-r="${i}:${k}" aria-label="Set ${k+1} reps">
      <button class="tick" data-tick="${i}:${k}" aria-pressed="${!!s.done}" aria-label="Set ${k+1} done">${ICON.check}</button></div>`;}).join('')}
    <div class="setfoot"><button class="link sm" data-addset="${i}">${ICON.plus} Add set</button>${it.sets.length>1?`<button class="link sm" data-rmset="${i}">Remove last set</button>`:''}${/barbell|e-z/.test(ex.equip)?`<button class="link sm" data-plates="${i}">Plate math</button>`:''}</div></div>`;
  }
  return `<li class="card wcard ${it.done?'is-done':''}" id="card-${i}">
    <div class="wtop"><button class="anim-thumb" data-open="${i}" aria-label="How to do ${esc(ex.n)}">${thumbHTML(ex)}</button>
    <div class="card-body"><button class="cname" data-open="${i}">${esc(ex.n)}</button><div class="dose"><b>${esc(doseText(t))}</b>${t.rest?`, rest ${t.rest} s`:''}</div>
      ${it.done?`<div class="donetxt">Done at ${fmtTime(it.doneAt)}, took ${fmtDur(it.dur)}</div>`:`<div class="mus">${musNames(ex)}</div>`}</div>
    <div class="wbtns"><button class="donebtn" data-done="${i}" aria-pressed="${!!it.done}" aria-label="Mark ${esc(ex.n)} complete">${ICON.check}</button><button class="iconbtn sm" data-cmenu="${i}" aria-label="More options">${ICON.dots}</button></div></div>
    ${t.hint&&!it.done?`<p class="hint">${ICON.easy}<span>${esc(t.hint)}</span></p>`:''}
    ${rows}</li>`;
}
function renderWorkout(){
  const a=A(),done=a.items.filter(x=>x.done).length;
  app.innerHTML=sessionBar(a.dayName,'Workout')+`
  <div class="pagehead"><div class="bar big"><i style="width:${a.items.length?done/a.items.length*100:0}%"></i></div><p class="muted small"><b class="hl">${done} of ${a.items.length}</b> exercises done. Weights are filled in from last time.</p></div>
  <ol class="cards" id="wlist">${a.items.map((_,i)=>cardHTML(i)).join('')}</ol>
  <button class="addbtn" id="addEx">${ICON.plus} Add an exercise to today</button>
  <div class="dock"><button class="cta wide" id="finishBtn">Finish workout</button></div>`;
  $('#endBtn').onclick=endSession;$('#finishBtn').onclick=finishSession;
  $('#addEx').onclick=()=>openPicker('Add to today',id=>{const ex=exById(id);A().items.push(makeItem(ex.cat==='cardio'?{ex:id,sets:1,time:600}:ex.stretch?{ex:id,sets:1,hold:15}:{ex:id,sets:3,reps:'8-12',rest:S.settings.rest}));save();renderWorkout();mountAnims(app);toast(ex.n+' added');});
  bindWorkout($('#wlist'));

function redrawCard(i){const el=$('#card-'+i);if(!el)return;el.outerHTML=cardHTML(i);const n=$('#card-'+i);mountAnims(n);bindWorkout(n);
  const a=A(),done=a.items.filter(x=>x.done).length;const b=app.querySelector('.pagehead .bar i');if(b)b.style.width=done/a.items.length*100+'%';const t=app.querySelector('.pagehead .hl');if(t)t.textContent=done+' of '+a.items.length;}
function bindWorkout(root){
  if(!root)return;
  root.querySelectorAll('[data-w]').forEach(inp=>inp.onchange=()=>{const [i,k]=inp.dataset.w.split(':').map(Number);A().items[i].sets[k].w=inp.value===''?'':+inp.value;save();});
  root.querySelectorAll('[data-r]').forEach(inp=>inp.onchange=()=>{const [i,k]=inp.dataset.r.split(':').map(Number);A().items[i].sets[k].r=inp.value===''?'':+inp.value;save();});
  root.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.tick.split(':').map(Number);
    const card=$('#card-'+i);if(card)card.querySelectorAll('input').forEach(inp=>inp.dispatchEvent(new Event('change')));
    tickSet(i,k);redrawCard(i);if(sheetCtx&&sheetCtx.session)refreshTracker();});
  root.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const i=+b.dataset.done;completeItem(i,!A().items[i].done);redrawCard(i);if(sheetCtx&&sheetCtx.session)refreshTracker();});
  root.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{const it=A().items[+b.dataset.addset],l=it.sets[it.sets.length-1];it.sets.push({w:l?l.w:'',r:l?l.r:'',done:false});save();redrawCard(+b.dataset.addset);});
  root.querySelectorAll('[data-rmset]').forEach(b=>b.onclick=()=>{const it=A().items[+b.dataset.rmset];it.sets.pop();save();redrawCard(+b.dataset.rmset);});
  root.querySelectorAll('[data-plates]').forEach(b=>b.onclick=()=>{const it=A().items[+b.dataset.plates],w=+(it.sets.find(s=>!s.done)||it.sets[0]).w;const p=plates(w);
    toast(!w?'Enter a weight first':!p?`${w} kg is less than the ${S.profile.bar} kg bar`:`${w} kg: ${S.profile.bar} kg bar + ${p.out.length?p.out.join(' + '):'nothing'} per side${p.left?` (${p.left} kg short)`:''}`);});
  root.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{const i=+b.dataset.timer,it=A().items[i];startTimer(it.target.time,exById(it.ex).n,'work','Keep going until the beep',()=>{const s=A();if(!s)return;const x=s.items[i];if(!x)return;const k=x.sets.findIndex(z=>!z.done);if(k>=0){tickSet(i,k);redrawCard(i);}});});
  root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet({session:true,list:A().items.map(x=>x.ex),i:+b.dataset.open,label:A().dayName}));
  root.querySelectorAll('[data-cmenu]').forEach(b=>b.onclick=()=>cardMenu(+b.dataset.cmenu));
}
function cardMenu(i){
  const it=A().items[i],ex=exById(it.ex);
  openMenu(ex.n,[
    ['Swap for a similar exercise',()=>openPicker('Swap '+ex.n,id=>{A().items[i]=makeItem(Object.assign({},it.target,{ex:id,hint:''}));save();renderWorkout();mountAnims(app);},it.ex)],
    ['Move up',()=>{if(i>0){const a=A().items;[a[i-1],a[i]]=[a[i],a[i-1]];save();renderWorkout();mountAnims(app);}}],
    ['Move down',()=>{const a=A().items;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];save();renderWorkout();mountAnims(app);}}],
    ['Remove from today',()=>{A().items.splice(i,1);save();renderWorkout();mountAnims(app);}]
  ]);
}
function timeline(h){
  const rows=[`<li class="tl"><span class="t">${fmtTime(h.start)}</span><span><b>Started</b></span></li>`];
  if(h.warmEnd)rows.push(`<li class="tl"><span class="t">${fmtTime(h.warmEnd)}</span><span><b>${h.warmSkipped?'Warm-up skipped':'Warm-up'}</b><small>${h.warmSkipped?'':`${h.warmDone} of ${h.warmTotal} moves, ${fmtDur(h.warmEnd-h.start)}`}</small></span></li>`);
  h.items.filter(x=>x.done&&x.doneAt).sort((a,b)=>a.doneAt-b.doneAt).forEach(x=>{const reps=(x.sets||[]).filter(s=>s.r).map(s=>s.w?`${fmtKg(s.w)}×${s.r}`:`${s.r}`).join(', ');
    rows.push(`<li class="tl ok"><span class="t">${fmtTime(x.doneAt)}</span><span><b>${esc(exById(x.ex).n)}${(x.sets||[]).some(s=>s.pr)?' <em class="prb">PR</em>':''}</b><small>${reps||esc(doseText(x.target||{}))}. Took ${fmtDur(x.dur)}</small></span></li>`);});
  rows.push(`<li class="tl"><span class="t">${fmtTime(h.end)}</span><span><b>Finished</b><small>Total ${fmtDur(h.end-h.start)}</small></span></li>`);
  const skipped=h.items.filter(x=>!x.done);
  return `<ol class="timeline">${rows.join('')}</ol>${skipped.length?`<p class="muted small">Not done: ${skipped.map(x=>esc(exById(x.ex).n)).join(', ')}</p>`:''}`;
}
function renderSummary(){
  const h=S.history.find(x=>x.id===summaryId);if(!h)return go('home');
  let sets=0,vol=0,prs=[];h.items.forEach(i=>(i.sets||[]).forEach(s=>{sets++;vol+=s.w*s.r;if(s.pr)prs.push(`${exById(i.ex).n}: ${fmtKg(s.w)} kg × ${s.r}`);}));
  app.innerHTML=brand()+`<section class="hero done-hero"><canvas class="hero-anim" data-anim="w_armcircle" data-fit="10" aria-hidden="true"></canvas><div class="hero-txt">
    <p class="eyebrow">Workout saved</p><h1>Great work, ${esc(S.profile.name||'Kundan')}</h1><p>${esc(h.dayName)} is in your history.</p></div></section>
  <div class="stats"><div class="stat"><b>${fmtDur(h.end-h.start)}</b><span>Total time</span></div><div class="stat"><b>${sets}</b><span>Sets</span></div><div class="stat"><b>${fmtVol(vol)}</b><span>Volume</span></div></div>
  ${prs.length?`<div class="banner"><b>${prs.length} new record${prs.length>1?'s':''}</b><br>${prs.map(esc).join('<br>')}</div>`:''}
  <h2 class="sec">How it went</h2>${timeline(h)}<button class="cta wide" id="homeBtn">Back to home</button>`;
  bindBrand();$('#homeBtn').onclick=()=>go('home');
}

let lib={q:'',m:'',eq:'',anim:false,n:40};
function filterEx(f,swapOf){
  const q=f.q.toLowerCase().trim(),words=q.split(/\s+/).filter(Boolean);
  let ids=allExIds().filter(id=>{const e=exById(id);if(e.cat==='warmup'&&!f.showWarm)return false;
    if(f.m&&!e.p.includes(f.m)&&!(e.s||[]).includes(f.m))return false;if(f.eq&&e.equip!==f.eq)return false;if(f.anim&&!e.anim)return false;
    if(words.length){const hay=(e.n+' '+(e.aka||'')+' '+e.p.map(m=>MUSCLES[m]).join(' ')).toLowerCase();if(!words.every(w=>hay.includes(w)))return false;}return true;});
  const sc=id=>{const e=exById(id);return (e.curated?100:0)+(id.startsWith('c:')?120:0)+(f.m&&e.p[0]===f.m?30:0)+(e.cat==='strength'?10:0)+scoreEx(e)/4;};
  return ids.sort((a,b)=>sc(b)-sc(a));
}

function pOverview(){

}

function pMuscles(){

  if(muscleMode==='volume'){Object.keys(ms.vol).forEach(m=>vals[m]=Math.min(1,ms.vol[m]/14));rgb=[242,184,75];legend='Sets in the last 7 days. 10–20 sets a week per muscle is a good target.';
    rows=Object.keys(MUSCLES).sort((a,b)=>ms.vol[b]-ms.vol[a]).map(m=>[m,ms.vol[m]?`${+ms.vol[m].toFixed(1)} sets`:'none']);}
  else if(muscleMode==='recovery'){Object.keys(ms.fat).forEach(m=>vals[m]=Math.min(1,ms.fat[m]/6));rgb=[255,84,54];legend='Red means recently trained and still recovering. Grey means ready.';
    rows=Object.keys(MUSCLES).sort((a,b)=>ms.fat[b]-ms.fat[a]).map(m=>[m,vals[m]>0.6?'Recovering':vals[m]>0.25?'Almost ready':'Ready']);}
  else{Object.keys(ms.last).forEach(m=>{const d=ms.last[m]?(now-ms.last[m])/DAY:99;vals[m]=Math.min(1,d/14);});rgb=[120,150,255];legend='Blue means not trained for a while (14+ days is fully blue).';
    rows=Object.keys(MUSCLES).sort((a,b)=>(ms.last[a]||0)-(ms.last[b]||0)).map(m=>[m,ms.last[m]?daysAgo(ms.last[m]):'never']);}

  <div class="panel center">${heatSVG(vals,rgb,'Muscle map')}<p class="muted small">${legend}</p></div>
  <ul class="kglist">${rows.map(([m,t])=>`<li><span>${MUSCLES[m]}</span><b>${t}</b></li>`).join('')}</ul>`;

let tEnd=0,tTotal=0,tInt=null,tKind='rest',tDone=null,audioCtx=null;
function beep(n=3){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();for(let k=0;k<n;k++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=k===n-1?1046:784;o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime+k*0.28;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(0.4,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.start(t);o.stop(t+0.24);}}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200,100,300]);}
function startTimer(sec,label,kind,subTxt,onDone){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume();}catch(e){}
  tTotal=sec;tEnd=Date.now()+sec*1000;tKind=kind;tDone=onDone||null;
  $('#timerWhat').textContent=label;$('#timerSub').textContent=subTxt||(kind==='rest'?'Next set when this hits zero':'Keep going until the beep');
  const T=$('#timer');T.classList.add('show');T.classList.remove('ended');document.body.classList.add('timer-on');$('#timerStop').textContent='Skip';clearInterval(tInt);tick();tInt=setInterval(tick,250);
}
function tick(){const left=(tEnd-Date.now())/1000;$('#timerClock').textContent=fmtClock(Math.ceil(left));$('#timerBar').style.width=Math.max(0,Math.min(100,(1-left/tTotal)*100))+'%';
  if(left<=0){clearInterval(tInt);beep();const T=$('#timer');T.classList.add('ended');$('#timerSub').textContent=tKind==='rest'?'Rest over. Start your next set.':'Time! Nice work.';$('#timerStop').textContent='Close';
    const cb=tDone;tDone=null;if(cb)cb();setTimeout(()=>{if(T.classList.contains('ended')){T.classList.remove('show');document.body.classList.remove('timer-on');}},5000);}}
function stopTimer(){clearInterval(tInt);tDone=null;$('#timer').classList.remove('show','ended');document.body.classList.remove('timer-on');}
$('#timerAdd').onclick=()=>{tEnd+=15000;tTotal+=15;const T=$('#timer');if(T.classList.contains('ended')){T.classList.remove('ended');$('#timerStop').textContent='Skip';clearInterval(tInt);tInt=setInterval(tick,250);}tick();};
$('#timerStop').onclick=stopTimer;
let wakeLock=null;
async function applyWake(){try{if(S.settings.wake&&A()&&'wakeLock' in navigator){if(!wakeLock)wakeLock=await navigator.wakeLock.request('screen');}else if(wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wakeLock=null;applyWake();tickElapsed();}});
function tickElapsed(){document.querySelectorAll('[data-elapsed]').forEach(el=>el.textContent=fmtClock((Date.now()-(+el.dataset.elapsed))/1000));}
setInterval(tickElapsed,1000);
document.querySelectorAll('.bnav button').forEach(b=>b.onclick=()=>go(b.dataset.nav));
if(S.active&&Date.now()-S.active.start>8*3600e3){const a=S.active;if(a.screen==='workout'&&a.items.some(x=>x.sets.some(s=>s.done)))finishSession();else S.active=null;save();nav='home';}
show();
